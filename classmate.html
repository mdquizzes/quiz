<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassMate Word Search</title>

<style>

:root{

--blue:#0B3D91;
--blue2:#1565C0;
--light:#F5F7FB;
--green:#2E7D32;
--gold:#F9A825;
--red:#D32F2F;
--shadow:0 10px 25px rgba(0,0,0,.15);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;

}

body{

background:#081b33;
height:100vh;
overflow:hidden;

}

#app{

width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.page{

display:none;
width:96%;
height:94%;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:var(--shadow);

}

.page.active{

display:flex;
flex-direction:column;

}

.header{

background:var(--blue);
color:white;
padding:18px;
font-size:30px;
font-weight:bold;
text-align:center;
letter-spacing:2px;

}

.content{

flex:1;
padding:25px;
overflow:auto;

}

.card{

background:var(--light);
border-radius:15px;
padding:25px;
box-shadow:var(--shadow);
max-width:600px;
margin:0 auto;

}

h2{

margin-bottom:20px;
color:var(--blue);

}

label{

display:block;
margin-top:20px;
font-weight:bold;
font-size:18px;

}

textarea{

width:100%;
height:260px;
padding:15px;
font-size:18px;
border-radius:10px;
border:2px solid #ccc;
resize:none;
margin-top:8px;

}

select{

width:100%;
padding:10px;
font-size:18px;
border-radius:8px;
margin-top:8px;
border:2px solid #ccc;

}

button{

border:none;
padding:15px 35px;
font-size:18px;
cursor:pointer;
border-radius:10px;
transition:.25s;
margin-top:20px;

}

.primary{

background:var(--blue2);
color:white;

}

.primary:hover{

transform:scale(1.05);

}

.success{

background:var(--green);
color:white;

}

.success:hover{

transform:scale(1.05);

}

.studentGrid{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;

}

.studentCard{

background:white;
border:3px solid var(--blue2);
padding:25px;
text-align:center;
font-size:24px;
font-weight:bold;
border-radius:15px;
cursor:pointer;
transition:.25s;

}

.studentCard:hover{

background:var(--blue2);
color:white;
transform:scale(1.04);

}

.studentDone{

background:var(--green)!important;
color:white!important;
border:none!important;
pointer-events:none;

}

.gameContainer{

display:grid;
grid-template-columns:1fr 330px;
gap:20px;
height:100%;

}

.left{

display:flex;
flex-direction:column;
background:#fafafa;
border-radius:15px;
padding:15px;

}

.right{

background:#FFF8E1;
border-radius:15px;
padding:20px;
overflow-y:auto;

}

.infoBar{

display:flex;
justify-content:space-between;
align-items:center;
font-size:16px;
font-weight:bold;
margin-bottom:15px;
flex-wrap:wrap;
gap:10px;

}

.timerBarContainer{

flex:1;
min-width:200px;
height:20px;
background:#ddd;
border-radius:10px;
overflow:hidden;

}

#timerBar{

height:100%;
background:#4CAF50;
width:100%;
transition:width 0.3s;

}

.gridHolder{

flex:1;
display:flex;
justify-content:center;
align-items:center;
overflow:auto;
padding:10px;

}

#grid{

display:grid;
gap:4px;
padding:10px;
background:white;
border-radius:10px;

}

.cell{

width:40px;
height:40px;
display:flex;
justify-content:center;
align-items:center;
background:#ECEFF1;
font-weight:bold;
font-size:16px;
cursor:pointer;
border-radius:6px;
user-select:none;
transition:.15s;
border:2px solid transparent;

}

.cell:hover{

background:#90CAF9;

}

.cell.selected{

background:#2196F3;
color:white;
border:2px solid #0B3D91;

}

.cell.correct{

background:#4CAF50;
color:white;

}

.bottomBar{

display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
gap:10px;
flex-wrap:wrap;

}

#selectedWord{

font-size:18px;
font-weight:bold;
color:var(--blue);
padding:10px;
background:#F0F0F0;
border-radius:8px;
min-height:20px;

}

.wordCounter{

font-size:16px;
font-weight:bold;
color:var(--blue);

}

.controls{

display:flex;
gap:15px;

}

.controls button{

margin:0;
padding:10px 20px;
font-size:16px;

}

#leaderboard{

margin-top:10px;
font-size:18px;
line-height:2.2;

}

.leaderboard-item{

display:flex;
justify-content:space-between;
padding:5px 0;
border-bottom:1px solid #ddd;

}

.leaderboard-item .rank{

font-weight:bold;
min-width:30px;

}

.leaderboard-item .score{

font-weight:bold;
color:var(--green);

}

.popup{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:center;
z-index:1000;

}

.popupBox{

background:white;
padding:40px;
border-radius:20px;
text-align:center;
width:420px;
box-shadow:var(--shadow);

}

.popupBox h1{

color:var(--blue);

}

.popupBox h2{

color:var(--blue2);
margin:20px 0;

}

</style>

</head>

<body>

<div id="app">

<!-- ====================== -->
<!-- TEACHER PAGE -->
<!-- ====================== -->

<div id="setupPage" class="page active">

<div class="header">CLASSMATE WORD SEARCH</div>

<div class="content">

<div class="card">

<h2>Teacher Setup</h2>

<label>Student Names (One Per Line)</label>

<textarea id="studentInput"></textarea>

<label>Time Limit</label>

<select id="timeSelect">

<option value="60">1 Minute</option>

<option value="120" selected>2 Minutes</option>

<option value="180">3 Minutes</option>

<option value="300">5 Minutes</option>

</select>

<label>Grid Size</label>

<select id="gridSelect">

<option value="10">10x10</option>

<option value="15" selected>15x15</option>

<option value="20">20x20</option>

<option value="25">25x25</option>

</select>

<button id="startBtn" class="primary">START GAME</button>

</div>

</div>

</div>

<!-- ====================== -->
<!-- STUDENT PAGE -->
<!-- ====================== -->

<div id="studentPage" class="page">

<div class="header">SELECT YOUR NAME</div>

<div class="content">

<div id="studentGrid" class="studentGrid"></div>

</div>

</div>

<!-- ====================== -->
<!-- GAME PAGE -->
<!-- ====================== -->

<div id="gamePage" class="page">

<div class="header">CLASSMATE WORD SEARCH</div>

<div class="content">

<div class="gameContainer">

<div class="left">

<div class="infoBar">

<div class="timerBarContainer">
<div id="timerBar"></div>
</div>

<div style="min-width:120px;">Player: <span id="playerName" style="font-weight:bold;color:var(--blue2)"></span></div>

<div style="min-width:100px;">Time: <span id="timer">00:00</span></div>

</div>

<div class="gridHolder">
<div id="grid"></div>
</div>

<div class="bottomBar">

<div class="wordCounter">
Found: <span id="foundCount">0</span> / <span id="totalWords">0</span>
</div>

<div id="selectedWord"></div>

<div class="controls">

<button id="clearBtn" class="primary">CLEAR</button>

<button id="submitBtn" class="success">SUBMIT</button>

<button id="finishBtn" class="primary">FINISH</button>

</div>

</div>

</div>

<div class="right">

<h2 style="text-align:center;color:#F57C00">🏆 Leaderboard</h2>

<div id="leaderboard">No Scores Yet</div>

<h2 style="text-align:center;color:#1976D2;font-size:18px;margin-top:20px;">📝 Names</h2>

<div id="namesList" style="font-size:14px;line-height:1.8;"></div>

</div>

</div>

</div>

</div>

</div>

<div id="popup" class="popup">

<div class="popupBox">

<h1>⏰ TIME UP</h1>

<h2 id="popupText"></h2>

<button id="nextBtn" class="primary">NEXT PLAYER</button>

</div>

</div>

<div id="winnerPopup" class="popup">

<div class="popupBox">

<h1>🏆 CHAMPION</h1>

<h2 id="winnerName"></h2>

<table id="finalTable" style="width:100%;margin:20px 0;border-collapse:collapse;">

</table>

<button id="newGameBtn" class="primary">NEW GAME</button>

</div>

</div>

<script>

//==================================================
// GLOBAL VARIABLES
//==================================================

let gridSize = 15;
let students = [];
let leaderboard = [];

let currentPlayer = "";
let currentScore = 0;

let gameTime = 120;
let timer = 120;
let timerInterval = null;

let puzzle = [];
let selectedCells = [];
let selectedWord = "";
let foundWords = [];

//==================================================
// ELEMENTS
//==================================================

const setupPage = document.getElementById("setupPage");
const studentPage = document.getElementById("studentPage");
const gamePage = document.getElementById("gamePage");
const studentGrid = document.getElementById("studentGrid");
const startBtn = document.getElementById("startBtn");
const studentInput = document.getElementById("studentInput");
const timeSelect = document.getElementById("timeSelect");
const gridSelect = document.getElementById("gridSelect");
const leaderboardDiv = document.getElementById("leaderboard");
const playerName = document.getElementById("playerName");
const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");

//==================================================
// START GAME
//==================================================

startBtn.addEventListener("click", setupGame);

function setupGame(){

  students = [];
  leaderboard = [];

  let list = studentInput.value
    .split("\n")
    .map(x=>x.trim())
    .filter(x=>x!="");

  list = [...new Set(list)];

  if(list.length < 2){
    alert("Please enter at least 2 students.");
    return;
  }

  gameTime = parseInt(timeSelect.value);
  gridSize = parseInt(gridSelect.value);
  students = list;

  students.forEach(name=>{
    leaderboard.push({
      name:name,
      score:0,
      played:false,
      found:[]
    });
  });

  buildStudentCards();
  refreshLeaderboard();
  setupPage.classList.remove("active");
  studentPage.classList.add("active");
}

//==================================================
// STUDENT CARDS
//==================================================

function buildStudentCards(){

  studentGrid.innerHTML="";

  students.forEach(name=>{
    let card=document.createElement("div");
    card.className="studentCard";
    card.dataset.name=name;
    card.innerHTML="👤<br>"+name;
    card.onclick=function(){
      beginTurn(name);
    };
    studentGrid.appendChild(card);
  });
}

//==================================================
// BEGIN TURN
//==================================================

function beginTurn(name){

  currentPlayer=name;
  currentScore=0;
  selectedCells=[];
  selectedWord="";
  foundWords=[];

  playerName.innerHTML=name;
  timer=gameTime;
  updateTimer();

  studentPage.classList.remove("active");
  gamePage.classList.add("active");

  generatePuzzle();
  renderGrid();
  updateNamesList();
  refreshLeaderboard();

  startTimer();
}

//==================================================
// GENERATE PUZZLE
//==================================================

function generatePuzzle(){

  puzzle = [];
  for(let i=0; i<gridSize*gridSize; i++){
    puzzle.push({
      letter: String.fromCharCode(65 + Math.floor(Math.random()*26)),
      index: i,
      isSelected: false
    });
  }

  // Place student names in grid
  students.forEach(name => {
    placeNameInGrid(name.toUpperCase());
  });
}

function placeNameInGrid(name){

  const directions = [
    {x:1, y:0},  // right
    {x:-1, y:0}, // left
    {x:0, y:1},  // down
    {x:0, y:-1}, // up
    {x:1, y:1},  // diagonal down-right
    {x:-1, y:-1}, // diagonal up-left
    {x:1, y:-1},  // diagonal down-left
    {x:-1, y:1}   // diagonal up-right
  ];

  let placed = false;
  let attempts = 0;

  while(!placed && attempts < 50){
    attempts++;

    const direction = directions[Math.floor(Math.random()*directions.length)];
    const startRow = Math.floor(Math.random()*gridSize);
    const startCol = Math.floor(Math.random()*gridSize);

    let canPlace = true;
    let positions = [];

    for(let i=0; i<name.length; i++){
      const row = startRow + (direction.y * i);
      const col = startCol + (direction.x * i);

      if(row < 0 || row >= gridSize || col < 0 || col >= gridSize){
        canPlace = false;
        break;
      }

      const index = row * gridSize + col;
      positions.push(index);
    }

    if(canPlace){
      for(let i=0; i<name.length; i++){
        puzzle[positions[i]].letter = name[i];
      }
      placed = true;
    }
  }
}

//==================================================
// RENDER GRID
//==================================================

function renderGrid(){

  const gridDiv = document.getElementById("grid");
  gridDiv.innerHTML = "";
  gridDiv.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

  puzzle.forEach((cell, index) => {
    const cellDiv = document.createElement("div");
    cellDiv.className = "cell";
    cellDiv.textContent = cell.letter;
    cellDiv.dataset.index = index;

    if(cell.isSelected){
      cellDiv.classList.add("selected");
    }

    cellDiv.onclick = function(){
      selectCell(index);
    };

    gridDiv.appendChild(cellDiv);
  });
}

//==================================================
// CELL SELECTION
//==================================================

function selectCell(index){

  const cell = puzzle[index];

  if(selectedCells.includes(index)){
    selectedCells = selectedCells.filter(i => i !== index);
    cell.isSelected = false;
  } else {
    selectedCells.push(index);
    cell.isSelected = true;
  }

  selectedWord = selectedCells.map(i => puzzle[i].letter).join("");
  document.getElementById("selectedWord").textContent = selectedWord || "No selection";

  renderGrid();
}

//==================================================
// SUBMIT WORD
//==================================================

document.getElementById("submitBtn").onclick = function(){

  if(selectedWord.length === 0){
    alert("Select letters first!");
    return;
  }

  const matchedName = students.find(name => name.toUpperCase() === selectedWord);

  if(matchedName && !foundWords.includes(matchedName.toUpperCase())){
    foundWords.push(matchedName.toUpperCase());
    currentScore += matchedName.length * 10; // 10 points per letter

    // Mark cells as correct
    selectedCells.forEach(index => {
      puzzle[index].isSelected = false;
      puzzle[index].correct = true;
    });

    document.getElementById("foundCount").textContent = foundWords.length;

    selectedCells = [];
    selectedWord = "";
    document.getElementById("selectedWord").textContent = "";

    renderGrid();
    updateLeaderboardScore();
    updateNamesList();

  } else if(matchedName){
    alert("Already found: " + matchedName);
    selectedCells = [];
    selectedWord = "";
    document.getElementById("selectedWord").textContent = "";
    renderGrid();
  } else {
    alert("Not a classmate name!");
    selectedCells = [];
    selectedWord = "";
    document.getElementById("selectedWord").textContent = "";
    renderGrid();
  }
};

document.getElementById("clearBtn").onclick = function(){
  selectedCells.forEach(index => {
    puzzle[index].isSelected = false;
  });
  selectedCells = [];
  selectedWord = "";
  document.getElementById("selectedWord").textContent = "";
  renderGrid();
};

//==================================================
// TIMER
//==================================================

function startTimer(){

  clearInterval(timerInterval);

  timerInterval=setInterval(()=>{
    timer--;
    updateTimer();

    if(timer<=0){
      clearInterval(timerInterval);
      finishTurn();
    }
  },1000);
}

function updateTimer(){

  let m=Math.floor(timer/60);
  let s=timer%60;

  timerText.innerHTML=
    String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

  let percent=(timer/gameTime)*100;
  const bar=document.getElementById("timerBar");

  bar.style.width=percent+"%";

  if(percent<50){
    bar.style.background="#F9A825";
  }

  if(percent<25){
    bar.style.background="#D32F2F";
  }
}

//==================================================
// UPDATE NAMES LIST
//==================================================

function updateNamesList(){

  const namesList = document.getElementById("namesList");
  namesList.innerHTML = "";

  students.forEach(name => {
    const found = foundWords.includes(name.toUpperCase());
    const span = document.createElement("div");
    span.style.color = found ? "#4CAF50" : "#666";
    span.textContent = (found ? "✓ " : "○ ") + name;
    namesList.appendChild(span);
  });
}

//==================================================
// LEADERBOARD
//==================================================

function updateLeaderboardScore(){

  leaderboard.forEach(player=>{
    if(player.name==currentPlayer){
      player.score=currentScore;
    }
  });

  refreshLeaderboard();
}

function refreshLeaderboard(){

  leaderboard.sort((a,b)=>b.score-a.score);

  leaderboardDiv.innerHTML="";

  leaderboard.forEach((player,index)=>{
    const div = document.createElement("div");
    div.className = "leaderboard-item";
    div.innerHTML = `
      <span class="rank">${index+1}.</span>
      <span>${player.name}</span>
      <span class="score">${player.score}</span>
    `;
    leaderboardDiv.appendChild(div);
  });
}

//==================================================
// FINISH TURN
//==================================================

document.getElementById("finishBtn").onclick = function(){
  clearInterval(timerInterval);
  finishTurn();
};

function finishTurn(){

  clearInterval(timerInterval);

  leaderboard.forEach(player=>{
    if(player.name==currentPlayer){
      player.score=currentScore;
      player.played=true;
    }
  });

  refreshLeaderboard();

  document.getElementById("popup").style.display="flex";
  document.getElementById("popupText").innerHTML=
    currentPlayer+"<br><br>Score : <b>"+currentScore+"</b><br>Found: <b>"+foundWords.length+"</b> names";
}

//==================================================
// NEXT PLAYER
//==================================================

document.getElementById("nextBtn").onclick=function(){

  document.getElementById("popup").style.display="none";

  document.querySelectorAll(".studentCard").forEach(card=>{
    if(card.dataset.name==currentPlayer){
      card.classList.add("studentDone");
    }
  });

  gamePage.classList.remove("active");
  studentPage.classList.add("active");

  let finished=true;

  leaderboard.forEach(player=>{
    if(!player.played){
      finished=false;
    }
  });

  if(finished){
    setTimeout(showWinner, 1000);
  }
};

function showWinner(){

  leaderboard.sort((a,b)=>b.score-a.score);

  document.getElementById("winnerPopup").style.display="flex";

  document.getElementById("winnerName").innerHTML=
    leaderboard[0].name + " 🎉";

  document.getElementById("finalTable").innerHTML="";

  leaderboard.forEach((player,index)=>{
    let row=document.createElement("tr");
    row.style.borderBottom="1px solid #ddd";
    row.innerHTML=`
      <td style="padding:10px;text-align:left;"><strong>${index+1}. ${player.name}</strong></td>
      <td style="padding:10px;text-align:right;color:var(--green);font-weight:bold;">${player.score}</td>
    `;
    document.getElementById("finalTable").appendChild(row);
  });
}

document.getElementById("newGameBtn").onclick = function(){
  location.reload();
};

</script>

</body>

</html>
