<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassMate Word Search</title>

<style>

:root{

--blue:#0B3D91;
--blue2:#1565C0;
--light:#F5F7FB;
--green:#2E7D32;
--gold:#F9A825;
--red:#D32F2F;
--shadow:0 10px 25px rgba(0,0,0,.15);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;

}

body{

background:#081b33;
height:100vh;
overflow:hidden;

}

#app{

width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.page{

display:none;
width:96%;
height:94%;
background:white;
border-radius:18px;
overflow:hidden;
box-shadow:var(--shadow);

}

.page.active{

display:flex;
flex-direction:column;

}

.header{

background:var(--blue);
color:white;
padding:18px;
font-size:30px;
font-weight:bold;
text-align:center;
letter-spacing:2px;

}

.content{

flex:1;
padding:25px;
overflow:auto;

}

.card{

background:var(--light);
border-radius:15px;
padding:25px;
box-shadow:var(--shadow);

}

h2{

margin-bottom:20px;
color:var(--blue);

}

label{

display:block;
margin-top:20px;
font-weight:bold;
font-size:18px;

}

textarea{

width:100%;
height:260px;
padding:15px;
font-size:18px;
border-radius:10px;
border:2px solid #ccc;
resize:none;
margin-top:8px;

}

select{

padding:10px;
font-size:18px;
border-radius:8px;
margin-top:8px;

}

button{

border:none;
padding:15px 35px;
font-size:18px;
cursor:pointer;
border-radius:10px;
transition:.25s;

}

.primary{

background:var(--blue2);
color:white;

}

.primary:hover{

transform:scale(1.05);

}

.success{

background:var(--green);
color:white;

}

.success:hover{

transform:scale(1.05);

}

.studentGrid{

display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:20px;

}

.studentCard{

background:white;
border:3px solid var(--blue2);
padding:25px;
text-align:center;
font-size:24px;
font-weight:bold;
border-radius:15px;
cursor:pointer;
transition:.25s;

}

.studentCard:hover{

background:var(--blue2);
color:white;
transform:scale(1.04);

}

.studentDone{

background:var(--green)!important;
color:white!important;
border:none!important;
pointer-events:none;

}

.gameContainer{

display:grid;
grid-template-columns:1fr 330px;
gap:20px;
height:100%;

}

.left{

display:flex;
flex-direction:column;
background:#fafafa;
border-radius:15px;
padding:15px;

}

.right{

background:#FFF8E1;
border-radius:15px;
padding:20px;

}

.infoBar{

display:flex;
justify-content:space-between;
font-size:22px;
font-weight:bold;
margin-bottom:15px;

}

.gridHolder{

flex:1;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

}

#grid{

display:grid;
gap:3px;

}

.cell{

width:34px;
height:34px;
display:flex;
justify-content:center;
align-items:center;
background:#ECEFF1;
font-weight:bold;
font-size:20px;
cursor:pointer;
border-radius:6px;
user-select:none;
transition:.15s;

}

.cell:hover{

background:#90CAF9;

}

.cell.selected{

background:#2196F3;
color:white;

}

.cell.correct{

background:#4CAF50;
color:white;

}

.bottomBar{

display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;

}

#selectedWord{

font-size:22px;
font-weight:bold;
color:var(--blue);

}

.controls{

display:flex;
gap:15px;

}

#leaderboard{

margin-top:20px;
font-size:22px;
line-height:2;

}

.popup{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:center;

}

.popupBox{

background:white;
padding:40px;
border-radius:20px;
text-align:center;
width:420px;

}

.popupBox h1{

color:var(--blue);

}

</style>

</head>

<body>

<div id="app">

<!-- ====================== -->
<!-- TEACHER PAGE -->
<!-- ====================== -->

<div id="setupPage" class="page active">

<div class="header">

CLASSMATE WORD SEARCH

</div>

<div class="content">

<div class="card">

<h2>Teacher Setup</h2>

<label>

Student Names (One Per Line)

</label>

<textarea id="studentInput"></textarea>

<label>

Time Limit

</label>

<select id="timeSelect">

<option value="60">1 Minute</option>

<option value="120" selected>2 Minutes</option>

<option value="180">3 Minutes</option>

<option value="300">5 Minutes</option>

</select>

<br><br>

<button id="startBtn" class="primary">

START GAME

</button>

</div>

</div>

</div>

<!-- ====================== -->
<!-- STUDENT PAGE -->
<!-- ====================== -->

<div id="studentPage" class="page">

<div class="header">

SELECT YOUR NAME

</div>

<div class="content">

<div id="studentGrid" class="studentGrid">

</div>

</div>

</div>

<!-- ====================== -->
<!-- GAME PAGE -->
<!-- ====================== -->

<div id="gamePage" class="page">

<div class="header">

CLASSMATE WORD SEARCH

</div>

<div class="content">

<div class="gameContainer">

<div class="left">

<div class="infoBar">
<div id="timerBarBox">
<div id="timerBar"></div>
</div>
<div>

Player :

<span id="playerName"></span>

</div>

<div>

Score :

<span id="score">0</span>

</div>

<div>

Time :

<span id="timer">00:00</span>

</div>

</div>

<div class="gridHolder">

<div id="grid">

</div>

</div>

<div class="bottomBar">
  <div id="wordCounter">

Words Found :

<span id="foundCount">

0

</span>

/

<span id="totalWords">

0

</span>

</div>

<div>

Selected :

<span id="selectedWord"></span>

</div>

<div class="controls">

<button id="clearBtn" class="primary">

CLEAR

</button>

<button id="finishBtn" class="success">

FINISH TURN

</button>

</div>

</div>

</div>

<div class="right">

<h2 style="text-align:center;color:#F57C00">

🏆 Leaderboard

</h2>

<div id="leaderboard">

No Scores Yet

</div>

</div>

</div>

</div>

</div>

</div>

<div id="popup" class="popup">

<div class="popupBox">

<h1>

TIME UP

</h1>

<h2 id="popupText">

</h2>

<br>

<button id="nextBtn" class="primary">

NEXT PLAYER

</button>

</div>

</div>
<div id="winnerPopup">

<div id="winnerCard">

<h1>

🏆 Champion

</h1>

<h2 id="winnerName">

</h2>

<table id="finalTable">

</table>

<button id="newGameBtn"

class="primary">

NEW GAME

</button>

</div>

</div>
<script>

//==================================================
// GLOBAL VARIABLES
//==================================================

const GRID_COLS = 30;
const GRID_ROWS = 18;

let students = [];
let leaderboard = [];

let currentPlayer = "";
let currentScore = 0;

let gameTime = 120;
let timer = 120;
let timerInterval = null;

let puzzle = [];

let foundWords = [];

let selectedCells = [];
let selectedWord = "";


//==================================================
// ELEMENTS
//==================================================

const setupPage = document.getElementById("setupPage");
const studentPage = document.getElementById("studentPage");
const gamePage = document.getElementById("gamePage");

const studentGrid = document.getElementById("studentGrid");

const startBtn = document.getElementById("startBtn");

const studentInput = document.getElementById("studentInput");

const timeSelect = document.getElementById("timeSelect");

const leaderboardDiv = document.getElementById("leaderboard");

const playerName = document.getElementById("playerName");

const scoreText = document.getElementById("score");

const timerText = document.getElementById("timer");


//==================================================
// START GAME
//==================================================

startBtn.addEventListener("click", setupGame);

function setupGame(){

students = [];

leaderboard = [];

let list = studentInput.value
.split("\n")
.map(x=>x.trim())
.filter(x=>x!="");

// remove duplicate names

list = [...new Set(list)];

if(list.length < 2){

alert("Please enter at least 2 students.");

return;

}

gameTime = parseInt(timeSelect.value);

students = list;

students.forEach(name=>{

leaderboard.push({

name:name,

score:0,

played:false

});

});

buildStudentCards();

refreshLeaderboard();

setupPage.classList.remove("active");

studentPage.classList.add("active");

}


//==================================================
// STUDENT CARDS
//==================================================

function buildStudentCards(){

studentGrid.innerHTML="";

students.forEach(name=>{

let card=document.createElement("div");

card.className="studentCard";

card.dataset.name=name;

card.innerHTML="👤<br>"+name;

card.onclick=function(){

beginTurn(name);

};

studentGrid.appendChild(card);

});

}


//==================================================
// BEGIN TURN
//==================================================

function beginTurn(name){

currentPlayer=name;

currentScore=0;

selectedCells=[];

selectedWord="";

foundWords=[];

playerName.innerHTML=name;

scoreText.innerHTML="0";

timer=gameTime;

updateTimer();

studentPage.classList.remove("active");

gamePage.classList.add("active");

startTimer();

generatePuzzle();

}


//==================================================
// TIMER
//==================================================

function startTimer(){

clearInterval(timerInterval);

timerInterval=setInterval(()=>{

timer--;

updateTimer();

if(timer<=0){

clearInterval(timerInterval);

finishTurn();

}

},1000);

}

function updateTimer(){

let m=Math.floor(timer/60);

let s=timer%60;

timerText.innerHTML=

String(m).padStart(2,"0")

+":"

+

String(s).padStart(2,"0");

let percent=(timer/gameTime)*100;

const bar=document.getElementById("timerBar");

bar.style.width=percent+"%";

if(percent<50){

bar.style.background="#F9A825";

}

if(percent<25){

bar.style.background="#D32F2F";

}

}


//==================================================
// LEADERBOARD
//==================================================

function refreshLeaderboard(){

leaderboard.sort((a,b)=>b.score-a.score);

leaderboardDiv.innerHTML="";

leaderboard.forEach((player,index)=>{

let row=document.createElement("div");

row.style.marginBottom="10px";

row.innerHTML=

(index+1)+". "

+

player.name+

"<span style='float:right'>"

+

player.score+

"</span>";

leaderboardDiv.appendChild(row);

});

}


//==================================================
// FINISH TURN
//==================================================

function finishTurn(){

clearInterval(timerInterval);

leaderboard.forEach(player=>{

if(player.name==currentPlayer){

player.score=currentScore;

player.played=true;

}

});

refreshLeaderboard();

popup.style.display="flex";

popupText.innerHTML=

currentPlayer+

"<br><br>Score : <b>"+

currentScore+

"</b>";

}


//==================================================
// NEXT PLAYER
//==================================================

nextBtn.onclick=function(){

popup.style.display="none";

document.querySelectorAll(".studentCard").forEach(card=>{

if(card.dataset.name==currentPlayer){

card.classList.add("studentDone");

}

});

gamePage.classList.remove("active");

studentPage.classList.add("active");

let finished=true;

leaderboard.forEach(player=>{

if(!player.played){

finished=false;

}

});

if(finished){

function showWinner(){

leaderboard.sort((a,b)=>b.score-a.score);

document.getElementById("winnerPopup").style.display="flex";

document.getElementById("winnerName").innerHTML=

leaderboard[0].name;

document.getElementById("finalTable").innerHTML="";

leaderboard.forEach(player=>{

let row=document.createElement("tr");

row.innerHTML="<td>"+player.name+"</td><td style='text-align:right'>"+player.score+"</td>";

document.getElementById("finalTable").appendChild(row);

});

}

setTimeout(showWinner, 1000);

}

};

nextBtn.onclick.newGameBtn = function(){

setupPage.classList.add("active");

document.getElementById("winnerPopup").style.display="none";

};

document.getElementById("newGameBtn").onclick = function(){

setupPage.classList.add("active");

document.getElementById("winnerPopup").style.display="none";

};

</script>

</body>

</html>
