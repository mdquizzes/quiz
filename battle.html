
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINAL CINEMATIC WAR GAME</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;overflow:hidden}

/* Background */
body::before{
content:"";
position:fixed;
width:100%;height:100%;
background:url('https://images.unsplash.com/photo-1608889175119-1f5c0c91f2c2') center/cover no-repeat;
opacity:0.25;
z-index:-1;
}

h1{margin:10px}

.container{display:flex;justify-content:space-around}
.team{width:45%;position:relative}

/* Tank */
.tank{
width:130px;
transition:transform .5s ease;
filter:drop-shadow(0 0 10px orange);
}
.rotate{transform:rotate(var(--angle));}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{background:#1a2d3a;padding:10px;border-radius:6px;cursor:pointer;position:relative;overflow:hidden}
.cell:hover{transform:scale(1.1)}

/* Missile */
.missile{
position:absolute;width:12px;height:12px;background:yellow;border-radius:50%;
box-shadow:0 0 12px orange;
animation:fly .9s linear forwards;
}

.missile::after{
content:'';position:absolute;width:20px;height:4px;background:orange;left:-15px;top:4px;filter:blur(2px);
}

@keyframes fly{
0%{transform:translate(var(--sx),var(--sy));}
100%{transform:translate(var(--tx),var(--ty));}
}

/* Explosion */
.explosion{
position:absolute;width:20px;height:20px;background:orange;border-radius:50%;
animation:explode .6s ease-out forwards;
}

.explosion::before{
content:'';position:absolute;width:10px;height:10px;background:red;border-radius:50%;
animation:scatter .6s forwards;
}

@keyframes explode{to{transform:scale(5);opacity:0}}
@keyframes scatter{to{transform:translate(30px,-30px);opacity:0}}

/* Smoke */
.smoke{
background:radial-gradient(circle,rgba(255,255,255,.3),transparent);
animation:smoke 3s infinite;
}

@keyframes smoke{0%{opacity:.8}100%{opacity:0}}

.hit{background:#00ffcc;color:#000}

/* SIDE PANEL */
.panel{display:flex;justify-content:space-around;margin:10px}
.box{background:#111;padding:10px;border-radius:10px;width:40%}
input{width:60px;text-align:center;padding:5px;border:none;border-radius:5px}
.star{color:#0f0;margin:2px}
.revealed{color:yellow;font-weight:bold}

/* WIN */
.win{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.9);
display:flex;justify-content:center;align-items:center;
font-size:40px;color:#00ffcc;z-index:20;
}

</style>
</head>
<body>

<h1>🔥 FINAL WAR GAME 🔥</h1>
<button onclick="startGame()">Start</button>

<div class="panel">
<div class="box">
<h3>Group A Secret</h3>
<input 
  type="text"
  inputmode="numeric"
  maxlength="2"
  autocomplete="off"
  style="-webkit-text-security: disc;"
>
<div id="listA"></div>
</div>
<div class="box">
<h3>Group B Secret</h3>
<input 
  type="text"
  inputmode="numeric"
  maxlength="2"
  autocomplete="off"
  style="-webkit-text-security: disc;"
>
<div id="listB"></div>
</div>
</div>

<div class="container">
<div class="team">
<img src="https://mdquizzes.github.io/mdquizzes/images/tank.png" class="tank" id="tankA">
<div id="teamA" class="grid"></div>
</div>

<div class="team">
<img src="https://mdquizzes.github.io/mdquizzes/images/tank.png" class="tank" id="tankB">
<div id="teamB" class="grid"></div>
</div>
</div>

<script>
let A=new Set(),B=new Set();
let turn='A',start=false;

function format(n){return n.toString().padStart(2,'0');}

function addNum(e,t){
if(e.key==='Enter'){
let v=parseInt(e.target.value);
if(v>=1&&v<=100){
(t==='A'?A:B).add(v);
addStar(t==='A'?'listA':'listB');
}
e.target.value='';
}}

function addStar(id){
let s=document.createElement('span');
s.className='star';
s.innerText='★ ★';
document.getElementById(id).appendChild(s);
}

function createGrid(id,t){
let g=document.getElementById(id);
for(let i=1;i<=100;i++){
let c=document.createElement('div');
c.className='cell';c.innerText=format(i);
c.onclick=()=>attack(i,c,t);
g.appendChild(c);
}}

function attack(num,cell,target){
if(!start||cell.classList.contains('smoke'))return;

if((turn==='A'&&target==='teamB')||(turn==='B'&&target==='teamA')){
rotateTank(target,cell);
launchMissile(cell,()=>{
cell.innerText='';
cell.classList.add('smoke');

let hit=false;
if(target==='teamA'&&A.has(num)){hit=true;A.delete(num);reveal('listA',num)}
if(target==='teamB'&&B.has(num)){hit=true;B.delete(num);reveal('listB',num)}

if(hit)cell.classList.add('hit');

if(A.size===0)win('Group B');
if(B.size===0)win('Group A');

turn=turn==='A'?'B':'A';
});
}
}

function rotateTank(target,cell){
let tank=document.getElementById(target==='teamA'?'tankB':'tankA');
let r=cell.getBoundingClientRect();
let angle=Math.atan2(r.top,r.left)*180/Math.PI;
tank.style.setProperty('--angle',angle+'deg');
tank.classList.add('rotate');
}

function launchMissile(cell,cb){
let m=document.createElement('div');m.className='missile';
let r=cell.getBoundingClientRect();
let sx=turn==='A'?0:window.innerWidth;
m.style.setProperty('--sx',sx+'px');
m.style.setProperty('--sy','120px');
m.style.setProperty('--tx',r.left+'px');
m.style.setProperty('--ty',r.top+'px');
document.body.appendChild(m);

setTimeout(()=>{
m.remove();
explode(r.left,r.top);
shake();
cb();
},900);
}

function explode(x,y){
let e=document.createElement('div');
e.className='explosion';
e.style.left=x+'px';e.style.top=y+'px';
document.body.appendChild(e);
setTimeout(()=>e.remove(),600);
}

function shake(){
document.body.style.transform='translate(5px,5px)';
setTimeout(()=>document.body.style.transform='translate(-5px,-5px)',50);
setTimeout(()=>document.body.style.transform='translate(0,0)',100);
}

function reveal(id,num){
let list=document.getElementById(id);
for(let s of list.children){
if(s.innerText==='★ ★'){
s.innerText=format(num);
s.classList.add('revealed');
break;
}}}

function win(team){
let d=document.createElement('div');
d.className='win';
d.innerText='🏆 '+team+' WINS';
document.body.appendChild(d);
}

function startGame(){start=true}

createGrid('teamA','teamA');
createGrid('teamB','teamB');
</script>

</body>
</html>
