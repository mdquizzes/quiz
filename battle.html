<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADVANCED REALISTIC WAR GAME</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center;overflow:auto}

.container{display:flex;justify-content:space-around}
.team{width:40%;position:relative}

.tank{
width:100px;
position:relative;
transition:transform .4s ease;
}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.cell{background:#1a2d3a;padding:8px;border-radius:6px;cursor:pointer;position:relative}

/* Missile */
.missile{
position:absolute;
width:10px;height:10px;
background:yellow;
border-radius:50%;
box-shadow:0 0 10px orange;
pointer-events:none;
}

/* Explosion */
.explosion{
position:absolute;
width:20px;height:20px;
background:orange;
border-radius:50%;
animation:explode .5s forwards;
}

@keyframes explode{
to{transform:scale(5);opacity:0}
}

.hit{background:#00ffcc;color:#000}

</style>
</head>
<body>

<h2>🚀 REALISTIC WAR GAME</h2>
<button onclick="startGame()">Start</button>

<div class="container">
<div class="team">
<img src="https://cdn.pixabay.com/photo/2017/01/31/13/14/tank-2027322_1280.png" id="tankA" class="tank">
<div id="teamA" class="grid"></div>
</div>

<div class="team">
<img src="https://cdn.pixabay.com/photo/2017/01/31/13/14/tank-2027322_1280.png" id="tankB" class="tank">
<div id="teamB" class="grid"></div>
</div>
</div>

<script>
let turn='A',start=false;
let A=new Set([5,10,15,20]);
let B=new Set([3,8,12,25]);

function createGrid(id,t){
let g=document.getElementById(id);
for(let i=1;i<=100;i++){
let c=document.createElement('div');
c.className='cell';c.innerText=i;
c.onclick=()=>attack(i,c,t);
g.appendChild(c);
}}

function attack(num,cell,target){
if(!start)return;

if((turn==='A'&&target==='teamB')||(turn==='B'&&target==='teamA')){

let attackerTank = document.getElementById(turn==='A'?'tankA':'tankB');
let rectTarget = cell.getBoundingClientRect();
let rectTank = attackerTank.getBoundingClientRect();

let dx = rectTarget.left - rectTank.left;
let dy = rectTarget.top - rectTank.top;

// ROTATE TANK
let angle = Math.atan2(dy,dx) * 180/Math.PI;
attackerTank.style.transform = `rotate(${angle}deg)`;

// MISSILE CREATE
let missile = document.createElement('div');
missile.className='missile';

document.body.appendChild(missile);

let startX = rectTank.left + 50;
let startY = rectTank.top + 50;
let endX = rectTarget.left + 20;
let endY = rectTarget.top + 20;

let progress = 0;

let interval = setInterval(()=>{
progress += 0.03;

let currentX = startX + (endX - startX) * progress;
let currentY = startY + (endY - startY) * progress;

missile.style.left = currentX + 'px';
missile.style.top = currentY + 'px';

if(progress >= 1){
clearInterval(interval);
missile.remove();
explode(endX,endY,cell,target,num);
}

},16);

turn = turn==='A'?'B':'A';
}
}

function explode(x,y,cell,target,num){
let exp = document.createElement('div');
exp.className='explosion';
exp.style.left = x+'px';
exp.style.top = y+'px';

document.body.appendChild(exp);

setTimeout(()=>exp.remove(),500);

// HIT CHECK
if(target==='teamA' && A.has(num)){
cell.classList.add('hit');
A.delete(num);
}

if(target==='teamB' && B.has(num)){
cell.classList.add('hit');
B.delete(num);
}
}

function startGame(){start=true}

createGrid('teamA','teamA');
createGrid('teamB','teamB');
</script>

</body>
</html>
