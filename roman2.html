<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Bubble Challenge</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#00c6ff,#0072ff);
}

#gameArea{
position:absolute;
inset:0;
overflow:hidden;
}

#setupScreen{
position:absolute;
inset:0;
background:rgba(0,0,0,.6);
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
}

.setup-box{
background:white;
padding:25px;
border-radius:20px;
width:340px;
text-align:center;
}

.setup-box h1{
margin-bottom:15px;
}

.setup-box input,
.setup-box select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

.setup-box button{
width:100%;
padding:14px;
border:none;
background:#2196f3;
color:white;
font-size:18px;
cursor:pointer;
border-radius:10px;
}

#hud{
position:absolute;
top:10px;
left:10px;
right:240px;
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:20px;
color:white;
z-index:999;
}

#leaderboard{
position:absolute;
top:0;
right:0;
width:230px;
height:100%;
background:rgba(0,0,0,.25);
color:white;
padding:10px;
overflow-y:auto;
z-index:999;
}

#leaderboard h3{
text-align:center;
margin-bottom:10px;
}

#leaderList{
list-style:none;
padding:0;
}

#leaderList li{
padding:6px;
border-bottom:1px solid rgba(255,255,255,.2);
}

.bubble{
position:absolute;
width:80px;
height:80px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
color:white;
cursor:pointer;
user-select:none;
box-shadow:0 0 15px rgba(255,255,255,.4);
transition:.2s;
}

.selected{
outline:4px solid yellow;
box-shadow:
0 0 10px #fff,
0 0 25px yellow,
0 0 50px yellow;
animation:pulse .6s infinite;
}

@keyframes pulse{
0%{transform:scale(1.15);}
50%{transform:scale(1.3);}
100%{transform:scale(1.15);}
}

.roman{
background:#ff9800;
}

.number{
background:#4caf50;
}

.burst{
animation:burst .35s forwards;
}

@keyframes burst{
100%{
transform:scale(2);
opacity:0;
}
}

#gameOver{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,.75);
justify-content:center;
align-items:center;
z-index:1001;
}

.over-box{
background:white;
padding:25px;
border-radius:15px;
width:330px;
text-align:center;
}

.over-box button{
margin-top:15px;
padding:12px 20px;
font-size:18px;
cursor:pointer;
}

#floatingPoints{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
font-size:42px;
font-weight:bold;
color:yellow;
pointer-events:none;
opacity:0;
z-index:9999;
}

@media(max-width:700px){

#leaderboard{
width:150px;
}

#hud{
right:150px;
font-size:14px;
}

.bubble{
width:65px;
height:65px;
font-size:18px;
}

}

</style>
</head>
<body>

<div id="setupScreen">

<div class="setup-box">

<h1>Roman Bubble Challenge</h1>

<input id="playerName" placeholder="Enter Player Name">

<select id="timeSelect">
<option value="30">30 Seconds</option>
<option value="60" selected>60 Seconds</option>
<option value="120">120 Seconds</option>
</select>

<select id="levelSelect">
<option value="easy">Easy (1-20)</option>
<option value="medium">Medium (1-50)</option>
<option value="hard">Hard (1-100)</option>
</select>

<button onclick="startGame()">
Start Game
</button>

</div>

</div>

<div id="hud">

<div id="playerInfo"></div>

<div>
Score:
<span id="score">0</span>
</div>

<div>
Time:
<span id="time">60</span>
</div>

<div>
High:
<span id="highScore">0</span>
</div>

</div>

<div id="leaderboard">

<h3>🏆 Leaders</h3>

<ul id="leaderList"></ul>

</div>

<div id="gameArea"></div>

<div id="floatingPoints"></div>

<div id="gameOver">

<div class="over-box">

<h2>Game Over</h2>

<p id="finalScore"></p>

<p id="bestScore"></p>

<button onclick="location.reload()">
Play Again
</button>

</div>

</div>
<script>

const gameArea = document.getElementById("gameArea");

let score = 0;
let combo = 0;
let selected = null;

let timerInterval;
let spawnInterval;

let gameTime = 60;
let maxNumber = 20;
let currentLevel = "easy";

const HIGH_SCORE_KEY = "romanBubbleHighScore";
const LEADERBOARD_KEY = "romanBubbleLeaderboard";

document.getElementById("highScore").textContent =
localStorage.getItem(HIGH_SCORE_KEY) || 0;

renderLeaderboard();

function renderLeaderboard(){

let data =
JSON.parse(
localStorage.getItem(LEADERBOARD_KEY) || "[]"
);

let html = "";

data.forEach((item,index)=>{

html += `
<li>
${index+1}. ${item.name}
 - ${item.score}
</li>
`;

});

document.getElementById("leaderList").innerHTML =
html;

}

function toRoman(num){

const values = [

[100,"C"],
[90,"XC"],
[50,"L"],
[40,"XL"],
[10,"X"],
[9,"IX"],
[5,"V"],
[4,"IV"],
[1,"I"]

];

let result = "";

for(let [value,symbol] of values){

while(num >= value){

result += symbol;

num -= value;

}

}

return result;

}

function startGame(){

const playerName =
document.getElementById("playerName")
.value.trim();

if(!playerName){

alert("Please enter player name");
return;

}

document.getElementById("playerInfo")
.textContent = playerName;

gameTime =
parseInt(
document.getElementById("timeSelect").value
);

currentLevel =
document.getElementById("levelSelect").value;

if(currentLevel === "easy"){
maxNumber = 20;
}

if(currentLevel === "medium"){
maxNumber = 50;
}

if(currentLevel === "hard"){
maxNumber = 100;
}

document.getElementById("setupScreen")
.style.display = "none";

document.getElementById("time")
.textContent = gameTime;

timerInterval = setInterval(()=>{

gameTime--;

document.getElementById("time")
.textContent = gameTime;

if(gameTime <= 0){

endGame();

}

},1000);

spawnInterval =
setInterval(spawnPair,1100);

}

function spawnPair(){

const num =
Math.floor(
Math.random()*maxNumber
)+1;

const roman =
toRoman(num);

const pairId =
"pair_" +
Date.now() +
Math.random();

createBubble(
roman,
"roman",
pairId,
num
);

createBubble(
num,
"number",
pairId,
num
);

}
 function createBubble(
text,
type,
pairId,
value
){

const bubble =
document.createElement("div");

bubble.className =
`bubble ${type}`;

bubble.textContent = text;

bubble.dataset.pair = pairId;
bubble.dataset.type = type;
bubble.dataset.value = value;

bubble.style.left =
Math.random() *
(window.innerWidth - 320) + "px";

let y;

if(currentLevel === "easy"){

y =
Math.random() *
(window.innerHeight - 250);

}else{

y = -100;

}

bubble.style.top = y + "px";

gameArea.appendChild(bubble);

bubble.addEventListener(
"click",
()=>selectBubble(bubble)
);

let speed;

if(currentLevel === "easy"){

speed =
0.3 +
Math.random()*0.3;

}else if(currentLevel === "medium"){

speed =
1.3 +
Math.random()*1.5;

}else{

speed =
2.5 +
Math.random()*3;

}

const drift =
(Math.random()-0.5)*1.2;

const move =
setInterval(()=>{

if(currentLevel === "easy"){

bubble.style.left =
(parseFloat(bubble.style.left)+drift)
+"px";

y -= speed;

}else{

y += speed;

}

bubble.style.top = y + "px";

if(
y > window.innerHeight + 100 ||
y < -120
){

if(selected === bubble){

selected.classList.remove(
"selected"
);

showWrongPair();

selected = null;

}
clearInterval(move);

bubble.remove();

}

},16);

}

function selectBubble(bubble){

if(selected === null){

selected = bubble;

bubble.classList.add(
"selected"
);

return;

}

if(selected === bubble){

return;

}

if(

selected.dataset.value ===
bubble.dataset.value

&&

selected.dataset.type !==
bubble.dataset.type

){

correctMatch(
selected,
bubble
);

}else{

selected.classList.remove(
"selected"
);

bubble.classList.remove(
"selected"
);

showWrongPair();

selected = null;

combo = 0;

document.getElementById(
"comboCount"
).textContent = 0;

}

function correctMatch(first,second){

burst(first);

burst(second);

selected = null;

combo++;

let points = 2;

if(combo >= 3){

points = 3;

}

score += points;

document.getElementById("score")
.textContent = score;

showFloatingPoints(
"+" + points
);

}

function burst(bubble){

bubble.classList.add("burst");

setTimeout(()=>{

bubble.remove();

},350);

}

function showFloatingPoints(text){
 function showWrongPair(){

const fp =
document.getElementById(
"floatingPoints"
);

fp.innerHTML =
"❌ Wrong Pair";

fp.style.color =
"#ff0000";

fp.style.opacity =
"1";

setTimeout(()=>{

fp.style.opacity =
"0";

fp.style.color =
"yellow";

},700);

}

const fp =
document.getElementById(
"floatingPoints"
);

fp.innerHTML = text;

fp.style.opacity = "1";

fp.style.transform =
"translate(-50%,-50%) scale(1.4)";

setTimeout(()=>{

fp.style.opacity = "0";

fp.style.transform =
"translate(-50%,-50%) scale(1)";

},700);

}
  function endGame(){

clearInterval(timerInterval);

clearInterval(spawnInterval);

document.querySelectorAll(".bubble")
.forEach(b=>b.remove());

const playerName =
document.getElementById("playerInfo")
.textContent;

let highScore =
parseInt(
localStorage.getItem(
HIGH_SCORE_KEY
) || 0
);

if(score > highScore){

highScore = score;

localStorage.setItem(
HIGH_SCORE_KEY,
score
);

}

let leaderboard =

JSON.parse(
localStorage.getItem(
LEADERBOARD_KEY
) || "[]"
);

leaderboard.push({

name: playerName,
score: score

});

leaderboard.sort(
(a,b)=>b.score-a.score
);

leaderboard =
leaderboard.slice(0,10);

localStorage.setItem(

LEADERBOARD_KEY,

JSON.stringify(
leaderboard
)

);

renderLeaderboard();

document.getElementById(
"finalScore"
).innerHTML =

`Your Score:
<b>${score}</b>`;

document.getElementById(
"bestScore"
).innerHTML =

`Highest Score:
<b>${highScore}</b>`;

document.getElementById(
"highScore"
).textContent =
highScore;

document.getElementById(
"gameOver"
).style.display =
"flex";

}

window.addEventListener(
"resize",
()=>{

document.querySelectorAll(
".bubble"
).forEach(b=>{

let left =
parseFloat(
b.style.left
);

const maxLeft =
window.innerWidth - 320;

if(left > maxLeft){

b.style.left =
maxLeft + "px";

}

});

}
);
 
gameArea.addEventListener(
"click",
function(e){

if(
e.target === gameArea
){

if(selected){

selected.classList.remove(
"selected"
);

selected = null;

}

}

}
);
</script>

</body>
</html>
