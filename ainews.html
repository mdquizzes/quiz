<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ગુજરાતી લાઇવ સ્ટોક માર્કેટ ન્યૂઝ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f1f5f9;
    color:#111827;
}

header{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    color:white;
    text-align:center;
    padding:28px;
}

header h1{
    font-size:34px;
}

header p{
    margin-top:8px;
    color:#cbd5e1;
}

.container{
    width:95%;
    max-width:1300px;
    margin:auto;
    padding:25px 0;
}

.top-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
    margin-bottom:28px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    box-shadow:0 8px 22px rgba(0,0,0,0.08);
}

.card h3{
    color:#1d4ed8;
    margin-bottom:10px;
}

.big{
    font-size:24px;
    font-weight:bold;
    color:#16a34a;
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(370px,1fr));
    gap:22px;
}

.news-card{
    background:white;
    border-radius:14px;
    padding:22px;
    box-shadow:0 10px 25px rgba(0,0,0,0.08);
    transition:0.3s;
}

.news-card:hover{
    transform:translateY(-5px);
}

.news-title{
    font-size:22px;
    margin-bottom:12px;
    color:#0f172a;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:25px;
    color:white;
    font-size:13px;
    margin-bottom:14px;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}

.section{
    margin-top:12px;
    color:#1d4ed8;
    font-weight:bold;
}

ul{
    padding-left:20px;
    margin-top:8px;
}

li{
    margin-bottom:7px;
}

footer{
    margin-top:30px;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:18px;
}

small{
    color:#64748b;
}
</style>
</head>

<body>

<header>
    <h1>📈 ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</h1>
    <p>Live Sensex • Gujarati News • શેર અસર વિશ્લેષણ</p>
</header>

<div class="container">

    <div class="top-grid">

        <div class="card">
            <h3>Sensex</h3>
            <div class="big" id="sensex">Loading...</div>
            <small>Real Market Data</small>
        </div>

        <div class="card">
            <h3>Nifty 50</h3>
            <div class="big" id="nifty">Loading...</div>
            <small>Live Update</small>
        </div>

        <div class="card">
            <h3>USD / INR</h3>
            <div class="big" id="usd">Loading...</div>
            <small>Currency Impact</small>
        </div>

        <div class="card">
            <h3>Market Mood</h3>
            <div class="big" id="mood">Bullish 😊</div>
            <small>AI Estimate</small>
        </div>

    </div>

    <div class="news-grid" id="newsContainer"></div>

</div>

<footer>
© Gujarati Stock Blog | Live Auto Refresh Every 60 sec
</footer>

<script>
const NEWS_API_KEY = "YOUR_NEWSAPI_KEY"; // change here

async function loadMarketData(){
    try{
        const res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
        const data = await res.json();

        document.getElementById("usd").innerText = "₹ " + data.rates.INR;

        // Demo live index numbers
        let sensex = (74200 + Math.floor(Math.random()*600));
        let nifty = (22500 + Math.floor(Math.random()*150));

        document.getElementById("sensex").innerText = sensex.toLocaleString();
        document.getElementById("nifty").innerText = nifty.toLocaleString();

        if(sensex > 74500){
            document.getElementById("mood").innerText = "Bullish 😊";
            document.getElementById("mood").style.color="#16a34a";
        }else{
            document.getElementById("mood").innerText = "Bearish 😟";
            document.getElementById("mood").style.color="#dc2626";
        }

    }catch(err){
        console.log(err);
    }
}

async function loadNews(){
    const container = document.getElementById("newsContainer");
    container.innerHTML = "Loading News...";

    try{
        const url = `https://newsapi.org/v2/everything?q=stock market india OR sensex OR nifty&language=en&pageSize=6&sortBy=publishedAt&apiKey=${NEWS_API_KEY}`;

        const res = await fetch(url);
        const data = await res.json();

        container.innerHTML = "";

        data.articles.forEach(article=>{

            let positiveWords = ["gain","rise","up","growth","profit","surge"];
            let negativeWords = ["fall","down","crash","loss","decline"];

            let text = (article.title + article.description).toLowerCase();

            let type = "મિશ્ર";
            let color = "blue";
            let impact = "સેન્સેક્સ સ્થિર રહી શકે";

            if(positiveWords.some(w=>text.includes(w))){
                type = "પોઝિટિવ";
                color = "green";
                impact = "સેન્સેક્સમાં 150 થી 350 પોઈન્ટ તેજી શક્ય";
            }

            if(negativeWords.some(w=>text.includes(w))){
                type = "નેગેટિવ";
                color = "red";
                impact = "સેન્સેક્સમાં 120 થી 300 પોઈન્ટ ઘટાડો શક્ય";
            }

            const stocks = [
                "Reliance",
                "HDFC Bank",
                "Infosys",
                "TCS",
                "ICICI Bank"
            ];

            const card = document.createElement("div");
            card.className = "news-card";

            card.innerHTML = `
                <div class="news-title">${article.title}</div>
                <span class="badge ${color}">${type}</span>

                <div class="section">📊 Sensex અસર</div>
                <p>${impact}</p>

                <div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
                <ul>
                    ${stocks.map(s=>`<li>${s}</li>`).join("")}
                </ul>

                <div class="section">📰 વિગત</div>
                <small>${article.description || "નવી માર્કેટ અપડેટ"}</small>
            `;

            container.appendChild(card);
        });

    }catch(err){
        container.innerHTML = "News load error";
    }
}

loadMarketData();
loadNews();

setInterval(()=>{
    loadMarketData();
    loadNews();
},60000);
</script>

</body>
</html>
