<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gujarati Smart AI News Alert</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:white;
padding:28px;
text-align:center;
}

header h1{
font-size:34px;
}

header p{
margin-top:8px;
color:#cbd5e1;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
color:#2563eb;
margin-bottom:10px;
}

.big{
font-size:24px;
font-weight:bold;
color:#16a34a;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:22px;
}

.news-card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
animation:fade .5s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.news-title{
font-size:22px;
margin-bottom:10px;
color:#0f172a;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:30px;
font-size:13px;
color:white;
margin-bottom:12px;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}

.section{
margin-top:12px;
margin-bottom:6px;
font-weight:bold;
color:#1d4ed8;
}

ul{
padding-left:20px;
}

li{
margin-bottom:6px;
}

small{
color:#64748b;
line-height:1.5;
}

footer{
margin-top:30px;
background:#0f172a;
color:white;
text-align:center;
padding:18px;
}

.popup{
position:fixed;
top:20px;
right:20px;
background:#16a34a;
color:white;
padding:14px 18px;
border-radius:10px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
z-index:999;
display:none;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>📈 ગુજરાતી SMART AI NEWS ALERT</h1>
<p>Every 5 Sec Update • News Alert • Sensex AI Impact</p>
</header>

<div class="popup" id="popup">નવી ન્યૂઝ આવી!</div>

<div class="container">

<div class="top-grid">

<div class="card">
<h3>Sensex Mood</h3>
<div class="big" id="sensexMood">Bullish 😊</div>
</div>

<div class="card">
<h3>Last Scan</h3>
<div class="big" id="scanTime">--</div>
</div>

<div class="card">
<h3>Refresh</h3>
<div class="big">5 Sec</div>
</div>

<div class="card">
<h3>Status</h3>
<div class="big">LIVE</div>
</div>

</div>

<div class="news-grid" id="newsBox"></div>

</div>

<footer>
© Gujarati Smart Alert | Browser AI Mode
</footer>

<script>

/* ==================================
   SAMPLE LIVE NEWS BANK
================================== */

const headlines = [

"RBI may cut interest rates next month",

"Crude oil prices jump sharply in global market",

"Infosys gets major US contract worth millions",

"Foreign investors buying Indian banking stocks",

"US market falls after inflation concerns",

"Gold prices rise, investors cautious",

"Tata Motors reports strong quarterly profit",

"Reliance announces new green energy expansion",

"Rupee strengthens against dollar",

"HDFC Bank sees strong loan growth"

];

let shownNews = [];

/* ==================================
   AI ANALYSIS
================================== */

function analyzeNews(text){

text = text.toLowerCase();

let type="મિશ્ર";
let color="blue";
let effect="સેન્સેક્સ સ્થિર રહી શકે.";
let mood="Stable 😐";

let stocks = [
"Reliance ↕",
"HDFC Bank ↕",
"Infosys ↕",
"TCS ↕",
"ICICI Bank ↕"
];

const positive = [
"cut interest",
"profit",
"growth",
"buying",
"strong",
"contract",
"expansion",
"rise loan"
];

const negative = [
"oil",
"falls",
"inflation",
"cautious",
"crude jump",
"drop"
];

positive.forEach(word=>{
if(text.includes(word)){
type="પોઝિટિવ";
color="green";
effect="Sensex +180 થી +420 પોઈન્ટ જઈ શકે.";
mood="Bullish 😊";
stocks=[
"Reliance ↑",
"HDFC Bank ↑",
"Infosys ↑",
"TCS ↑",
"ICICI Bank ↑"
];
}
});

negative.forEach(word=>{
if(text.includes(word)){
type="નેગેટિવ";
color="red";
effect="Sensex -120 થી -350 પોઈન્ટ આવી શકે.";
mood="Bearish 😟";
stocks=[
"Reliance ↓",
"HDFC Bank ↓",
"Infosys ↓",
"TCS ↓",
"ICICI Bank ↓"
];
}
});

return {type,color,effect,mood,stocks};

}

/* ==================================
   POPUP
================================== */

function showPopup(){

const p = document.getElementById("popup");

p.style.display="block";

setTimeout(()=>{
p.style.display="none";
},2500);

}

/* ==================================
   LOAD NEWS
================================== */

function loadSmartNews(){

const box = document.getElementById("newsBox");

let available = headlines.filter(x=>!shownNews.includes(x));

if(available.length===0){
shownNews=[];
available=headlines;
}

const selected =
available[Math.floor(Math.random()*available.length)];

shownNews.push(selected);

const result = analyzeNews(selected);

document.getElementById("sensexMood").innerText =
result.mood;

document.getElementById("scanTime").innerText =
new Date().toLocaleTimeString();

showPopup();

const card = document.createElement("div");
card.className="news-card";

card.innerHTML = `
<div class="news-title">${selected}</div>

<span class="badge ${result.color}">
${result.type}
</span>

<div class="section">📊 Sensex અસર</div>
<p>${result.effect}</p>

<div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
<ul>
${result.stocks.map(s=>`<li>${s}</li>`).join("")}
</ul>

<div class="section">🤖 AI નોંધ</div>
<small>આ અંદાજ headline sentiment આધારિત છે.</small>
`;

box.prepend(card);

if(box.children.length > 8){
box.removeChild(box.lastChild);
}

}

/* ==================================
   INIT
================================== */

loadSmartNews();

setInterval(loadSmartNews,5000);

</script>

</body>
</html>
