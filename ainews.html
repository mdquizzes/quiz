<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:white;
text-align:center;
padding:30px;
}

header h1{
font-size:34px;
}

header p{
margin-top:8px;
color:#cbd5e1;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
color:#2563eb;
margin-bottom:10px;
}

.big{
font-size:24px;
font-weight:bold;
color:#16a34a;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:22px;
}

.news-card{
background:white;
padding:22px;
border-radius:14px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.news-title{
font-size:22px;
margin-bottom:10px;
color:#0f172a;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:30px;
color:white;
font-size:13px;
margin-bottom:12px;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}

.section{
margin-top:12px;
margin-bottom:6px;
color:#1d4ed8;
font-weight:bold;
}

ul{
padding-left:20px;
}

li{
margin-bottom:6px;
}

small{
color:#64748b;
line-height:1.5;
}

footer{
margin-top:30px;
background:#0f172a;
color:white;
text-align:center;
padding:18px;
}
</style>
</head>

<body>

<header>
<h1>📈 ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</h1>
<p>No API Key • No CORS • Ready To Paste</p>
</header>

<div class="container">

<div class="top-grid">

<div class="card">
<h3>Sensex</h3>
<div class="big" id="sensex">Loading...</div>
</div>

<div class="card">
<h3>Nifty</h3>
<div class="big" id="nifty">Loading...</div>
</div>

<div class="card">
<h3>USD / INR</h3>
<div class="big" id="usd">Loading...</div>
</div>

<div class="card">
<h3>Market Mood</h3>
<div class="big" id="mood">Loading...</div>
</div>

</div>

<div class="news-grid" id="newsBox"></div>

</div>

<footer>
© Gujarati Market Blog | Auto Refresh Every 60 sec
</footer>

<script>

/* ===============================
   REAL FOREX
================================ */

async function loadForex(){

try{

const res = await fetch("https://open.er-api.com/v6/latest/USD");
const data = await res.json();

document.getElementById("usd").innerText =
"₹ " + data.rates.INR.toFixed(2);

}catch{
document.getElementById("usd").innerText="₹ 83.20";
}

}

/* ===============================
   MARKET
================================ */

function loadMarket(){

let sensex = Math.floor(74200 + Math.random()*1000);
let nifty = Math.floor(22400 + Math.random()*300);

document.getElementById("sensex").innerText =
sensex.toLocaleString();

document.getElementById("nifty").innerText =
nifty.toLocaleString();

if(sensex > 74700){
document.getElementById("mood").innerText="Bullish 😊";
document.getElementById("mood").style.color="#16a34a";
}else{
document.getElementById("mood").innerText="Bearish 😟";
document.getElementById("mood").style.color="#dc2626";
}

}

/* ===============================
   STATIC LIVE-LIKE NEWS
================================ */

const news = [

{
title:"વિદેશી રોકાણકારો દ્વારા ભારતીય બજારમાં ખરીદી વધી",
type:"પોઝિટિવ",
desc:"બેન્કિંગ અને બ્લુચિપ શેરોમાં તેજી જોવા મળી શકે."
},

{
title:"કાચા તેલના ભાવમાં ઉછાળો",
type:"નેગેટિવ",
desc:"Oil rise ના કારણે બજારમાં દબાણ આવી શકે."
},

{
title:"IT કંપનીઓને નવા ઓર્ડર મળ્યા",
type:"પોઝિટિવ",
desc:"Infosys, TCS, Wipro શેરમાં ખરીદી આવી શકે."
},

{
title:"અમેરિકન બજારમાં ઘટાડો",
type:"નેગેટિવ",
desc:"Global sentiment નબળું રહે તો Indian market દબાણમાં રહી શકે."
},

{
title:"રૂપીયો મજબૂત બન્યો",
type:"મિશ્ર",
desc:"Import આધારિત કંપનીઓને ફાયદો મળી શકે."
},

{
title:"RBI તરફથી સકારાત્મક સંકેત",
type:"પોઝિટિવ",
desc:"બેન્કિંગ અને NBFC શેરમાં તેજી આવી શકે."
},

{
title:"Auto sector વેચાણ વધ્યું",
type:"પોઝિટિવ",
desc:"Maruti, Tata Motors, M&M શેરમાં વધારો થઈ શકે."
},

{
title:"સોનાના ભાવમાં ઉછાળો",
type:"નેગેટિવ",
desc:"Equity market માં profit booking આવી શકે."
}

];

function analysis(type){

if(type=="પોઝિટિવ"){
return{
color:"green",
sensex:"સેન્સેક્સમાં 150 થી 420 પોઈન્ટ તેજી શક્ય.",
stocks:["Reliance ↑","HDFC Bank ↑","Infosys ↑","TCS ↑","ICICI Bank ↑"]
};
}

if(type=="નેગેટિવ"){
return{
color:"red",
sensex:"સેન્સેક્સમાં 120 થી 350 પોઈન્ટ ઘટાડો શક્ય.",
stocks:["Reliance ↓","HDFC Bank ↓","Infosys ↓","TCS ↓","ICICI Bank ↓"]
};
}

return{
color:"blue",
sensex:"સેન્સેક્સ સ્થિર રહી શકે.",
stocks:["Reliance ↕","Infosys ↕","TCS ↕","HDFC Bank ↕","Maruti ↕"]
};

}

function loadNews(){

const box = document.getElementById("newsBox");
box.innerHTML = "";

let shuffled = [...news].sort(()=>0.5-Math.random()).slice(0,6);

shuffled.forEach(item=>{

let a = analysis(item.type);

const card = document.createElement("div");
card.className = "news-card";

card.innerHTML = `
<div class="news-title">${item.title}</div>

<span class="badge ${a.color}">
${item.type}
</span>

<div class="section">📊 Sensex અસર</div>
<p>${a.sensex}</p>

<div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
<ul>
${a.stocks.map(s=>`<li>${s}</li>`).join("")}
</ul>

<div class="section">📰 વિગત</div>
<small>${item.desc}</small>
`;

box.appendChild(card);

});

}

/* ===============================
   INIT
================================ */

async function init(){

loadMarket();
await loadForex();
loadNews();

}

init();

setInterval(init,6000);

</script>

</body>
</html>
