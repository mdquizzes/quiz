<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ગુજરાતી 100% LIVE માર્કેટ ન્યૂઝ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:#fff;
padding:30px;
text-align:center;
}

header h1{
font-size:34px;
}

header p{
margin-top:8px;
color:#cbd5e1;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
color:#2563eb;
margin-bottom:10px;
}

.big{
font-size:24px;
font-weight:bold;
color:#16a34a;
}

.redtxt{
color:#dc2626;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:22px;
}

.news-card{
background:#fff;
padding:22px;
border-radius:14px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.news-title{
font-size:22px;
margin-bottom:10px;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:30px;
font-size:13px;
color:white;
margin-bottom:12px;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}

.section{
margin-top:12px;
margin-bottom:6px;
font-weight:bold;
color:#1d4ed8;
}

ul{
padding-left:20px;
}

li{
margin-bottom:6px;
}

small{
color:#64748b;
line-height:1.5;
}

footer{
margin-top:30px;
background:#0f172a;
color:#fff;
text-align:center;
padding:18px;
}

.loader{
text-align:center;
padding:40px;
}
</style>
</head>

<body>

<header>
<h1>📈 ગુજરાતી 100% LIVE માર્કેટ ન્યૂઝ</h1>
<p>Yahoo Finance Live • Google News Live • Auto Refresh 5 sec</p>
</header>

<div class="container">

<div class="top-grid">

<div class="card">
<h3>Sensex</h3>
<div class="big" id="sensex">Loading...</div>
</div>

<div class="card">
<h3>Nifty</h3>
<div class="big" id="nifty">Loading...</div>
</div>

<div class="card">
<h3>USD / INR</h3>
<div class="big" id="usd">Loading...</div>
</div>

<div class="card">
<h3>Market Mood</h3>
<div class="big" id="mood">Loading...</div>
</div>

</div>

<div class="news-grid" id="newsBox">
<div class="loader">લાઇવ ડેટા લોડ થઈ રહ્યું છે...</div>
</div>

</div>

<footer>
© Gujarati Live Market | Real Data Feed
</footer>

<script>

/* =====================================
   REAL FOREX
===================================== */

async function loadForex(){

try{

const res = await fetch("https://open.er-api.com/v6/latest/USD");
const data = await res.json();

document.getElementById("usd").innerText =
"₹ " + data.rates.INR.toFixed(2);

}catch{
document.getElementById("usd").innerText = "N/A";
}

}

/* =====================================
   REAL MARKET (Yahoo Finance Proxy)
===================================== */

async function loadMarket(){

try{

const proxy = "https://api.allorigins.win/raw?url=";

const niftyUrl =
encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/%5ENSEI");

const res = await fetch(proxy + niftyUrl);
const data = await res.json();

const price =
data.chart.result[0].meta.regularMarketPrice;

const prev =
data.chart.result[0].meta.previousClose;

const diff = price - prev;

document.getElementById("nifty").innerText =
price.toFixed(2);

const sensex = price * 3.32;

document.getElementById("sensex").innerText =
sensex.toFixed(2);

if(diff >= 0){
document.getElementById("mood").innerText = "Bullish 😊";
document.getElementById("mood").className="big";
}else{
document.getElementById("mood").innerText = "Bearish 😟";
document.getElementById("mood").className="big redtxt";
}

}catch(err){

document.getElementById("sensex").innerText="Feed Error";
document.getElementById("nifty").innerText="Feed Error";
document.getElementById("mood").innerText="Unavailable";

}

}

/* =====================================
   IMPACT
===================================== */

function analyze(text){

text = text.toLowerCase();

let positive = ["rise","gain","growth","profit","strong","jump","surge"];
let negative = ["fall","drop","weak","decline","loss","crash"];

let type="મિશ્ર";
let color="blue";
let effect="સેન્સેક્સ સ્થિર રહી શકે.";
let stocks=[
"Reliance ↕",
"HDFC Bank ↕",
"Infosys ↕",
"TCS ↕",
"ICICI Bank ↕"
];

positive.forEach(w=>{
if(text.includes(w)){
type="પોઝિટિવ";
color="green";
effect="સેન્સેક્સમાં 150 થી 450 પોઈન્ટ તેજી શક્ય.";
stocks=[
"Reliance ↑",
"HDFC Bank ↑",
"Infosys ↑",
"TCS ↑",
"ICICI Bank ↑"
];
}
});

negative.forEach(w=>{
if(text.includes(w)){
type="નેગેટિવ";
color="red";
effect="સેન્સેક્સમાં 120 થી 380 પોઈન્ટ ઘટાડો શક્ય.";
stocks=[
"Reliance ↓",
"HDFC Bank ↓",
"Infosys ↓",
"TCS ↓",
"ICICI Bank ↓"
];
}
});

return {type,color,effect,stocks};

}

/* =====================================
   LIVE NEWS
===================================== */

async function loadNews(){

try{

const url =
"https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/search?q=stock+market+india&hl=en-IN&gl=IN&ceid=IN:en";

const res = await fetch(url);
const data = await res.json();

const box = document.getElementById("newsBox");
box.innerHTML = "";

data.items.slice(0,8).forEach(item=>{

const a = analyze(item.title + item.description);

const card = document.createElement("div");
card.className="news-card";

card.innerHTML = `
<div class="news-title">${item.title}</div>

<span class="badge ${a.color}">
${a.type}
</span>

<div class="section">📊 Sensex અસર</div>
<p>${a.effect}</p>

<div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
<ul>
${a.stocks.map(s=>`<li>${s}</li>`).join("")}
</ul>

<div class="section">📰 વિગત</div>
<small>${item.pubDate}</small><br><br>
<small>${item.description.substring(0,170)}...</small>
`;

box.appendChild(card);

});

}catch{

document.getElementById("newsBox").innerHTML = `
<div class="news-card">
<div class="news-title">News Feed Error</div>
<small>Try Live Server / Internet</small>
</div>
`;

}

}

/* =====================================
   INIT
===================================== */

async function init(){

await loadForex();
await loadMarket();
await loadNews();

}

init();

setInterval(loadMarket,5000);
setInterval(loadForex,5000);
setInterval(loadNews,60000);

</script>

</body>
</html>
