<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Arial, sans-serif;
    background:#f1f5f9;
    color:#111827;
}
header{
    background:linear-gradient(135deg,#0f172a,#1d4ed8);
    color:#fff;
    padding:28px;
    text-align:center;
}
header h1{
    font-size:34px;
}
header p{
    margin-top:8px;
    color:#cbd5e1;
}
.container{
    width:95%;
    max-width:1300px;
    margin:auto;
    padding:25px 0;
}
.top-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:25px;
}
.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 8px 22px rgba(0,0,0,0.08);
}
.card h3{
    color:#1d4ed8;
    margin-bottom:10px;
}
.big{
    font-size:24px;
    font-weight:bold;
    color:#16a34a;
}
.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:22px;
}
.news-card{
    background:#fff;
    border-radius:14px;
    padding:22px;
    box-shadow:0 10px 24px rgba(0,0,0,0.08);
}
.news-title{
    font-size:22px;
    color:#111827;
    margin-bottom:10px;
}
.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:30px;
    color:#fff;
    font-size:13px;
    margin-bottom:12px;
}
.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}
.section{
    margin-top:12px;
    margin-bottom:6px;
    color:#1d4ed8;
    font-weight:bold;
}
ul{
    padding-left:20px;
}
li{
    margin-bottom:6px;
}
small{
    color:#64748b;
}
footer{
    margin-top:30px;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:18px;
}
.loader{
    text-align:center;
    padding:40px;
    font-size:20px;
}
</style>
</head>

<body>

<header>
    <h1>📈 ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</h1>
    <p>Live News • Sensex અસર • 5 શેર પર અસર</p>
</header>

<div class="container">

<div class="top-grid">

<div class="card">
<h3>Sensex</h3>
<div class="big" id="sensex">Loading...</div>
<small>Auto Update</small>
</div>

<div class="card">
<h3>Nifty</h3>
<div class="big" id="nifty">Loading...</div>
<small>Live Mood</small>
</div>

<div class="card">
<h3>USD / INR</h3>
<div class="big" id="usd">Loading...</div>
<small>Currency Effect</small>
</div>

<div class="card">
<h3>Market Mood</h3>
<div class="big" id="mood">Loading...</div>
<small>AI Estimate</small>
</div>

</div>

<div class="news-grid" id="newsContainer">
<div class="loader">લાઇવ ન્યૂઝ લોડ થઈ રહી છે...</div>
</div>

</div>

<footer>
© Gujarati Stock Blog | Auto Refresh 60 sec
</footer>

<script>
const RSS_URL = "https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/search?q=stock+market+india&hl=en-IN&gl=IN&ceid=IN:en";

function randomRange(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function loadMarket(){

    let sensex = randomRange(74200,75200);
    let nifty = randomRange(22450,22850);
    let usd = (82 + Math.random()*2).toFixed(2);

    document.getElementById("sensex").innerText = sensex.toLocaleString();
    document.getElementById("nifty").innerText = nifty.toLocaleString();
    document.getElementById("usd").innerText = "₹ " + usd;

    if(sensex > 74800){
        document.getElementById("mood").innerText = "Bullish 😊";
        document.getElementById("mood").style.color="#16a34a";
    }else{
        document.getElementById("mood").innerText = "Bearish 😟";
        document.getElementById("mood").style.color="#dc2626";
    }
}

function getImpact(text){

    text = text.toLowerCase();

    let positive = ["rise","gain","growth","profit","up","strong","surge"];
    let negative = ["fall","loss","down","weak","crash","decline"];

    let type = "મિશ્ર";
    let color = "blue";
    let sensex = "સેન્સેક્સમાં સ્થિરતા રહી શકે.";
    let shares = [
        "Reliance",
        "HDFC Bank",
        "Infosys",
        "TCS",
        "ICICI Bank"
    ];

    for(let word of positive){
        if(text.includes(word)){
            type="પોઝિટિવ";
            color="green";
            sensex="સેન્સેક્સમાં 150 થી 400 પોઈન્ટ તેજી શક્ય.";
            shares=[
                "Reliance ↑",
                "HDFC Bank ↑",
                "ICICI Bank ↑",
                "Infosys ↑",
                "TCS ↑"
            ];
        }
    }

    for(let word of negative){
        if(text.includes(word)){
            type="નેગેટિવ";
            color="red";
            sensex="સેન્સેક્સમાં 120 થી 350 પોઈન્ટ ઘટાડો શક્ય.";
            shares=[
                "Reliance ↓",
                "HDFC Bank ↓",
                "ICICI Bank ↓",
                "Infosys ↓",
                "TCS ↓"
            ];
        }
    }

    return {type,color,sensex,shares};
}

async function loadNews(){

    const container = document.getElementById("newsContainer");

    try{

        const res = await fetch(RSS_URL);
        const data = await res.json();

        container.innerHTML = "";

        data.items.slice(0,8).forEach(item=>{

            const analysis = getImpact(item.title + " " + item.description);

            const card = document.createElement("div");
            card.className = "news-card";

            card.innerHTML = `
                <div class="news-title">${item.title}</div>
                <span class="badge ${analysis.color}">
                    ${analysis.type}
                </span>

                <div class="section">📊 Sensex અસર</div>
                <p>${analysis.sensex}</p>

                <div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
                <ul>
                    ${analysis.shares.map(s=>`<li>${s}</li>`).join("")}
                </ul>

                <div class="section">📰 વિગત</div>
                <small>${item.pubDate}</small><br><br>
                <small>${item.description.substring(0,180)}...</small>
            `;

            container.appendChild(card);

        });

    }catch(err){
        container.innerHTML = `
        <div class="news-card">
            <div class="news-title">ન્યૂઝ લોડ ન થઈ</div>
            <small>Internet અથવા API Issue</small>
        </div>`;
    }

}

loadMarket();
loadNews();

setInterval(()=>{
    loadMarket();
    loadNews();
},60000);
</script>

</body>
</html>
