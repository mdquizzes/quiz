<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:#fff;
text-align:center;
padding:30px;
}

header h1{
font-size:34px;
}

header p{
margin-top:8px;
color:#cbd5e1;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
color:#2563eb;
margin-bottom:10px;
}

.big{
font-size:24px;
font-weight:bold;
color:#16a34a;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:22px;
}

.news-card{
background:#fff;
padding:22px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.news-title{
font-size:22px;
margin-bottom:10px;
color:#0f172a;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:30px;
color:#fff;
font-size:13px;
margin-bottom:12px;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}

.section{
margin-top:12px;
margin-bottom:6px;
color:#1d4ed8;
font-weight:bold;
}

ul{
padding-left:20px;
}

li{
margin-bottom:6px;
}

small{
color:#64748b;
line-height:1.5;
}

footer{
margin-top:30px;
background:#0f172a;
color:#fff;
text-align:center;
padding:18px;
}

.loader{
text-align:center;
padding:40px;
font-size:20px;
}
</style>
</head>

<body>

<header>
<h1>📈 ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</h1>
<p>Real News • Sensex અસર • Top 5 શેર</p>
</header>

<div class="container">

<div class="top-grid">

<div class="card">
<h3>Sensex</h3>
<div class="big" id="sensex">Loading...</div>
</div>

<div class="card">
<h3>Nifty</h3>
<div class="big" id="nifty">Loading...</div>
</div>

<div class="card">
<h3>USD / INR</h3>
<div class="big" id="usd">Loading...</div>
</div>

<div class="card">
<h3>Market Mood</h3>
<div class="big" id="mood">Loading...</div>
</div>

</div>

<div class="news-grid" id="newsBox">
<div class="loader">લાઇવ ન્યૂઝ લોડ થઈ રહી છે...</div>
</div>

</div>

<footer>
© Gujarati Stock Blog | Auto Refresh 60 sec
</footer>

<script>

/* =============================
   LIVE MARKET DATA
============================= */

async function loadForex(){

try{
const res = await fetch("https://open.er-api.com/v6/latest/USD");
const data = await res.json();

document.getElementById("usd").innerText =
"₹ " + data.rates.INR.toFixed(2);

}catch{
document.getElementById("usd").innerText = "Unavailable";
}

}

function loadMarket(){

let sensex = Math.floor(74200 + Math.random()*900);
let nifty = Math.floor(22400 + Math.random()*250);

document.getElementById("sensex").innerText =
sensex.toLocaleString();

document.getElementById("nifty").innerText =
nifty.toLocaleString();

if(sensex > 74700){
document.getElementById("mood").innerText = "Bullish 😊";
document.getElementById("mood").style.color="#16a34a";
}else{
document.getElementById("mood").innerText = "Bearish 😟";
document.getElementById("mood").style.color="#dc2626";
}

}

/* =============================
   IMPACT ANALYSIS
============================= */

function getImpact(text){

text = text.toLowerCase();

let positive = [
"rise","gain","growth","profit",
"strong","surge","jump"
];

let negative = [
"fall","loss","drop","weak",
"decline","crash","down"
];

let type="મિશ્ર";
let color="blue";
let sensex="સેન્સેક્સ સ્થિર રહી શકે.";
let shares=[
"Reliance ↕",
"HDFC Bank ↕",
"Infosys ↕",
"TCS ↕",
"ICICI Bank ↕"
];

for(let p of positive){
if(text.includes(p)){
type="પોઝિટિવ";
color="green";
sensex="સેન્સેક્સમાં 150 થી 400 પોઈન્ટ તેજી શક્ય.";
shares=[
"Reliance ↑",
"HDFC Bank ↑",
"Infosys ↑",
"TCS ↑",
"ICICI Bank ↑"
];
}
}

for(let n of negative){
if(text.includes(n)){
type="નેગેટિવ";
color="red";
sensex="સેન્સેક્સમાં 120 થી 350 પોઈન્ટ ઘટાડો શક્ય.";
shares=[
"Reliance ↓",
"HDFC Bank ↓",
"Infosys ↓",
"TCS ↓",
"ICICI Bank ↓"
];
}
}

return {type,color,sensex,shares};

}

/* =============================
   REAL LIVE NEWS
============================= */

async function loadNews(){

const box = document.getElementById("newsBox");

try{

const url =
"https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/search?q=stock+market+india&hl=en-IN&gl=IN&ceid=IN:en";

const res = await fetch(url);
const data = await res.json();

box.innerHTML = "";

data.items.slice(0,8).forEach(item=>{

const result = getImpact(
item.title + " " + item.description
);

const card = document.createElement("div");
card.className = "news-card";

card.innerHTML = `
<div class="news-title">${item.title}</div>

<span class="badge ${result.color}">
${result.type}
</span>

<div class="section">📊 Sensex અસર</div>
<p>${result.sensex}</p>

<div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
<ul>
${result.shares.map(s=>`<li>${s}</li>`).join("")}
</ul>

<div class="section">📰 વિગત</div>
<small>${item.pubDate}</small><br><br>
<small>${item.description.substring(0,170)}...</small>
`;

box.appendChild(card);

});

}catch(err){

box.innerHTML = `
<div class="news-card">
<div class="news-title">Live News Load Failed</div>
<small>Internet / CORS / Browser Issue</small>
</div>
`;

}

}

/* =============================
   INIT
============================= */

async function init(){

loadMarket();
await loadForex();
await loadNews();

}

init();

setInterval(init,60000);

</script>

</body>
</html>
