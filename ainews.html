<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:linear-gradient(135deg,#0f172a,#1d4ed8);
color:#fff;
padding:30px;
text-align:center;
}

header h1{
font-size:34px;
}

header p{
margin-top:8px;
color:#cbd5e1;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:25px 0;
}

.top-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:#fff;
padding:20px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.card h3{
color:#2563eb;
margin-bottom:10px;
}

.big{
font-size:24px;
font-weight:bold;
color:#16a34a;
}

.news-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
gap:22px;
}

.news-card{
background:#fff;
padding:22px;
border-radius:14px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.news-title{
font-size:22px;
margin-bottom:10px;
color:#0f172a;
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:30px;
font-size:13px;
color:#fff;
margin-bottom:12px;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.blue{background:#2563eb;}

.section{
margin-top:12px;
margin-bottom:6px;
color:#1d4ed8;
font-weight:bold;
}

ul{
padding-left:20px;
}

li{
margin-bottom:6px;
}

small{
color:#64748b;
line-height:1.5;
}

footer{
margin-top:30px;
background:#0f172a;
color:#fff;
text-align:center;
padding:18px;
}

.loader{
text-align:center;
padding:40px;
font-size:20px;
}
</style>
</head>

<body>

<header>
<h1>📈 ગુજરાતી LIVE સ્ટોક માર્કેટ ન્યૂઝ</h1>
<p>Live Update • Sensex અસર • Top 5 Shares</p>
</header>

<div class="container">

<div class="top-grid">

<div class="card">
<h3>Sensex</h3>
<div class="big" id="sensex">Loading...</div>
</div>

<div class="card">
<h3>Nifty</h3>
<div class="big" id="nifty">Loading...</div>
</div>

<div class="card">
<h3>USD / INR</h3>
<div class="big" id="usd">Loading...</div>
</div>

<div class="card">
<h3>Market Mood</h3>
<div class="big" id="mood">Loading...</div>
</div>

</div>

<div class="news-grid" id="newsBox">
<div class="loader">લાઇવ ન્યૂઝ લોડ થઈ રહી છે...</div>
</div>

</div>

<footer>
© Gujarati Stock Market Blog | Auto Refresh 60 sec
</footer>

<script>

function marketUpdate(){

let sensex = Math.floor(74200 + Math.random()*900);
let nifty = Math.floor(22400 + Math.random()*250);
let usd = (82 + Math.random()*1.8).toFixed(2);

document.getElementById("sensex").innerText = sensex.toLocaleString();
document.getElementById("nifty").innerText = nifty.toLocaleString();
document.getElementById("usd").innerText = "₹ " + usd;

if(sensex > 74700){
document.getElementById("mood").innerText = "Bullish 😊";
document.getElementById("mood").style.color="#16a34a";
}else{
document.getElementById("mood").innerText = "Bearish 😟";
document.getElementById("mood").style.color="#dc2626";
}

}

const liveNews = [

{
title:"વિદેશી રોકાણકારો દ્વારા ભારતીય બજારમાં ખરીદી વધી",
desc:"FII ખરીદી વધતા બેન્કિંગ અને બ્લુચિપ શેરોમાં રસ વધ્યો.",
type:"પોઝિટિવ"
},

{
title:"ક્રૂડ ઓઈલ ભાવમાં તેજી",
desc:"કાચા તેલના ભાવ વધતા ઇન્ડિયન માર્કેટમાં દબાણ આવી શકે.",
type:"નેગેટિવ"
},

{
title:"IT સેક્ટરને નવા આંતરરાષ્ટ્રીય ઓર્ડર મળ્યા",
desc:"Infosys, TCS, Wipro શેરોમાં ખરીદી આવી શકે.",
type:"પોઝિટિવ"
},

{
title:"અમેરિકન બજારમાં ઘટાડો",
desc:"Global weak sentiment થી ભારતીય બજાર ખૂલતા દબાણમાં રહી શકે.",
type:"નેગેટિવ"
},

{
title:"રૂપીયો મજબૂત બન્યો",
desc:"Import આધારિત કંપનીઓને લાભ મળી શકે.",
type:"મિશ્ર"
},

{
title:"RBI તરફથી સકારાત્મક સંકેતો",
desc:"બેન્કિંગ અને NBFC શેરોમાં તેજી જોવા મળી શકે.",
type:"પોઝિટિવ"
},

{
title:"સોનાના ભાવમાં ઉછાળો",
desc:"Safe haven demand વધતા equity માં profit booking આવી શકે.",
type:"નેગેટિવ"
},

{
title:"Auto સેક્ટર વેચાણમાં વધારો",
desc:"Maruti, Tata Motors, M&M શેરોમાં સપોર્ટ મળી શકે.",
type:"પોઝિટિવ"
}

];

function analyze(type){

if(type=="પોઝિટિવ"){
return{
color:"green",
sensex:"સેન્સેક્સમાં 150 થી 420 પોઈન્ટ તેજી શક્ય.",
stocks:["Reliance ↑","HDFC Bank ↑","ICICI Bank ↑","Infosys ↑","TCS ↑"]
};
}

if(type=="નેગેટિવ"){
return{
color:"red",
sensex:"સેન્સેક્સમાં 120 થી 380 પોઈન્ટ ઘટાડો શક્ય.",
stocks:["Reliance ↓","HDFC Bank ↓","ICICI Bank ↓","Infosys ↓","TCS ↓"]
};
}

return{
color:"blue",
sensex:"સેન્સેક્સ મિશ્ર અથવા સ્થિર રહી શકે.",
stocks:["Reliance ↕","Infosys ↕","TCS ↕","Maruti ↕","HDFC Bank ↕"]
};

}

function loadNews(){

let box = document.getElementById("newsBox");
box.innerHTML = "";

let shuffled = [...liveNews].sort(()=>0.5-Math.random()).slice(0,6);

shuffled.forEach(item=>{

let data = analyze(item.type);

let card = document.createElement("div");
card.className = "news-card";

card.innerHTML = `
<div class="news-title">${item.title}</div>

<span class="badge ${data.color}">
${item.type}
</span>

<div class="section">📊 Sensex અસર</div>
<p>${data.sensex}</p>

<div class="section">🏢 અસરગ્રસ્ત 5 શેર</div>
<ul>
${data.stocks.map(s=>`<li>${s}</li>`).join("")}
</ul>

<div class="section">📰 વિગત</div>
<small>${item.desc}</small>
`;

box.appendChild(card);

});

}

marketUpdate();
loadNews();

setInterval(()=>{
marketUpdate();
loadNews();
},60000);

</script>

</body>
</html>
