<!DOCTYPE html>
<html>
<head>
  <title>Nested Square Pattern Game</title>
  <style>
    body {
      background: #2e8b57;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 500px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }

    .bigSquare {
      width: 80px;
      height: 80px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 2px;
      transform: rotate(45deg);
    }

    .smallSquare {
      width: 100%;
      height: 100%;
      background: white;
    }
  </style>
</head>

<body>

<div class="container" id="pattern"></div>

<script>
const colors = [
  "#1b4332", "#081c15", "#2d6a4f",
  "#344e41", "#3a5a40"
];

function createPattern() {
  const container = document.getElementById("pattern");

  for (let i = 0; i < 15; i++) { // number of big squares
    let big = document.createElement("div");
    big.className = "bigSquare";

    let color = colors[Math.floor(Math.random() * colors.length)];
    big.style.background = color;

    for (let j = 0; j < 25; j++) { // 5x5 grid inside
      let small = document.createElement("div");
      small.className = "smallSquare";
      big.appendChild(small);
    }

    container.appendChild(big);
  }
}

createPattern();
</script>

</body>
</html>
