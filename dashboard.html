<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Dashboard - MD QUIZZES</title>

<style>

body{
font-family:Segoe UI;
background:#001d3d;
color:white;
margin:0;
padding:40px;
text-align:center;
}

h1{
margin-bottom:30px;
}

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:900px;
margin:auto;

}

.card{

background:#111;
padding:25px;
border-radius:12px;

}

h3{
margin-top:0;
}

.stat{

font-size:20px;
margin:8px 0;

}

button{

padding:12px 20px;
border:none;
background:gold;
cursor:pointer;
font-weight:bold;
border-radius:6px;

}

.leaderboard p{
margin:6px 0;
}

</style>

</head>

<body>

<h1>📊 MD QUIZZES Dashboard</h1>

<div class="grid">

<!-- PROFILE -->

<div class="card">

<h3>👤 Profile</h3>

<p id="userName">Loading...</p>

<p class="stat">
⭐ Points: <span id="points">0</span>
</p>

<p class="stat">
🏆 Rank: <span id="rank">...</span>
</p>

</div>


<!-- QUIZ STATS -->

<div class="card">

<h3>📈 Quiz Statistics</h3>

<p class="stat">
Quizzes Attempted: <span id="attempts">0</span>
</p>

<p class="stat">
Correct Answers: <span id="correct">0</span>
</p>

<p class="stat">
Wrong Answers: <span id="wrong">0</span>
</p>

<p class="stat">
Accuracy: <span id="accuracy">0%</span>
</p>

</div>


<!-- CONTINUE -->

<div class="card">

<h3>🚀 Continue Learning</h3>

<button onclick="location.href='https://mdquizzes.github.io/mdquizzes/'">
Start Quiz
</button>

</div>


<!-- LEADERBOARD -->

<div class="card leaderboard">

<h3>🏆 Top Performers</h3>

<div id="leaderboardPreview">
Loading...
</div>

</div>

</div>

<script type="module" src="./js/dashboard.js"></script>

</body>
</html>
