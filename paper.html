<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CBSE Paper Generator | MD Quizzes</title>

<!-- CSS -->
<link rel="stylesheet" href="paper.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<!-- ===== HEADER ===== -->
<header class="header">
<h1>📄 CBSE Paper Generator</h1>
<p>Create Real Exam Papers Instantly</p>
</header>

<!-- ===== MAIN CONTAINER ===== -->
<div class="container">

<!-- ===== CONTROL PANEL ===== -->
<div class="panel">

<h2>⚙️ Generate Paper</h2>

<label>Class</label>
<select id="classSelect">
<option value="10">Class 10</option>
</select>

<label>Subject</label>
<select id="subjectSelect">
<option value="science">Science</option>
</select>

<hr>

<h3>Section A (MCQ)</h3>
<label><input type="checkbox" class="chapter" value="Light"> Light</label>
<label><input type="checkbox" class="chapter" value="Electricity"> Electricity</label>

<h3>Section B (Short)</h3>
<label><input type="checkbox" class="chapter" value="Life Processes"> Life Processes</label>

<h3>Section C (Long)</h3>
<label><input type="checkbox" class="chapter" value="Chemical Reactions"> Chemical Reactions</label>

<h3>Section D (Case Study)</h3>
<label><input type="checkbox" class="chapter" value="Control Coordination"> Control & Coordination</label>

<br><br>

<button id="generateBtn">🚀 Generate Paper</button>

</div>

<!-- ===== ACTION BUTTONS ===== -->
<div class="actions">

<button id="printBtn">🖨 Print</button>
<button id="pdfBtn">📥 Download PDF</button>
<button id="regenerateBtn">🔁 Regenerate</button>

</div>

<!-- ===== PAPER OUTPUT ===== -->
<div id="paperContainer" class="paper-container">

<!-- Generated paper will appear here -->

</div>

</div>

<!-- ===== LIBRARIES ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- ===== YOUR QUESTION FILE ===== -->
<script src="https://raw.githubusercontent.com/mdquizzes/mdquizzes/main/quiz-data/paper/questions.js"></script>


<!-- ===== MAIN SCRIPT ===== -->
<script>

// ===== GLOBAL DATA =====
const ALL_QUESTIONS = window.QUIZ_DATA || [];

// ===== EVENT LISTENERS =====
document.getElementById("generateBtn").addEventListener("click", generatePaper);
document.getElementById("printBtn").addEventListener("click", () => window.print());
document.getElementById("pdfBtn").addEventListener("click", downloadPDF);
document.getElementById("regenerateBtn").addEventListener("click", generatePaper);

// ===== SHUFFLE =====
function shuffle(arr){
return arr.sort(() => Math.random() - 0.5);
}

// ===== FILTER ENGINE =====
function getFilteredQuestions(){

let difficulty = document.getElementById("difficultySelect").value;

return ALL_QUESTIONS.filter(q=>{
return difficulty === "all" || q.difficulty === difficulty;
});

}

// ===== PAPER GENERATOR =====
function generatePaper(){

let count = parseInt(document.getElementById("questionCount").value);

let questions = shuffle(getFilteredQuestions()).slice(0, count);

if(questions.length === 0){
alert("No questions found! Check your data.");
return;
}

let html = `

<div class="paper">

<div class="paper-header">
<h2>CBSE SAMPLE QUESTION PAPER</h2>
<p><b>Class:</b> X | <b>Subject:</b> Science</p>
<p><b>Time:</b> 3 Hours | <b>Max Marks:</b> 80</p>
</div>

<hr>

<!-- SECTION A -->
<div class="section">
<h3>Section A (MCQ)</h3>
`;

questions.forEach((q,i)=>{

html += `<div class="question">
<p><b>${i+1}. ${q.question}</b></p>`;

q.answers.forEach((opt,j)=>{
html += `<p class="option">(${String.fromCharCode(97+j)}) ${opt.text}</p>`;
});

html += `</div>`;

});

html += `</div>`;

// ===== ANSWER KEY =====
html += `
<div class="section answer-key">
<h3>Answer Key</h3>
`;

questions.forEach((q,i)=>{
let correct = q.answers.find(a=>a.correct)?.text || "";
html += `<p>${i+1}. ${correct}</p>`;
});

html += `</div></div>`;

document.getElementById("paperContainer").innerHTML = html;

}

// ===== PDF DOWNLOAD =====
function downloadPDF(){

const element = document.getElementById("paperContainer");

if(!element.innerHTML){
alert("Generate paper first!");
return;
}

let opt = {
margin: 0.5,
filename: 'CBSE_Paper.pdf',
image: { type: 'jpeg', quality: 0.98 },
html2canvas: { scale: 2 },
jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
};

html2pdf().set(opt).from(element).save();

}

</script>
<script src="questions.js"></script>
<script src="paper.js"></script>
</body>
</html>
