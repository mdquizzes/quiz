<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD QUIZZES - Paper Builder</title>

<style>
body{font-family:Arial;background:#001d3d;color:white;padding:20px}
.panel{background:#003566;padding:15px;border-radius:10px;margin-bottom:15px}
button{padding:8px 12px;margin:5px;cursor:pointer}
.sectionBox{border:1px solid #ccc;padding:10px;margin-top:10px}
</style>

</head>

<body>

<h2>📄 Smart Paper Builder</h2>

<!-- STEP 1 -->

<div class="panel">
<h3>Select</h3>

<select id="classSelect">
<option>Class 10</option>
</select>

<select id="subjectSelect">
<option>Science</option>
</select>

</div>

<!-- STEP 2 -->

<div class="panel">
<h3>Select Section</h3>

<button onclick="openSection('A')">Section A</button> <button onclick="openSection('B')">Section B</button> <button onclick="openSection('C')">Section C</button> <button onclick="openSection('D')">Section D</button>

<div id="chapterArea"></div>

</div>

<!-- QUESTION SELECT -->

<div id="questionArea"></div>

<!-- GENERATED PAPER -->

<div class="panel">
<h3>📄 Your Paper</h3>
<div id="paperOutput"></div>
</div>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionA.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionB.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionC.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionD.js"></script>

<script>

// ===== DATA =====
const ALL = [
...(window.SECTION_A||[]).map(q=>({...q,section:"A"})),
...(window.SECTION_B||[]).map(q=>({...q,section:"B"})),
...(window.SECTION_C||[]).map(q=>({...q,section:"C"})),
...(window.SECTION_D||[]).map(q=>({...q,section:"D"}))
];

let currentSection = "";
let selectedQuestions = [];

// ===== STEP 2 =====
function openSection(sec){

currentSection = sec;

// GET CHAPTERS
let chapters = [...new Set(ALL
.filter(q=>q.section===sec)
.map(q=>q.chapter))];

let html = "<h4>Select Chapter</h4>";

chapters.forEach(ch=>{
html += `<label><input type="checkbox" onchange="loadQuestions('${ch}')"> ${ch}</label><br>`;
});

document.getElementById("chapterArea").innerHTML = html;
}

// ===== LOAD QUESTIONS =====
function loadQuestions(chapter){

let data = ALL.filter(q =>
q.section===currentSection && q.chapter===chapter
);

let html = "<h4>Select Questions</h4>";

data.slice(0,10).forEach((q,i)=>{
html += `
<div>
<button onclick="addQuestion(${i})">➕</button>
${q.question}
</div>`;
});

window.currentList = data;

document.getElementById("questionArea").innerHTML = html;
}

// ===== ADD QUESTION =====
function addQuestion(i){

let q = window.currentList[i];

selectedQuestions.push(q);

renderPaper();
}

// ===== DELETE =====
function removeQuestion(index){
selectedQuestions.splice(index,1);
renderPaper();
}

// ===== RENDER PAPER =====
function renderPaper(){

let html = "";
let marks = 0;

selectedQuestions.forEach((q,i)=>{

let mark = q.section==="A"?1:q.section==="B"?2:q.section==="C"?3:5;
marks += mark;

html += `
<div class="sectionBox">
<b>${i+1}. ${q.question}</b>
<button onclick="removeQuestion(${i})">❌</button>
</div>
`;

});

html += `<h3>Total Marks: ${marks}</h3>`;

document.getElementById("paperOutput").innerHTML = html;
}

</script>

</body>
</html>
