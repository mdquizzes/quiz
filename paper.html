<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD QUIZZES - Paper Builder</title>

<style>
body{font-family:Segoe UI;background:#001d3d;color:white;padding:20px}

.panel{
background:#003566;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

button{padding:6px 10px;margin:5px;cursor:pointer}

.questionBox{
background:#012a4a;
padding:8px;
margin:5px;
border-radius:6px;
}

/* PAPER STYLE */
.paper{
background:white;
color:black;
padding:20px;
border-radius:10px;
margin-top:20px;
}

.section{
margin-top:15px;
}

.section h3{
border-bottom:1px solid black;
}

</style>

</head>

<body>

<h2>📄 Smart CBSE Paper Builder</h2>

<!-- STEP 1 -->

<div class="panel">
<select>
<option>Class 10</option>
</select>

<select>
<option>Science</option>
</select>
</div>

<!-- STEP 2 -->

<div class="panel">
<h3>Select Section</h3>

<button onclick="openSection('A')">Section A</button> <button onclick="openSection('B')">Section B</button> <button onclick="openSection('C')">Section C</button> <button onclick="openSection('D')">Section D</button>

<div id="chapterArea"></div>
</div>

<!-- QUESTION AREA -->

<div id="questionArea"></div>

<!-- PAPER -->

<div class="panel">
<h3>📄 Generated Paper</h3>
<div id="paperOutput"></div>
</div>

<!-- DATA -->

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionA.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionB.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionC.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionD.js"></script>

<script>

// ===== DATA =====
const ALL = [
...(window.SECTION_A||[]).map(q=>({...q,section:"A"})),
...(window.SECTION_B||[]).map(q=>({...q,section:"B"})),
...(window.SECTION_C||[]).map(q=>({...q,section:"C"})),
...(window.SECTION_D||[]).map(q=>({...q,section:"D"}))
];

let currentSection = "";
let selectedMap = new Map(); // unique store

// ===== OPEN SECTION =====
function openSection(sec){

currentSection = sec;

let chapters = [...new Set(
ALL.filter(q=>q.section===sec).map(q=>q.chapter)
)];

let html = "<h4>Select Chapter</h4>";

chapters.forEach(ch=>{
html += `<label>
<input type="checkbox" onchange="loadQuestions('${ch}', this)">
${ch}
</label><br>`;
});

document.getElementById("chapterArea").innerHTML = html;
document.getElementById("questionArea").innerHTML = "";
}

// ===== LOAD QUESTIONS =====
function loadQuestions(chapter, checkbox){

if(!checkbox.checked){
document.getElementById("questionArea").innerHTML = "";
return;
}

let data = ALL.filter(q =>
q.section===currentSection && q.chapter===chapter
);

window.currentList = data;

let html = "<h4>Select Questions</h4>";

data.slice(0,10).forEach((q,i)=>{

let key = currentSection + "_" + chapter + "_" + i;

html += `
<div class="questionBox">
<label>
<input type="checkbox"
${selectedMap.has(key) ? "checked":""}
onchange="toggleQuestion('${key}', ${i})">
${q.question}
</label>
</div>
`;

});

document.getElementById("questionArea").innerHTML = html;
}

// ===== TOGGLE =====
function toggleQuestion(key, i){

let q = window.currentList[i];

if(selectedMap.has(key)){
selectedMap.delete(key);
}else{
selectedMap.set(key, q);
}

renderPaper();
}

// ===== RENDER PAPER =====
function renderPaper(){

let sections = {A:[],B:[],C:[],D:[]};

selectedMap.forEach(q=>{
sections[q.section].push(q);
});

let marks = 0;

let html = `
<div class="paper">

<h2 style="text-align:center;">MD QUIZZES</h2>
<p><b>Class:</b> X | <b>Subject:</b> Science</p>
<hr>
`;

// SECTION A
if(sections.A.length){
html += `<div class="section"><h3>Section A (1 mark each)</h3>`;
sections.A.forEach((q,i)=>{
marks += 1;
html += `<p>${i+1}. ${q.question}</p>`;
});
html += `</div>`;
}

// SECTION B
if(sections.B.length){
html += `<div class="section"><h3>Section B (2 marks each)</h3>`;
sections.B.forEach((q,i)=>{
marks += 2;
html += `<p>${i+1}. ${q.question}</p>`;
});
html += `</div>`;
}

// SECTION C
if(sections.C.length){
html += `<div class="section"><h3>Section C (3 marks each)</h3>`;
sections.C.forEach((q,i)=>{
marks += 3;
html += `<p>${i+1}. ${q.question}</p>`;
});
html += `</div>`;
}

// SECTION D
if(sections.D.length){
html += `<div class="section"><h3>Section D (5 marks each)</h3>`;
sections.D.forEach((q,i)=>{
marks += 5;
html += `<p>${i+1}. ${q.question}</p>`;
});
html += `</div>`;
}

html += `<h3>Total Marks: ${marks}</h3>`;
html += `</div>`;

document.getElementById("paperOutput").innerHTML = html;
}

</script>

</body>
</html>
