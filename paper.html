<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBSE Paper Generator | MD Quizzes</title>

<link rel="stylesheet" href="paper.css">
</head>

<body>

<h1 style="text-align:center;">📄 CBSE Paper Generator</h1>

<div class="container">

<div class="panel">

<h3>Select Chapter</h3>

<label><input type="checkbox" class="chapter" value="Light"> Light</label> <label><input type="checkbox" class="chapter" value="Electricity"> Electricity</label>

</div>

<!-- QUESTION SELECT AREA -->

<div id="questionSelectArea"></div>

<div style="text-align:center;margin-top:10px;">
<button onclick="prevPage()">⬅ Prev</button>
<button onclick="nextPage()">Next ➡</button>
</div>

<br>

<button onclick="generatePaper()">🚀 Generate Paper</button>

<hr>

<div id="paperContainer"></div>

</div>

<!-- DATA -->

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionA.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionB.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionC.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionD.js"></script>

<script>

// ===== MERGE DATA =====
const ALL_QUESTIONS = [
...(window.SECTION_A || []).map(q => ({...q, section:"A"})),
...(window.SECTION_B || []).map(q => ({...q, section:"B"})),
...(window.SECTION_C || []).map(q => ({...q, section:"C"})),
...(window.SECTION_D || []).map(q => ({...q, section:"D"}))
];

let filtered = [];
let currentPage = 0;
const perPage = 10;
let selectedQuestions = new Set();

// ===== CHAPTER CHANGE =====
document.querySelectorAll(".chapter").forEach(cb=>{
cb.addEventListener("change", loadQuestions);
});

function loadQuestions(){

let selectedChapters = [...document.querySelectorAll(".chapter:checked")]
.map(cb=>cb.value);

filtered = ALL_QUESTIONS.filter(q =>
selectedChapters.includes(q.chapter)
);

currentPage = 0;
renderQuestions();
}

// ===== RENDER =====
function renderQuestions(){

let start = currentPage * perPage;
let pageData = filtered.slice(start, start + perPage);

let html = "";

pageData.forEach((q,i)=>{

let index = start + i;

html += `
<div style="border:1px solid #ccc;margin:10px;padding:10px;">
<label>
<input type="checkbox" ${selectedQuestions.has(index) ? "checked":""}
onclick="toggleSelect(${index})">
<b>${index+1}. ${q.question}</b>
</label>
</div>
`;

});

document.getElementById("questionSelectArea").innerHTML = html;
}

// ===== SELECT =====
function toggleSelect(i){
if(selectedQuestions.has(i)){
selectedQuestions.delete(i);
}else{
selectedQuestions.add(i);
}
}

// ===== PAGINATION =====
function nextPage(){
if((currentPage+1)*perPage < filtered.length){
currentPage++;
renderQuestions();
}
}

function prevPage(){
if(currentPage > 0){
currentPage--;
renderQuestions();
}
}

// ===== GENERATE PAPER =====
function generatePaper(){

let selected = [...selectedQuestions].map(i=>filtered[i]);

if(selected.length === 0){
alert("Select questions first!");
return;
}

let html = "<h2>Generated Paper</h2>";

selected.forEach((q,i)=>{
html += `<p><b>${i+1}. ${q.question}</b></p>`;
});

document.getElementById("paperContainer").innerHTML = html;

}

</script>

</body>
</html>
