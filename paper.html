<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CBSE Paper Generator | MD Quizzes</title>

<link rel="stylesheet" href="paper.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<header class="header">
<h1>📄 CBSE Paper Generator</h1>
<p>Create Real Exam Papers Instantly</p>
</header>

<div class="container">

<div class="panel">

<h2>⚙️ Generate Paper</h2>

<label>Class</label> <select>

<option>Class 10</option>
</select>

<label>Subject</label> <select>

<option>Science</option>
</select>

<hr>

<h3>Section A (MCQ)</h3>
<label><input type="checkbox" class="chapter" value="Light"> Light</label>
<label><input type="checkbox" class="chapter" value="Electricity"> Electricity</label>

<h3>Section B (Short)</h3>
<label><input type="checkbox" class="chapter" value="Life Processes"> Life Processes</label>

<h3>Section C (Long)</h3>
<label><input type="checkbox" class="chapter" value="Chemical Reactions"> Chemical Reactions</label>

<h3>Section D (Case Study)</h3>
<label><input type="checkbox" class="chapter" value="Control Coordination"> Control & Coordination</label>

<br><br>

<button id="generateBtn">🚀 Generate Paper</button>

</div>

<div class="actions">
<button id="printBtn">🖨 Print</button>
<button id="pdfBtn">📥 Download PDF</button>
<button id="regenerateBtn">🔁 Regenerate</button>
</div>

<div id="paperContainer" class="paper-container"></div>

</div>

<!-- LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- SECTION DATA -->
<script src="https://raw.githubusercontent.com/mdquizzes/mdquizzes/main/quiz-data/paper/sectionA.js"></script>
<script src="https://raw.githubusercontent.com/mdquizzes/mdquizzes/main/quiz-data/paper/sectionB.js"></script>
<script src="https://raw.githubusercontent.com/mdquizzes/mdquizzes/main/quiz-data/paper/sectionC.js"></script>
<script src="https://raw.githubusercontent.com/mdquizzes/mdquizzes/main/quiz-data/paper/sectionD.js"></script>

<!-- MAIN LOGIC -->
<script src="https://raw.githubusercontent.com/mdquizzes/mdquizzes/main/js/paper.js"></script>

</body>
</html>
