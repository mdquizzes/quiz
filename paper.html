<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD QUIZZES - CBSE Paper Builder</title>

<style>
body{font-family:Segoe UI;background:#001d3d;color:white;padding:20px}

.panel{
background:#003566;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

button{
padding:8px 12px;
margin:5px;
cursor:pointer;
border:none;
border-radius:6px;
background:#ffd60a;
font-weight:bold;
}

.questionBox{
background:#012a4a;
padding:8px;
margin:5px;
border-radius:6px;
}

/* PAPER */
.paper{
background:white;
color:black;
padding:20px;
border-radius:10px;
}
  .optionsRow {
display: flex;
flex-wrap: wrap;
gap: 15px;
margin-top: 5px;
font-size: 14px;
}

.optionItem {
width: 48%; /* 2 per line */
}

/* PRINT OPTIMIZATION */
.paper p {
margin: 5px 0;
}

.optionsRow {
margin-left: 15px;
}

.section{margin-top:15px;}
.section h3{border-bottom:1px solid black;}

.actions{text-align:center;margin-top:10px;}

</style>

</head>

<body>

<h2>📄 Smart CBSE Paper Builder</h2>

<div class="panel">
<select><option>Class 10</option></select>
<select><option>Science</option></select>
</div>

<div class="panel">
<h3>Select Section</h3>
<button onclick="openSection('A')">Section A</button>
<button onclick="openSection('B')">Section B</button>
<button onclick="openSection('C')">Section C</button>
<button onclick="openSection('D')">Section D</button>

<div id="chapterArea"></div>
</div>

<div id="questionArea"></div>

<div class="panel">
<h3>📄 Generated Paper</h3>

<div class="actions">
<button onclick="printPaper()">🖨 Print</button>
<button onclick="downloadPDF()">📥 Download PDF</button>
<button onclick="toggleAnswer()">🧠 Answer Key</button>
<button onclick="downloadAnswerPDF()">📄 Answer PDF</button>
</div>

<div id="paperOutput"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionA.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionB.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionC.js"></script>

<script src="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/paper/sectionD.js"></script>

<script>

const ALL = [
...(window.SECTION_A||[]).map(q=>({...q,section:"A"})),
...(window.SECTION_B||[]).map(q=>({...q,section:"B"})),
...(window.SECTION_C||[]).map(q=>({...q,section:"C"})),
...(window.SECTION_D||[]).map(q=>({...q,section:"D"}))
];

let currentSection = "";
let selectedMap = new Map();
let showAnswer = false;

// SECTION
function openSection(sec){

currentSection = sec;

let chapters = [...new Set(
ALL.filter(q=>q.section===sec).map(q=>q.chapter)
)];

let html = "<h4>Select Chapter</h4>";

chapters.forEach(ch=>{
html += `<label>
<input type="checkbox" onchange="loadQuestions('${ch}', this)">
${ch}
</label><br>`;
});

document.getElementById("chapterArea").innerHTML = html;
document.getElementById("questionArea").innerHTML = "";
}

// LOAD QUESTIONS
function loadQuestions(ch, cb){

if(!cb.checked){
document.getElementById("questionArea").innerHTML="";
return;
}

let data = ALL.filter(q=>q.section===currentSection && q.chapter===ch);

window.currentList = data;

let html="<h4>Select Questions</h4>";

data.slice(0,10).forEach((q,i)=>{

let key=currentSection+"_"+ch+"_"+i;

let optionsHTML = "";

if(q.answers){
const labels = ["(a)", "(b)", "(c)", "(d)"];

optionsHTML += `<div class="optionsRow">`;

q.answers.forEach((opt, idx)=>{
optionsHTML += `
<span class="optionItem">
<b>${labels[idx]}</b> ${opt.text}
</span>
`;
});

optionsHTML += `</div>`;
}
});

document.getElementById("questionArea").innerHTML=html;
}

// TOGGLE
function toggleQ(key,i){

let q=window.currentList[i];

if(selectedMap.has(key)){
selectedMap.delete(key);
}else{
selectedMap.set(key,q);
}

renderPaper();
}

// RENDER
function renderPaper(){

let sections={A:[],B:[],C:[],D:[]};

selectedMap.forEach(q=>sections[q.section].push(q));

let marks=0;

let html=`<div class="paper">`;

let date=new Date().toLocaleDateString();

html+=`
<h2 style="text-align:center;">MD QUIZZES</h2>
<p><b>Date:</b> ${date}</p>
`;

Object.keys(sections).forEach(sec=>{

if(sections[sec].length){

let m = sec==="A"?1:sec==="B"?2:sec==="C"?3:5;

html+=`<div class="section"><h3>Section ${sec}</h3>`;

sections[sec].forEach((q,i)=>{
marks+=m;

html+=`<p><b>${i+1}. ${q.question}</b></p>`;

if(q.answers){
const labels = ["(a)", "(b)", "(c)", "(d)"];

html+=`<div class="optionsRow">`;

q.answers.forEach((opt, idx)=>{
html+=`
<span class="optionItem">
${labels[idx]} ${opt.text}
</span>
`;
});

html+=`</div>`;
}

if(showAnswer && q.answers){
let ans=q.answers.find(a=>a.correct)?.text;
html+=`<p><i>Ans: ${ans}</i></p>`;
}

});

html+=`</div>`;
}

});

let time=Math.ceil(marks*1.5);

html=html.replace("</h2>",`</h2>
<p><b>Time:</b> ${time} min | <b>Max Marks:</b> ${marks}</p>
`);

html+=`</div>`;

document.getElementById("paperOutput").innerHTML=html;
}

// REMOVE
function removeQ(sec,index){

let arr=[...selectedMap.values()].filter(q=>q.section===sec);

let q=arr[index];

selectedMap.forEach((val,key)=>{
if(val===q) selectedMap.delete(key);
});

renderPaper();
}

// PRINT
function printPaper(){
window.print();
}

// PDF
function downloadPDF(){
html2pdf().from(document.getElementById("paperOutput")).save("paper.pdf");
}

// ANSWER TOGGLE
function toggleAnswer(){
showAnswer=!showAnswer;
renderPaper();
}

// ANSWER PDF
function downloadAnswerPDF(){
showAnswer=true;
renderPaper();
html2pdf().from(document.getElementById("paperOutput")).save("answer-key.pdf");
showAnswer=false;
renderPaper();
}

</script>

</body>
</html>
