<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD QUIZZES</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle,#001f3f,#000814);
color:white;
text-align:center;
}

h1{color:#ffd60a;margin-top:20px;}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.topbar{
display:flex;
justify-content:flex-end;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.topbar span{
margin-right:auto;
font-weight:bold;
color:#ffd60a;
}

button{
padding:8px 14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
}

.login-btn{background:#ffd60a;}
.logout-btn{background:#ff3b3b;color:white;}
.profile-btn{background:#00c896;color:white;}

.start-btn{
background:#ffd60a;
font-size:16px;
margin-top:10px;
}

.select-box{
margin:8px;
padding:8px 12px;
border-radius:6px;
border:none;
}

.quiz-box{
margin-top:30px;
}

.option{
display:block;
margin:10px auto;
padding:10px;
width:260px;
border:none;
border-radius:6px;
background:#1e293b;
color:white;
cursor:pointer;
}

.option:hover{
background:#334155;
}

.result{
margin-top:20px;
}

.hide{
display:none;
}

.analysis-card{
background:#0f172a;
padding:12px;
margin:10px 0;
border-radius:8px;
text-align:left;
}

</style>

</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<div class="topbar">

<span id="userStatus">Guest</span>

<button class="login-btn" onclick="location.href='login.html'">
Login
</button>

<button class="profile-btn" style="display:none"
onclick="location.href='profile.html'">
Profile
</button>

<button class="logout-btn" style="display:none">
Logout
</button>

</div>

<!-- QUIZ SETTINGS -->

<div id="quizSetup">

<select id="boardSelect" class="select-box">
<option value="neet">NEET</option>
</select>

<select id="mediumSelect" class="select-box">
<option value="english">English</option>
<option value="gujarati">Gujarati</option>
</select>

<br>

<select id="subjectSelect" class="select-box">
<option value="Chemistry">Chemistry</option>
<option value="Physics">Physics</option>
<option value="Biology">Biology</option>
<option value="Full">Full Syllabus</option>
</select>

<br>

<select id="questionCountSelect" class="select-box">
<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
<option value="45">45 Questions</option>
<option value="90">90 Questions</option>
</select>

<select id="customPositiveSelect" class="select-box">
<option value="4">+4</option>
<option value="3">+3</option>
<option value="2">+2</option>
<option value="1">+1</option>
</select>

<select id="customNegativeSelect" class="select-box">
<option value="-1">-1</option>
<option value="-2">-2</option>
<option value="-0.5">-0.5</option>
</select>

<br>

<button class="start-btn" onclick="startQuiz()">🚀 Start Quiz</button>

</div>

<!-- QUIZ AREA -->

<div id="quizArea" class="hide">

<h2 id="quizTitle"></h2>

<div id="quizBox"></div>

</div>

<!-- RESULT -->

<div class="hide result" id="result">

<h3>Result Analysis</h3>

<p id="rScore"></p>
<p id="rPercent"></p>
<p id="rAccuracy"></p>
<p id="rGrade"></p>

<div id="questionAnalysis"></div>

<button onclick="location.reload()">Restart Quiz</button>

</div>

</div>


<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/leaderboard.js"></script>


<script>

let quizQuestions=[];
let currentQuestion=0;

let practiceScore=0;
let correctCount=0;
let wrongCount=0;
let totalQuestions=0;

let positive=4;
let negative=-1;

let userAnswers=[];


/* START QUIZ */

function startQuiz(){

document.getElementById("quizSetup").style.display="none";
document.getElementById("quizArea").classList.remove("hide");

const board=document.getElementById("boardSelect").value;
const medium=document.getElementById("mediumSelect").value;
const subject=document.getElementById("subjectSelect").value;

positive=parseFloat(document.getElementById("customPositiveSelect").value);
negative=parseFloat(document.getElementById("customNegativeSelect").value);

const limit=parseInt(document.getElementById("questionCountSelect").value);

quizQuestions=[];

/* CDN BASE PATH */

const baseURL="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes/quiz-data/neet/english/";

if(subject==="Full"){

const subjects=["Chemistry","Physics","Biology"];
let loaded=0;

subjects.forEach(sub=>{

const script=document.createElement("script");

script.src=baseURL+board+"/"+medium+"/"+sub+".js";

script.onload=function(){

quizQuestions.push(...window.QUIZ_DATA);

loaded++;

if(loaded===subjects.length){

prepareQuiz(limit);

}

};

document.body.appendChild(script);

});

}else{

const script=document.createElement("script");

script.src=baseURL+board+"/"+medium+"/"+subject+".js";

script.onload=function(){

quizQuestions=[...window.QUIZ_DATA];

prepareQuiz(limit);

};

document.body.appendChild(script);

}

}


/* PREPARE QUIZ */

function prepareQuiz(limit){

quizQuestions.sort(()=>Math.random()-0.5);

quizQuestions=quizQuestions.slice(0,limit);

totalQuestions=quizQuestions.length;

loadQuestion();

}


/* LOAD QUESTION */

function loadQuestion(){

const q=quizQuestions[currentQuestion];

document.getElementById("quizBox").innerHTML=

"<div class='question-box'>"+
"Q"+(currentQuestion+1)+". "+q.question+
"</div>"+

q.answers.map((a,i)=>

"<button class='option' onclick='checkAnswer("+i+")'>"+
a.text+
"</button>"

).join("");

}


/* CHECK ANSWER */

function checkAnswer(i){

const q=quizQuestions[currentQuestion];

userAnswers.push(i);

if(q.answers[i].correct){

practiceScore+=positive;
correctCount++;

}else{

practiceScore+=negative;
wrongCount++;

}

currentQuestion++;

if(currentQuestion<quizQuestions.length){

loadQuestion();

}else{

finishQuiz();

}

}


/* FINISH QUIZ */

function finishQuiz(){

document.getElementById("quizArea").style.display="none";

let percent=Math.round((correctCount/totalQuestions)*100);

let accuracy=Math.round((correctCount/(correctCount+wrongCount))*100);

let grade="C";

if(percent>=90) grade="A+";
else if(percent>=75) grade="A";
else if(percent>=60) grade="B";
else if(percent>=40) grade="C";
else grade="D";

document.getElementById("result").classList.remove("hide");

document.getElementById("rScore").innerText="Score : "+practiceScore;
document.getElementById("rPercent").innerText="Percentage : "+percent+"%";
document.getElementById("rAccuracy").innerText="Accuracy : "+accuracy+"%";
document.getElementById("rGrade").innerText="Grade : "+grade;


/* QUESTION ANALYSIS */

let analysisHTML="";

quizQuestions.forEach((q,index)=>{

const userIndex=userAnswers[index];

const correctIndex=q.answers.findIndex(a=>a.correct);

const userAnswer=q.answers[userIndex].text;
const correctAnswer=q.answers[correctIndex].text;

let color=userIndex===correctIndex
?"lightgreen":"salmon";

analysisHTML+=

"<div class='analysis-card'>"

+"<b>Q"+(index+1)+": "+q.question+"</b><br>"

+"Your Answer: <span style='color:"+color+"'>"+userAnswer+"</span><br>"

+"Correct Answer: <span style='color:#ffd60a'>"+correctAnswer+"</span>"

+"</div>";

});

document.getElementById("questionAnalysis").innerHTML=analysisHTML;

}

</script>

</body>
</html>
