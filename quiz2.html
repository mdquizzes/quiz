<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD QUIZZES</title>

<style>

body{
margin:0;
font-family: "Segoe UI", "Noto Sans", "Arial Unicode MS", sans-serif;
background:radial-gradient(circle,#001f3f,#000814);
color:white;
text-align:center;
}

h1{color:#ffd60a;margin-top:20px;}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.topbar{
display:flex;
justify-content:flex-end;
align-items:center;
gap:10px;
margin-bottom:20px;
}

.topbar span{
margin-right:auto;
font-weight:bold;
color:#ffd60a;
}

button{
padding:8px 14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:600;
}

.login-btn{background:#ffd60a;}
.logout-btn{background:#ff3b3b;color:white;}
.profile-btn{background:#00c896;color:white;}

.start-btn{
background:#ffd60a;
font-size:16px;
margin-top:10px;
}

.select-box{
margin:8px;
padding:8px 12px;
border-radius:6px;
border:none;
}

.option{
display:block;
margin:10px auto;
padding:10px;
width:260px;
border:none;
border-radius:6px;
background:#1e293b;
color:white;
cursor:pointer;
}

.option:hover{
background:#334155;
}

.result{
margin-top:20px;
}

.hide{
display:none;
}

.analysis-card{
background:#0f172a;
padding:12px;
margin:10px 0;
border-radius:8px;
text-align:left;
}

</style>

</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<div id="quizSetup">

<select id="boardSelect" class="select-box">
<option value="neet">NEET</option>
</select>

<select id="mediumSelect" class="select-box">
<option value="english">English</option>
<option value="gujarati">Gujarati</option>
</select>

<br>

<select id="subjectSelect" class="select-box" onchange="updateQuestionOptions()">
<option value="Chemistry">Chemistry</option>
<option value="Physics">Physics</option>
<option value="Biology">Biology</option>
<option value="Full">Full Syllabus</option>
</select>

<br>

<select id="questionCountSelect" class="select-box">
<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
<option value="45">45 Questions</option>
<option value="90">90 Questions</option>
<option value="180">180 Questions</option>
</select>

<select id="customPositiveSelect" class="select-box">
<option value="4">+4</option>
<option value="3">+3</option>
<option value="2">+2</option>
<option value="1">+1</option>
</select>

<select id="customNegativeSelect" class="select-box">
<option value="-1">-1</option>
<option value="-2">-2</option>
<option value="-0.5">-0.5</option>
</select>

<br>

<button class="start-btn" onclick="startQuiz()">🚀 Start Quiz</button>

</div>

<div id="quizArea" class="hide">
<h2 id="quizTitle"></h2>
<div id="quizBox"></div>
</div>

<div class="hide result" id="result">
<h3>Result Analysis</h3>
<p id="rScore"></p>
<p id="rPercent"></p>
<p id="rAccuracy"></p>
<p id="rGrade"></p>
<div id="questionAnalysis"></div>
<button onclick="location.reload()">Restart Quiz</button>
</div>

</div>

<!-- ✅ FIREBASE LOAD -->
<script type="module" src="js/firebase-config.js"></script>

<script type="module">

import { db, auth } from "./js/firebase-config.js";
import {
doc,
getDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* VARIABLES */

let quizQuestions=[];
let currentQuestion=0;
let practiceScore=0;
let correctCount=0;
let wrongCount=0;
let totalQuestions=0;
let positive=4;
let negative=-1;
let userAnswers=[];

/* QUESTION CONTROL */

window.updateQuestionOptions=function(){

const subject=document.getElementById("subjectSelect").value;
const qSelect=document.getElementById("questionCountSelect");

for(let i=0;i<qSelect.options.length;i++){

const val=parseInt(qSelect.options[i].value);

if(subject==="Full"){

if(val===180){
qSelect.options[i].disabled=false;
qSelect.value="180";
}else{
qSelect.options[i].disabled=true;
}

}else{

if(val===180){
qSelect.options[i].disabled=true;
}else{
qSelect.options[i].disabled=false;
}

}

}

}

/* START QUIZ */

window.startQuiz=function(){

document.getElementById("quizSetup").style.display="none";
document.getElementById("quizArea").classList.remove("hide");

const board=document.getElementById("boardSelect").value;
const medium=document.getElementById("mediumSelect").value;
const subject=document.getElementById("subjectSelect").value;

positive=parseFloat(document.getElementById("customPositiveSelect").value);
negative=parseFloat(document.getElementById("customNegativeSelect").value);

quizQuestions=[];

const baseURL="https://cdn.jsdelivr.net/gh/mdquizzes/mdquizzes@main/quiz-data/";

if(subject==="Full"){

let loaded=0;
let bio=[], phy=[], chem=[];

const load=(name,cb)=>{
const s=document.createElement("script");
s.src=baseURL+board+"/"+medium+"/"+name+".js";
s.onload=()=>{cb([...window.QUIZ_DATA]); loaded++; if(loaded===3) build();};
document.body.appendChild(s);
};

load("Biology",d=>bio=d);
load("Physics",d=>phy=d);
load("Chemistry",d=>chem=d);

function build(){

bio.sort(()=>Math.random()-0.5);
phy.sort(()=>Math.random()-0.5);
chem.sort(()=>Math.random()-0.5);

quizQuestions=[
...bio.slice(0,90),
...phy.slice(0,45),
...chem.slice(0,45)
];

quizQuestions.sort(()=>Math.random()-0.5);

totalQuestions=quizQuestions.length;

loadQuestion();

}

}else{

const limit=parseInt(document.getElementById("questionCountSelect").value);

const script=document.createElement("script");
script.src=baseURL+board+"/"+medium+"/"+subject+".js";

script.onload=function(){

quizQuestions=[...window.QUIZ_DATA];

quizQuestions.sort(()=>Math.random()-0.5);
quizQuestions=quizQuestions.slice(0,limit);

totalQuestions=quizQuestions.length;

loadQuestion();

};

document.body.appendChild(script);

}

}

/* LOAD */

function loadQuestion(){

const q=quizQuestions[currentQuestion];

document.getElementById("quizBox").innerHTML=
"<div>Q"+(currentQuestion+1)+". "+q.question+"</div>"+
q.answers.map((a,i)=>
"<button class='option' onclick='checkAnswer("+i+")'>"+a.text+"</button>"
).join("");

}

/* ANSWER */

window.checkAnswer=function(i){

const q=quizQuestions[currentQuestion];
userAnswers.push(i);

if(q.answers[i].correct){
practiceScore+=positive;
correctCount++;
}else{
practiceScore+=negative;
wrongCount++;
}

currentQuestion++;

if(currentQuestion<quizQuestions.length){
loadQuestion();
}else{
finishQuiz();
}

}

/* 🔥 SAVE SCORE */

async function saveUserScore(){

const user = auth.currentUser;

if(!user) return;

const ref = doc(db,"users",user.uid);

const snap = await getDoc(ref);

let prev = 0;

if(snap.exists()){
prev = snap.data().totalScore || 0;
}

await setDoc(ref,{
totalScore: prev + practiceScore
},{merge:true});

}

/* RESULT */

function finishQuiz(){

document.getElementById("quizArea").style.display="none";

let percent=Math.round((correctCount/totalQuestions)*100);
let accuracy=Math.round((correctCount/(correctCount+wrongCount))*100);

let grade="C";

if(percent>=90) grade="A+";
else if(percent>=75) grade="A";
else if(percent>=60) grade="B";
else if(percent>=40) grade="C";
else grade="D";

document.getElementById("result").classList.remove("hide");

document.getElementById("rScore").innerText="Score : "+practiceScore;
document.getElementById("rPercent").innerText="Percentage : "+percent+"%";
document.getElementById("rAccuracy").innerText="Accuracy : "+accuracy+"%";
document.getElementById("rGrade").innerText="Grade : "+grade;

/* ✅ SAVE TO LEADERBOARD */
saveUserScore();

}

updateQuestionOptions();

</script>

</body>
</html>
