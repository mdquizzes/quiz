<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Assignment Key Manager
</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:15px;
max-width:1000px;
margin:auto;
}

input,
button,
select{

width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;

}

button{

background:#facc15;
font-weight:bold;
cursor:pointer;

}

.answerRow{

display:flex;
gap:10px;
margin-top:10px;

}

.answerRow span{

width:80px;
padding-top:12px;

}

</style>

</head>

<body>

<div class="card">

<h1>
Assignment Key Manager
</h1>

<input
id="subject"
placeholder="Subject">

<input
id="title"
placeholder="Assignment Name">

<input
id="totalQuestions"
type="number"
placeholder="Number Of Questions">

<button
id="generateBtn">

Generate Answer Key

</button>

<div
id="answerContainer">

</div>

<button
id="saveBtn">

Save Assignment

</button>

<div
id="status">

</div>

</div>

<script
type="module"
src="js/assignmentkey.js">
</script>

</body>

</html>
