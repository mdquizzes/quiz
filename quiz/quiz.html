<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Smart Quiz</title>

<link rel="stylesheet" href="../css/quiz-style.css">

</head>

<body>

<div class="quiz-wrap">

<h2 id="quizTitle"></h2>

<div id="settings">

<div class="row">
<label>No. of Questions:</label>
<select id="qCount">
<option value="10">10</option>
<option value="20">20</option>
<option value="40">40</option>
<option value="80">80</option>
<option value="100">100</option>
</select>
</div>

<div class="row">
<label>Marks for Correct (+):</label>
<select id="posMarks">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option selected value="4">4</option>
</select>
</div>

<div class="row">
<label>Negative Marks (−):</label>
<select id="negMarks">
<option value="0">0</option>
<option value="0.5">0.5</option>
<option value="1">1</option>
<option selected value="2">2</option>
</select>
</div>

<div class="row">
<label>Timer:</label>
<select id="timerMode">
<option selected value="on">ON</option>
<option value="off">OFF</option>
</select>
</div>

<button class="btn" id="startBtn">Start Test</button>

</div>


<div class="hide" id="quiz">

<div class="hud">
<div id="progress"></div>
<div id="score"></div>
<div class="badge hide" id="timer"></div>
</div>

<div class="q" id="question"></div>
<div class="opts" id="options"></div>

<div style="margin-top:10px;text-align:center;">
<button class="btn" id="prevBtn">Previous</button>
<button class="btn hide" id="nextBtn">Next</button>
</div>

</div>


<div class="hide result" id="result">

<h3>Result</h3>

<p id="rName"></p>
<p id="rScore"></p>
<p id="rPercent"></p>
<p id="rAccuracy"></p>
<p id="rGrade"></p>

<p id="officialScore"></p>
<p id="saveStatus"></p>

<button class="btn" onclick="location.reload()">Restart</button>

</div>

</div>


<script>

const params = new URLSearchParams(window.location.search);
const quizName = params.get("quiz");

if(!quizName){

alert("Quiz not specified in URL");

}else{

/* AUTO TITLE GENERATE */

const title = quizName
.replace(/-/g," ")
.replace(/\b\w/g,c=>c.toUpperCase());

document.getElementById("quizTitle").innerText =
title + " – Smart Mock Test";


/* LOAD QUESTION FILE */

const script = document.createElement("script");

script.src = "../quiz-data/" + quizName + ".js";

script.onload = function(){

const engine = document.createElement("script");

engine.src = "../js/uniquiz-engine.js";

document.body.appendChild(engine);

};

document.body.appendChild(script);

}

</script>

</body>
</html>
