<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>MD QUIZ</title>

<style>

body{
font-family:Segoe UI;
background:#000814;
color:white;
text-align:center;
margin:0;
padding:20px;
}

h1{color:#ffd60a;}

.question-box{
margin:20px;
font-size:20px;
}

.option{
display:block;
margin:10px auto;
padding:10px;
width:240px;
border:none;
border-radius:6px;
cursor:pointer;
background:#1e293b;
color:white;
}

.option:hover{
background:#334155;
}

.result{
margin-top:20px;
}

.hide{
display:none;
}

</style>

</head>

<body>

<h1 id="quizTitle">MD Quiz</h1>

<div id="quizBox"></div>

<div class="hide result" id="result">

<h3>Result Analysis</h3>

<p id="rScore"></p>
<p id="rPercent"></p>
<p id="rAccuracy"></p>
<p id="rGrade"></p>

<p id="officialScore"></p>
<p id="saveStatus"></p>

<button onclick="location.reload()">Restart Quiz</button>

</div>


<script src="js/quiz-engine.js"></script>

</body>
</html>
