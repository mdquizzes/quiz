<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Battle</title>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  text-align:center;
  overflow:auto;
  cursor:crosshair;
}

/* Background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url('https://images.unsplash.com/photo-1504711434969-e33886168f5c') center/cover no-repeat;
  opacity:.35;
  z-index:-2
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle,transparent 40%,black 90%);
  z-index:-1
}

h1{margin:10px}

/* Subtitle */
.subtitle{
  font-size:14px;
  opacity:0.8;
  margin-bottom:10px;
}

.container{
  display:flex;
  justify-content:space-around
}

.team{
  width:40%;
  transition:.3s
}

.active{
  box-shadow:0 0 30px #00ffcc
}

/* Launcher */
.launcher{
  width:90px;height:25px;
  background:#222;
  margin:8px auto;
  border-radius:10px;
  position:relative
}

.barrel{
  width:70px;height:6px;
  background:#aaa;
  position:absolute;
  top:10px;left:20px;
  transform-origin:left center;
  transition:transform .2s ease
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px
}

.cell{
  background:#1a2d3a;
  padding:8px;
  border-radius:6px;
  position:relative;
  box-shadow: inset 0 0 8px #000, 0 3px 6px rgba(0,0,0,.6)
}

.cell:hover{transform:scale(1.08)}

/* Missile */
.missile{
  position:absolute;
  width:22px;height:8px;
  border-radius:4px;
  background:linear-gradient(90deg,#ffe066,#ff8c00,#ff3d00);
  box-shadow:0 0 16px rgba(255,140,0,.9);
  transform-origin:center;
}

.missile::before{
  content:"";
  position:absolute;
  right:-8px;top:-4px;
  border-left:8px solid #ff3d00;
  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
}

.missile::after{
  content:"";
  position:absolute;
  left:-10px;top:2px;
  width:10px;height:4px;
  background:linear-gradient(90deg,#ffea00,#ff6d00);
  filter:blur(1.5px);
}

/* Trail */
.trail{
  position:absolute;
  width:5px;height:5px;
  border-radius:50%;
  background:rgba(255,200,120,.85);
  filter:blur(1px);
}

/* Explosion */
.explosion{
  position:absolute;
  width:30px;height:30px;
  border-radius:50%;
  background:radial-gradient(circle,#fff176,#ff8f00,#d50000);
  box-shadow:0 0 40px rgba(255,140,0,.9);
  animation:explode .7s forwards;
}

@keyframes explode{
  0%{transform:scale(1);opacity:1}
  100%{transform:scale(6);opacity:0}
}

/* Soldier Icon */
.soldier-dot{
  width:32px;
  height:32px;
  background:url('https://cdn-icons-png.flaticon.com/512/1995/1995470.png') center/cover no-repeat;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:bold;
  color:#fff;
  margin:4px;
  text-shadow:0 0 4px #000;
}

/* Reveal */
.revealed{
  background:yellow !important;
  color:#000 !important;
  font-size:10px;
}

/* Panel */
.panel{
  display:flex;
  justify-content:space-around;
  margin:10px
}

.box{
  width:40%;
  background:#111;
  padding:10px;
  border-radius:10px
}

input{
  width:60px;
  text-align:center;
  border:none;
  border-radius:5px;
  padding:5px;
  -webkit-text-security:disc
}

/* Win */
.win{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  z-index:20
}
</style>
</head>

<body>

<h1>🎯 Classroom Battle 🎯</h1>
<div class="subtitle">Prepared By : Mukesh Sir</div>

<button onclick="startGame()">START</button>

<div class="panel">
  <div class="box">
    <h3>Group A</h3>
    <input type="text" maxlength="2" onkeydown="addNum(event,'A')">
    <div id="listA"></div>
  </div>

  <div class="box">
    <h3>Group B</h3>
    <input type="text" maxlength="2" onkeydown="addNum(event,'B')">
    <div id="listB"></div>
  </div>
</div>

<div class="container">
  <div class="team active" id="teamABox">
    <div class="launcher"><div class="barrel" id="barrelA"></div></div>
    <div id="teamA" class="grid"></div>
  </div>

  <div class="team" id="teamBBox">
    <div class="launcher"><div class="barrel" id="barrelB"></div></div>
    <div id="teamB" class="grid"></div>
  </div>
</div>

<script>
let A=new Set(), B=new Set();
let turn='A', start=false;

/* Add Number */
function addNum(e,t){
  if(e.key==='Enter'){
    const v=parseInt(e.target.value);
    if(v>=1 && v<=100){
      (t==='A'?A:B).add(v);
      addSoldier(t==='A'?'listA':'listB', v);
    }
    e.target.value='';
  }
}

/* Add Soldier Icon */
function addSoldier(id,num){
  const d=document.createElement('div');
  d.className='soldier-dot';
  d.innerText = String(num).padStart(2,'0');
  document.getElementById(id).appendChild(d);
}

/* Grid */
function createGrid(id,t){
  const g=document.getElementById(id);
  for(let i=1;i<=100;i++){
    const c=document.createElement('div');
    c.className='cell';
    c.innerText=String(i).padStart(2,'0');
    c.onclick=()=>attack(i,c,t);
    g.appendChild(c);
  }
}

/* Attack */
function attack(num,cell,target){
  if(!start) return;

  if((turn==='A'&&target==='teamB')||(turn==='B'&&target==='teamA')){
    cell.innerText='';
    cell.style.background='#333';

    let hit=false;

    if(target==='teamA' && A.has(num)){
      hit=true;
      A.delete(num);
      reveal('listA',num);
    }

    if(target==='teamB' && B.has(num)){
      hit=true;
      B.delete(num);
      reveal('listB',num);
    }

    if(hit){
      cell.style.background='#00ffcc';
    }

    if(A.size===0) win('Group B');
    if(B.size===0) win('Group A');

    turn = turn==='A'?'B':'A';
    updateTurn();
  }
}

/* Reveal */
function reveal(id,num){
  const list=document.getElementById(id);
  for(const d of list.children){
    if(!d.classList.contains('revealed')){
      d.innerText = String(num).padStart(2,'0');
      d.classList.add('revealed');
      break;
    }
  }
}

/* Turn */
function updateTurn(){
  document.getElementById('teamABox').classList.toggle('active',turn==='A');
  document.getElementById('teamBBox').classList.toggle('active',turn==='B');
}

/* Win */
function win(team){
  const d=document.createElement('div');
  d.className='win';
  d.innerHTML=`🏆 ${team} WINS!`;
  document.body.appendChild(d);
}

/* Start */
function startGame(){start=true}

/* Init */
createGrid('teamA','teamA');
createGrid('teamB','teamB');
</script>

</body>
</html>
