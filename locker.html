<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Locker Puzzle Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    .controls {
      margin: 20px;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #0056b3;
    }

    #lockers {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      max-width: 600px;
      margin: 20px auto;
    }

    .locker {
      padding: 20px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }

    .closed {
      background: #777;
    }

    .open {
      background: #28a745;
    }
  </style>
</head>
<body>

<h1>🔐 Locker Puzzle Simulation</h1>

<div class="controls">
  <button onclick="nextPerson()">Next Person</button>
  <button onclick="runAll()">Run Full Simulation</button>
  <button onclick="resetLockers()">Reset</button>
</div>

<p id="status">Current Person: 0</p>

<div id="lockers"></div>

<script>
  const totalLockers = 100;
  let lockers = new Array(totalLockers).fill(false); // false = closed
  let currentPerson = 0;

  const container = document.getElementById("lockers");

  // Create lockers
  function renderLockers() {
    container.innerHTML = "";
    lockers.forEach((state, index) => {
      const div = document.createElement("div");
      div.className = "locker " + (state ? "open" : "closed");
      div.innerText = index + 1;
      container.appendChild(div);
    });
  }

  // Toggle logic
  function toggleLockers(person) {
    for (let i = person; i <= totalLockers; i += person) {
      lockers[i - 1] = !lockers[i - 1];
    }
  }

  function nextPerson() {
    if (currentPerson >= 100) return;
    currentPerson++;
    toggleLockers(currentPerson);
    document.getElementById("status").innerText =
      "Current Person: " + currentPerson;
    renderLockers();
  }

  function runAll() {
    resetLockers();
    for (let i = 1; i <= 100; i++) {
      toggleLockers(i);
    }
    currentPerson = 100;
    document.getElementById("status").innerText =
      "Completed All 100 People";
    renderLockers();
  }

  function resetLockers() {
    lockers = new Array(totalLockers).fill(false);
    currentPerson = 0;
    document.getElementById("status").innerText =
      "Current Person: 0";
    renderLockers();
  }

  // Initial render
  renderLockers();
</script>

</body>
</html>
