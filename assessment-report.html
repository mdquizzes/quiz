<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Assessment Report
</title>

<style>

body{

background:#0f172a;

color:white;

font-family:
Segoe UI,
Arial,
sans-serif;

padding:20px;

}

h1{

color:#facc15;

}

.card{

background:#1e293b;

padding:20px;

border-radius:15px;

margin-bottom:20px;

}

.studentRow{

padding:12px;

background:#334155;

margin-bottom:10px;

border-radius:10px;

cursor:pointer;

}

.studentRow:hover{

background:#475569;

}

.analysis{

display:flex;

flex-wrap:wrap;

gap:8px;

margin-top:15px;

}

.qbox{

width:42px;

height:42px;

display:flex;

justify-content:center;

align-items:center;

border-radius:8px;

font-size:13px;

font-weight:bold;

}

.correct{

background:#16a34a;

}

.wrong{

background:#dc2626;

}

.notAttempted{

background:#cbd5e1;

color:black;

}

</style>

</head>

<body>

<h1>
📊 Assessment Report
</h1>

<div id="assessmentInfo">
Loading...
</div>

<div id="leaderboard">
</div>

<div id="studentDetails">
</div>

<script
type="module"
src="js/assessment-report.js">
</script>

</body>
</html>
