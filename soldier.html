<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate War Classroom Game</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;color:#fff;text-align:center;background:#000;overflow:hidden}

/* WAR BACKGROUND */
body::before{
content:"";
position:fixed;
top:0;left:0;width:100%;height:100%;
background:url('https://images.unsplash.com/photo-1504711434969-e33886168f5c') center/cover no-repeat;
opacity:0.15;
z-index:-1;
}

h1{margin:10px}
.container{display:flex;justify-content:space-around;padding:10px}
.team{width:45%;position:relative}

/* TANK */
.tank{
font-size:40px;
margin-bottom:5px;
}

.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{
background:#1a2d3a;
padding:12px 0;
border-radius:6px;
cursor:pointer;
font-weight:bold;
position:relative;
overflow:hidden;
}

/* SMOKE AFTER HIT */
.smoke::after{
content:"";
position:absolute;
top:0;left:0;width:100%;height:100%;
background:radial-gradient(circle,rgba(255,255,255,0.3),transparent);
animation:smoke 1s forwards;
}

@keyframes smoke{
0%{opacity:1}
100%{opacity:0}
}

.hit{background:#00ffcc;color:#000}

/* MISSILE */
.missile{
position:absolute;width:12px;height:12px;background:yellow;border-radius:50%;
animation:fly 0.6s linear forwards;z-index:10;
}
@keyframes fly{
0%{transform:translate(var(--sx),var(--sy));}
100%{transform:translate(var(--tx),var(--ty));}
}

/* EXPLOSION */
.explosion{
position:absolute;width:20px;height:20px;border-radius:50%;
background:orange;animation:explode .5s ease-out forwards;z-index:9;
}
@keyframes explode{
0%{transform:scale(1);opacity:1}
100%{transform:scale(4);opacity:0}
}

.panel{display:flex;justify-content:space-around}
.box{background:#111;padding:10px;border-radius:10px;width:40%}
input{width:60px;text-align:center;padding:5px;border:none;border-radius:5px}
.star{color:#0f0;margin:2px}
.revealed{color:yellow}

button{margin:5px;padding:8px 16px;border:none;border-radius:8px;background:#00c6ff;font-weight:bold}

/* WIN CELEBRATION */
.celebration{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.8);
display:flex;justify-content:center;align-items:center;
font-size:40px;color:#00ffcc;z-index:20;
animation:fadeIn 1s;
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

</style>
</head>
<body>

<h1>⚔️ WAR CLASSROOM GAME ⚔️</h1>
<button onclick="startGame()">Start</button>
<button onclick="resetGame()">Reset</button>

<div class="panel">
<div class="box">
<h3>Group A</h3>
<input type="password" autocomplete="new-password" onkeydown="handleInput(event,'A')">
<div id="listA"></div>
</div>
<div class="box">
<h3>Group B</h3>
<input type="password" autocomplete="new-password" onkeydown="handleInput(event,'B')">
<div id="listB"></div>
</div>
</div>

<div class="container">
<div class="team" id="teamABox">
<div class="tank">🛡️🚀</div>
<div id="teamA" class="grid"></div>
</div>

<div class="team" id="teamBBox">
<div class="tank">🚀🛡️</div>
<div id="teamB" class="grid"></div>
</div>
</div>

<script>
let soldiersA=new Set();
let soldiersB=new Set();
let turn='A';
let gameStarted=false;

function format(n){return n.toString().padStart(2,'0');}

function handleInput(e,t){
if(e.key==='Enter'){
let v=parseInt(e.target.value);
if(v>=1&&v<=100){
(t==='A'?soldiersA:soldiersB).add(v);
addStar(t==='A'?'listA':'listB');
}
e.target.value='';
}}

function addStar(id){
let s=document.createElement('span');s.className='star';s.innerText='★ ★';
document.getElementById(id).appendChild(s);
}

function createGrid(id,t){
let g=document.getElementById(id);
for(let i=1;i<=100;i++){
let c=document.createElement('div');
c.className='cell';c.innerText=format(i);
c.onclick=()=>attack(i,c,t);
g.appendChild(c);
}}

function attack(num,cell,target){
if(!gameStarted||cell.classList.contains('smoke'))return;

if((turn==='A'&&target==='teamB')||(turn==='B'&&target==='teamA')){
launchMissile(cell,()=>{
cell.innerText='';
cell.classList.add('smoke');

let hit=false;
if(target==='teamA'&&soldiersA.has(num)){hit=true; soldiersA.delete(num); reveal('listA',num);}
if(target==='teamB'&&soldiersB.has(num)){hit=true; soldiersB.delete(num); reveal('listB',num);}

if(hit){cell.classList.add('hit');}

if(soldiersA.size===0)win('Group B');
if(soldiersB.size===0)win('Group A');

turn=turn==='A'?'B':'A';
});
}
}

function launchMissile(cell,cb){
let m=document.createElement('div');m.className='missile';
let rect=cell.getBoundingClientRect();
let sx=turn==='A'?0:window.innerWidth;
let sy=100;
m.style.setProperty('--sx',sx+'px');
m.style.setProperty('--sy',sy+'px');
m.style.setProperty('--tx',rect.left+'px');
m.style.setProperty('--ty',rect.top+'px');
document.body.appendChild(m);

setTimeout(()=>{
m.remove();
createExplosion(rect.left,rect.top);
cb();
},600);
}

function createExplosion(x,y){
let e=document.createElement('div');
e.className='explosion';
e.style.left=x+'px';
e.style.top=y+'px';
document.body.appendChild(e);
setTimeout(()=>e.remove(),500);
}

function reveal(id,num){
let list=document.getElementById(id);
for(let s of list.children){
if(s.innerText==='★ ★'){
s.innerText=format(num);
s.classList.add('revealed');
break;
}}}

function win(team){
let div=document.createElement('div');
div.className='celebration';
div.innerText='🏆 '+team+' WINS!';
document.body.appendChild(div);
}

function startGame(){gameStarted=true}

function resetGame(){location.reload()}

createGrid('teamA','teamA');
createGrid('teamB','teamB');
</script>

</body>
</html>
