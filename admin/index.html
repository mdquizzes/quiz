<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{font-family:Arial;background:#001d3d;color:white;padding:20px}
input,select,textarea{width:100%;margin:5px 0;padding:8px}
button{padding:10px;background:#ffd60a;border:none;margin-top:10px}
.box{background:#003566;padding:15px;border-radius:10px;margin-bottom:15px}
</style>

</head>

<body>

<h2>🛠 MD Quizzes Admin</h2>

<div class="box">

<label>Section</label>
<select id="section">
<option value="A">Section A</option>
<option value="B">Section B</option>
<option value="C">Section C</option>
<option value="D">Section D</option>
</select>

<label>Chapter</label>
<input id="chapter">

<label>Question</label>
<textarea id="question"></textarea>

<label>Option 1</label>
<input id="o1">

<label>Option 2</label>
<input id="o2">

<label>Option 3</label>
<input id="o3">

<label>Option 4</label>
<input id="o4">

<label>Correct (1-4)</label>
<input id="correct">

<button onclick="addQuestion()">➕ Add</button>

</div>

<div class="box">

<button onclick="saveGitHub()">🚀 Save to GitHub</button>

<textarea id="output" rows="10"></textarea>

</div>

<script src="app.js"></script>

</body>
</html>
