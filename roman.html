<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Number Bubble Match Challenge</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
overflow:hidden;
height:100vh;
color:#fff;
}

#setup{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.6);
z-index:1000;
}

.setup-box{
background:#fff;
color:#222;
padding:25px;
border-radius:15px;
width:320px;
text-align:center;
}

.setup-box h2{
margin-bottom:15px;
}

.setup-box input,
.setup-box select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

.setup-box button{
padding:12px 20px;
font-size:18px;
border:none;
background:#1e88e5;
color:white;
cursor:pointer;
border-radius:10px;
width:100%;
}

#hud{
position:absolute;
top:10px;
left:10px;
right:10px;
display:flex;
justify-content:space-between;
font-size:20px;
font-weight:bold;
z-index:999;
}

#gameArea{
position:absolute;
inset:0;
overflow:hidden;
}

.bubble{
position:absolute;
width:80px;
height:80px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:22px;
cursor:pointer;
user-select:none;
box-shadow:0 0 15px rgba(255,255,255,.4);
transition:transform .2s;
}

.bubble:hover{
transform:scale(1.08);
}

.roman{
background:#ff9800;
}

.number{
background:#4caf50;
}

.selected{
outline:5px solid yellow;
}

.burst{
animation:burst .4s forwards;
}

@keyframes burst{
0%{
transform:scale(1);
opacity:1;
}
100%{
transform:scale(2);
opacity:0;
}
}

#gameOver{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.75);
z-index:1000;
}

.over-box{
background:white;
color:black;
padding:25px;
border-radius:15px;
text-align:center;
width:340px;
}

.over-box h2{
margin-bottom:15px;
}

.over-box button{
margin-top:15px;
padding:10px 20px;
font-size:18px;
cursor:pointer;
}

@media(max-width:700px){
.bubble{
width:65px;
height:65px;
font-size:18px;
}
}
</style>
</head>

<body>

<div id="setup">
<div class="setup-box">
<h2>Roman Bubble Challenge</h2>

<input id="playerName" placeholder="Enter your name">

<select id="timeSelect">
<option value="30">30 Seconds</option>
<option value="60" selected>60 Seconds</option>
<option value="120">120 Seconds</option>
</select>

<button onclick="startGame()">Start Game</button>
</div>
</div>

<div id="hud">
<div id="playerInfo"></div>
<div>Score: <span id="score">0</span></div>
<div>Time: <span id="time">60</span></div>
<div>High: <span id="highScore">0</span></div>
</div>

<div id="gameArea"></div>

<div id="gameOver">
<div class="over-box">
<h2>Game Over</h2>
<p id="finalScore"></p>
<p id="bestScore"></p>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<script>

const gameArea=document.getElementById("gameArea");

let score=0;
let selected=null;
let timer;
let gameTime=60;
let spawnInterval;
let activePairs={};

const highScoreKey="romanBubbleHighScore";

document.getElementById("highScore").textContent=
localStorage.getItem(highScoreKey)||0;

function toRoman(num){

const values=[
[100,'C'],
[90,'XC'],
[50,'L'],
[40,'XL'],
[10,'X'],
[9,'IX'],
[5,'V'],
[4,'IV'],
[1,'I']
];

let result='';

for(let [v,r] of values){
while(num>=v){
result+=r;
num-=v;
}
}

return result;
}

function startGame(){

const name=document.getElementById("playerName").value.trim();

if(!name){
alert("Enter player name");
return;
}

gameTime=parseInt(document.getElementById("timeSelect").value);

document.getElementById("playerInfo").textContent=name;

document.getElementById("setup").style.display="none";

document.getElementById("time").textContent=gameTime;

timer=setInterval(()=>{
gameTime--;
document.getElementById("time").textContent=gameTime;

if(gameTime<=0){
endGame();
}
},1000);

spawnInterval=setInterval(spawnPair,1200);
}

function spawnPair(){

const num=Math.floor(Math.random()*100)+1;
const roman=toRoman(num);

const pairId="p"+Date.now()+Math.random();

createBubble(roman,"roman",pairId);
createBubble(num,"number",pairId);
}

function createBubble(text,type,pairId){

const bubble=document.createElement("div");

bubble.className=`bubble ${type}`;

bubble.textContent=text;

bubble.dataset.pair=pairId;

bubble.dataset.type=type;

bubble.style.left=
Math.random()*(window.innerWidth-100)+"px";

bubble.style.top="-100px";

gameArea.appendChild(bubble);

let y=-100;

const speed=1+Math.random()*2;

const move=setInterval(()=>{

y+=speed;

bubble.style.top=y+"px";

if(y>window.innerHeight){

clearInterval(move);

bubble.remove();
}

},16);

bubble.addEventListener("click",()=>selectBubble(bubble));
}

function selectBubble(b){

if(selected===null){

selected=b;

b.classList.add("selected");

return;
}

if(selected===b)return;

if(
selected.dataset.pair===b.dataset.pair &&
selected.dataset.type!==b.dataset.type
){

burst(selected);
burst(b);

score+=10;

}
else{

score=Math.max(0,score-2);

selected.classList.remove("selected");
}

selected=null;

document.getElementById("score").textContent=score;
}

function burst(el){

el.classList.add("burst");

setTimeout(()=>{
el.remove();
},400);
}

function endGame(){

clearInterval(timer);
clearInterval(spawnInterval);

document.querySelectorAll(".bubble")
.forEach(b=>b.remove());

let high=
parseInt(localStorage.getItem(highScoreKey)||0);

if(score>high){

high=score;

localStorage.setItem(highScoreKey,score);
}

document.getElementById("finalScore").innerHTML=
`Your Score: <b>${score}</b>`;

document.getElementById("bestScore").innerHTML=
`Highest Score: <b>${high}</b>`;

document.getElementById("gameOver").style.display="flex";
}

</script>

</body>
</html>
