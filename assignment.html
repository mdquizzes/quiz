<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
MUKESH SIR 
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Segoe UI,
Arial,
sans-serif;
}

body{
background:
linear-gradient(
135deg,
#020617,
#0f172a,
#020617
);
color:white;
min-height:100vh;
}

header{
background:#082f49;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:700;
color:#facc15;
}

.container{
max-width:1500px;
margin:auto;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:
0 0 20px rgba(0,0,0,.35);
}

h2{
color:#facc15;
margin-bottom:15px;
}

input,
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
}

button{
background:#facc15;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#fde047;
}

#assessmentInfo{
line-height:1.8;
font-size:18px;
}

.omrGrid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(220px,1fr));
gap:12px;
}

.qBox{
background:#1e293b;
padding:10px;
border-radius:10px;
}

.qTitle{
font-weight:bold;
margin-bottom:8px;
}

.options{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.option{
padding:8px 12px;
background:#334155;
border-radius:8px;
cursor:pointer;
}

.option.selected{
background:#22c55e;
}

.option.locked{
background:#64748b;
cursor:not-allowed;
}

#leaderboard{
position:fixed;
right:10px;
top:80px;
width:300px;
background:#111827;
padding:15px;
border-radius:12px;
max-height:85vh;
overflow:auto;
}

.leaderRow{
padding:8px;
margin-bottom:8px;
background:#1e293b;
border-radius:8px;
}

#statusBox{
margin-top:15px;
font-size:18px;
font-weight:bold;
color:#facc15;
}

@media(max-width:1000px){

#leaderboard{
position:static;
width:100%;
margin-top:20px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
MD Assessment V2
</div>

<div>
Live Classroom Mode
</div>

</header>

<div class="container">

<div class="card">

<h2>
Assessment Information
</h2>

<div id="assessmentInfo">

Loading Assessment...

</div>

</div>

<div class="card">

<h2>
Student Login
</h2>

<input
id="studentName"
placeholder="Enter Name (Rahul P.)">

<button
id="loadStudentBtn">

Load My Sheet

</button>

</div>

<div class="card">

<h2>
Answer Sheet
</h2>

<div id="questionContainer">

Load Student First

</div>

<br>

<button
id="saveBtn">

Save Progress

</button>

<button
id="nextBtn">

Load Next 20 Questions

</button>

<div id="statusBox">

</div>

</div>

</div>

<div id="leaderboard">

<h2>
🏆 Live Ranking
</h2>

<div id="leaderboardBody">

Loading...

</div>

</div>

<script
type="module"
src="js/assignment.js">
</script>

</body>
</html>
