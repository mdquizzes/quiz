<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
MD Assignment System
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Segoe UI,
Arial,
sans-serif;
}

body{

background:
linear-gradient(
135deg,
#020617,
#0f172a,
#020617
);

color:white;

min-height:100vh;

}

header{

background:#082f49;

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

}

.logo{

font-size:28px;

font-weight:700;

color:#facc15;

}

.container{

max-width:1400px;

margin:auto;

padding:20px;

}

.card{

background:#111827;

padding:20px;

border-radius:16px;

margin-bottom:20px;

box-shadow:
0 0 20px
rgba(0,0,0,.35);

}

h2{

color:#facc15;

margin-bottom:15px;

}

input,
select,
button{

width:100%;

padding:12px;

border:none;

border-radius:10px;

margin-top:10px;

}

button{

background:#facc15;

font-weight:bold;

cursor:pointer;

}

button:hover{

background:#fde047;

}

.hide{
display:none;
}

#assessmentInfo{

font-size:18px;

line-height:1.8;

margin-bottom:20px;

}

.omrGrid{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(240px,1fr));

gap:15px;

}

.qbox{

background:#1e293b;

padding:12px;

border-radius:10px;

}

.qtitle{

font-weight:bold;

margin-bottom:8px;

}

.options{

display:flex;

gap:10px;

flex-wrap:wrap;

}

.option{

padding:8px 12px;

border-radius:8px;

background:#334155;

cursor:pointer;

}

.option.selected{

background:#22c55e;

}

#leaderboard{

position:fixed;

right:10px;

top:80px;

width:280px;

background:#111827;

padding:15px;

border-radius:12px;

max-height:80vh;

overflow:auto;

}

.leaderRow{

padding:10px;

background:#1e293b;

margin-bottom:8px;

border-radius:8px;

}

#teacherPanel{

background:#7c2d12;

}

.rangeRow{

display:grid;

grid-template-columns:
1fr 1fr;

gap:10px;

}

#rangeResult{

margin-top:20px;

}

.resultTable{

width:100%;

border-collapse:collapse;

}

.resultTable th,
.resultTable td{

border:1px solid #334155;

padding:8px;

text-align:center;

}

.resultTable th{

background:#1e293b;

}

#studentResult{

margin-top:20px;

font-size:20px;

font-weight:bold;

color:#facc15;

}

@media(max-width:900px){

#leaderboard{

position:static;

width:100%;

margin-top:20px;

}

}

</style>

</head>

<body>

<header>

<div class="logo">
MD ASSIGNMENT
</div>

<div>
Classroom Mode
</div>

</header>

<div class="container">

<!-- Assessment Info -->

<div class="card">

<h2>
Assessment Information
</h2>

<div id="assessmentInfo">

Loading assessment...

</div>

</div>

<!-- Student Panel -->

<div class="card">

<h2>
Student Submission
</h2>

<input
id="studentName"
placeholder="Enter Student Name">

<div id="omrSheet">
</div>

<button
id="submitBtn">

Submit Answers

</button>

<div id="studentResult">
</div>

</div>

<!-- Teacher Result Panel -->

<div
class="card"
id="teacherPanel">

<h2>
Teacher Result Control
</h2>

<div class="rangeRow">

<input
id="fromQuestion"
type="number"
placeholder="From Question">

<input
id="toQuestion"
type="number"
placeholder="To Question">

</div>

<button
id="showResultBtn">

Show Range Result

</button>

<div id="rangeResult">
</div>

</div>

</div>

<div id="leaderboard">

<h2>
🏆 Live Leaderboard
</h2>

<div id="leaderboardBody">

Loading...

</div>

</div>

<script
type="module"
src="js/assignment.js">
</script>

</body>
</html>
