<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
MD Assessment System
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Segoe UI,
Arial,
sans-serif;
}

body{
background:
linear-gradient(
135deg,
#020617,
#0f172a,
#020617
);
color:white;
min-height:100vh;
}

header{
background:#082f49;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:700;
color:#facc15;
}

.container{
max-width:1400px;
margin:auto;
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:
0 0 20px rgba(0,0,0,.3);
}

h2{
color:#facc15;
margin-bottom:15px;
}

input,
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
}

button{
background:#facc15;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#fde047;
}

.hide{
display:none;
}

#leaderboard{
position:fixed;
top:80px;
right:10px;
width:280px;
background:#111827;
padding:15px;
border-radius:12px;
max-height:80vh;
overflow:auto;
}

.leader-row{
padding:10px;
margin-bottom:8px;
background:#1e293b;
border-radius:8px;
}

#assessmentInfo{
font-size:18px;
margin-bottom:20px;
}

.omr-grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.qbox{
background:#1e293b;
padding:12px;
border-radius:10px;
}

.qtitle{
margin-bottom:8px;
font-weight:bold;
}

.options{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.option{
padding:8px 12px;
background:#334155;
border-radius:8px;
cursor:pointer;
}

.option.selected{
background:#22c55e;
}

#studentResult{
font-size:22px;
font-weight:bold;
margin-top:20px;
color:#facc15;
}

/* Teacher Key Builder */

#answerKeyBuilder{
margin-top:20px;
max-height:500px;
overflow:auto;
padding:10px;
background:#0f172a;
border-radius:12px;
}

.keyRow{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
margin-bottom:8px;
background:#1e293b;
border-radius:10px;
}

.keyOptions{
display:flex;
gap:8px;
}

.keyBtn{
width:42px;
height:42px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
background:#334155;
cursor:pointer;
font-weight:bold;
}

.keyBtn.active{
background:#22c55e;
}

@media(max-width:900px){

#leaderboard{
position:static;
width:100%;
margin-top:20px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
MD ASSESSMENT
</div>

<div id="modeText">
Student Mode
</div>

</header>

<div class="container">

<!-- TEACHER PANEL -->

<div
id="adminPanel"
class="card hide">

<h2>
Teacher Assessment Setup
</h2>

<input
id="subjectName"
placeholder="Subject Name">

<input
id="assessmentTitle"
placeholder="Assessment Title">

<input
id="questionCount"
type="number"
max="200"
placeholder="Total Questions">

<button
id="generateQuestionsBtn">

Generate Answer Key Sheet

</button>

<div id="answerKeyBuilder">
</div>

<button
id="createAssessmentBtn">

Create Assessment

</button>

</div>

<!-- STUDENT PANEL -->

<div
id="studentPanel"
class="card">

<h2>
Student Assessment
</h2>

<div id="assessmentInfo">
Loading assessment...
</div>

<input
id="studentName"
placeholder="Enter Student Name">

<div id="omrSheet">
</div>

<button
id="submitAssessmentBtn">

Submit Assessment

</button>

<div id="studentResult">
</div>

</div>

</div>

<div id="leaderboard">

<h2>
🏆 Live Leaderboard
</h2>

<div id="leaderboardBody">

Loading...

</div>

</div>

<script
type="module"
src="js/assessment.js">
</script>

</body>
</html>
