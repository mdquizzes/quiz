<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quadratic Equation Practice Generator</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
padding:20px;
color:#222;
}

.wrapper{
max-width:760px;
margin:auto;
background:#fff;
padding:25px;
border-radius:14px;
box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
text-align:center;
font-size:30px;
margin-bottom:10px;
}

.sub{
text-align:center;
color:#666;
margin-bottom:25px;
}

.levels{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.level-btn{
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:#fff;
}

.easy{background:#16a34a}
.medium{background:#f59e0b}
.hard{background:#dc2626}

.active{
transform:scale(1.03);
box-shadow:0 5px 18px rgba(0,0,0,.15);
}

.card{
background:#f8fafc;
border-radius:12px;
padding:25px;
text-align:center;
}

.label{
font-size:15px;
color:#666;
margin-bottom:10px;
}

.question{
font-size:34px;
font-weight:bold;
margin:15px 0 25px;
word-break:break-word;
}

.btns{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
}

button.action{
padding:12px 18px;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.show{background:#2563eb;color:#fff}
.next{background:#111827;color:#fff}

.answer{
display:none;
margin-top:22px;
padding:18px;
background:#ecfdf5;
border:1px solid #10b981;
border-radius:10px;
font-size:24px;
font-weight:bold;
color:#065f46;
}

.stats{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:18px;
font-size:15px;
flex-wrap:wrap;
}

.footer{
margin-top:20px;
font-size:14px;
color:#777;
text-align:center;
}

@media(max-width:600px){
.levels{grid-template-columns:1fr}
.question{font-size:28px}
.stats{flex-direction:column}
}
</style>
</head>

<body>

<div class="wrapper">

<h1>Quadratic Equation Practice</h1>
<div class="sub">Unlimited Random Questions • Easy / Medium / Hard</div>

<div class="levels">
<button class="level-btn easy active" onclick="setLevel('easy',this)">Easy</button>
<button class="level-btn medium" onclick="setLevel('medium',this)">Medium</button>
<button class="level-btn hard" onclick="setLevel('hard',this)">Hard</button>
</div>

<div class="card">

<div class="label">Solve:</div>
<div class="question" id="question">Loading...</div>

<div class="btns">
<button class="action show" onclick="showAnswer()">Show Answer</button>
<button class="action next" onclick="generateQuestion()">Next Question</button>
</div>

<div class="answer" id="answer"></div>

<div class="stats">
<div>Level: <b id="levelName">Easy</b></div>
<div>Questions Seen: <b id="count">0</b></div>
</div>

</div>

<div class="footer">
Hard level now contains only real advanced 3-term quadratic equations.
</div>

</div>

<script>
let currentLevel="easy";
let currentAnswer="";
let count=0;

function rand(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function setLevel(level,btn){
currentLevel=level;

document.querySelectorAll(".level-btn").forEach(b=>{
b.classList.remove("active");
});

btn.classList.add("active");

document.getElementById("levelName").innerText =
level.charAt(0).toUpperCase()+level.slice(1);

generateQuestion();
}

function showAnswer(){
let box=document.getElementById("answer");
box.style.display="block";
box.innerHTML=currentAnswer;
}

function generateQuestion(){
count++;
document.getElementById("count").innerText=count;
document.getElementById("answer").style.display="none";

if(currentLevel==="easy") easyQuestion();
if(currentLevel==="medium") mediumQuestion();
if(currentLevel==="hard") hardQuestion();
}

/* EASY : roots 1 to 10 */
function easyQuestion(){

let r1=rand(1,10);
let r2=rand(1,10);

let b=-(r1+r2);
let c=r1*r2;

document.getElementById("question").innerHTML =
"x² - "+Math.abs(b)+"x + "+c+" = 0";

currentAnswer="x = "+r1+", "+r2;
}

/* MEDIUM : roots 11 to 20 */
function mediumQuestion(){

let r1=rand(11,20);
let r2=rand(11,20);

let b=-(r1+r2);
let c=r1*r2;

document.getElementById("question").innerHTML =
"x² - "+Math.abs(b)+"x + "+c+" = 0";

currentAnswer="x = "+r1+", "+r2;
}

/* HARD : ONLY ADVANCED 3-TERM */
function hardQuestion(){

let type=rand(1,4);

/* TYPE 1 : coefficient + large roots */
if(type===1){

let a=rand(2,6);
let r1=rand(8,18);
let r2=rand(9,20);

let b=-a*(r1+r2);
let c=a*r1*r2;

document.getElementById("question").innerHTML =
a+"x² - "+Math.abs(b)+"x + "+c+" = 0";

currentAnswer="x = "+r1+", "+r2;
}

/* TYPE 2 : mixed sign roots */
if(type===2){

let r1=rand(8,18);
let r2=-rand(5,15);

let b=-(r1+r2);
let c=r1*r2;

let signB = b>=0 ? "- "+b+"x" : "+ "+Math.abs(b)+"x";
let signC = c>=0 ? "+ "+c : "- "+Math.abs(c);

document.getElementById("question").innerHTML =
"x² "+signB+" "+signC+" = 0";

currentAnswer="x = "+r1+", "+r2;
}

/* TYPE 3 : perfect square hard */
if(type===3){

let a=rand(12,30);

document.getElementById("question").innerHTML =
"x² + "+(2*a)+"x + "+(a*a)+" = 0";

currentAnswer="x = -"+a+" (double root)";
}

/* TYPE 4 : bigger coefficient + distinct roots */
if(type===4){

let a=rand(3,8);
let r1=rand(6,16);
let r2=rand(7,17);

while(r1===r2){
r2=rand(7,17);
}

let b=-a*(r1+r2);
let c=a*r1*r2;

document.getElementById("question").innerHTML =
a+"x² - "+Math.abs(b)+"x + "+c+" = 0";

currentAnswer="x = "+r1+", "+r2;
}

}

generateQuestion();
</script>

</body>
</html>
