<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Traffic Control Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#07131f;
    font-family:Arial;
}

canvas{
    display:block;
    background:
    radial-gradient(circle at center,#0e2a45 0%,#07131f 70%);
}

#ui{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    z-index:10;
    font-size:24px;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    display:none;
    z-index:20;
}

#gameOver h1{
    font-size:70px;
    margin-bottom:20px;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:10px;
    font-size:24px;
    cursor:pointer;
}

</style>
</head>
<body>

<div id="ui">
    Score: <span id="score">0</span>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <button onclick="location.reload()">Restart</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const scoreEl = document.getElementById("score");
const gameOverEl = document.getElementById("gameOver");

let score = 0;
let running = true;

const runway = {
    x: canvas.width/2 - 70,
    y: canvas.height/2 - 170,
    width:140,
    height:340
};

const runwayEntry = {
    x: canvas.width/2,
    y: runway.y - 160
};

const parkingArea = {
    x: runway.x + 220,
    y: runway.y + 40
};

const parkingSlots = [];

for(let i=0;i<6;i++){

    parkingSlots.push({
        x: parkingArea.x,
        y: parkingArea.y + i*42,
        used:false
    });
}

class Plane{

    constructor(){

        this.size = 12;

        this.speed = 0.7 + Math.random()*0.4;

        this.path = [];
        this.pathIndex = 0;

        this.angle = 0;

        this.landing = false;
        this.landed = false;
        this.parked = false;

        const side = Math.floor(Math.random()*4);

        if(side===0){
            this.x = Math.random()*canvas.width;
            this.y = -50;
        }
        else if(side===1){
            this.x = canvas.width + 50;
            this.y = Math.random()*canvas.height;
        }
        else if(side===2){
            this.x = Math.random()*canvas.width;
            this.y = canvas.height + 50;
        }
        else{
            this.x = -50;
            this.y = Math.random()*canvas.height;
        }

        this.color = `hsl(${Math.random()*360},80%,60%)`;

        this.path.push({
            x: runwayEntry.x,
            y: runwayEntry.y
        });
    }

    update(){

        if(this.path.length > 0){

            const target = this.path[this.pathIndex];

            if(target){

                const dx = target.x - this.x;
                const dy = target.y - this.y;

                const dist = Math.sqrt(dx*dx + dy*dy);

                this.angle = Math.atan2(dy,dx);

                if(dist < 6){

                    this.pathIndex++;

                    if(this.pathIndex >= this.path.length){

                        if(!this.landing && !this.landed){

                            this.landing = true;

                            this.path = [
                                {
                                    x: canvas.width/2,
                                    y: runway.y + runway.height + 30
                                }
                            ];

                            this.pathIndex = 0;
                        }

                        else if(this.landing && !this.landed){

                            this.landed = true;

                            this.angle = Math.PI/2;

                            score++;
                            scoreEl.innerText = score;

                            const slot = parkingSlots.find(s => !s.used);

                            if(slot){

                                slot.used = true;

                                this.path = [
                                    {
                                        x: runway.x + runway.width + 40,
                                        y: runway.y + runway.height + 20
                                    },

                                    {
                                        x: slot.x,
                                        y: slot.y
                                    }
                                ];

                                this.pathIndex = 0;
                            }
                        }

                        else if(this.landed){

                            this.parked = true;
                        }
                    }
                }
                else{

                    const drift =
                    Math.sin(Date.now()*0.001 + this.x)*0.15;

                    this.x +=
                    Math.cos(this.angle)*this.speed + drift;

                    this.y +=
                    Math.sin(this.angle)*this.speed + drift;
                }
            }
        }
    }

    draw(){

        if(this.path.length > 0 && !this.parked){

            ctx.beginPath();
            ctx.moveTo(this.x,this.y);

            for(let p of this.path){
                ctx.lineTo(p.x,p.y);
            }

            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;

            ctx.setLineDash([8,8]);

            ctx.stroke();

            ctx.setLineDash([]);
        }

        ctx.save();

        ctx.translate(this.x,this.y);

        ctx.rotate(this.angle);

        ctx.fillStyle = this.color;

        // BODY
        ctx.beginPath();

        ctx.moveTo(20,0);
        ctx.lineTo(-16,-6);
        ctx.lineTo(-22,0);
        ctx.lineTo(-16,6);

        ctx.closePath();

        ctx.fill();

        // LEFT WING
        ctx.beginPath();

        ctx.moveTo(-2,0);
        ctx.lineTo(-13,-18);
        ctx.lineTo(-6,-18);
        ctx.lineTo(6,0);

        ctx.closePath();

        ctx.fill();

        // RIGHT WING
        ctx.beginPath();

        ctx.moveTo(-2,0);
        ctx.lineTo(-13,18);
        ctx.lineTo(-6,18);
        ctx.lineTo(6,0);

        ctx.closePath();

        ctx.fill();

        // TAIL
        ctx.beginPath();

        ctx.moveTo(-16,0);
        ctx.lineTo(-23,-11);
        ctx.lineTo(-18,-11);
        ctx.lineTo(-11,0);

        ctx.closePath();

        ctx.fill();

        ctx.restore();
    }
}

const planes = [];

function spawnPlane(){

    if(running){

        planes.push(new Plane());
    }
}

setInterval(spawnPlane,2600);

function drawAirport(){

    // RUNWAY

    ctx.fillStyle = "#555";

    ctx.fillRect(
        runway.x,
        runway.y,
        runway.width,
        runway.height
    );

    // RUNWAY CENTER LINE

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    for(let i=0;i<12;i++){

        ctx.beginPath();

        ctx.moveTo(
            canvas.width/2,
            runway.y + i*30
        );

        ctx.lineTo(
            canvas.width/2,
            runway.y + i*30 + 16
        );

        ctx.stroke();
    }

    // PARKING AREA

    ctx.fillStyle = "#1d8742";

    ctx.fillRect(
        parkingArea.x - 30,
        parkingArea.y - 25,
        150,
        270
    );

    ctx.fillStyle = "white";

    ctx.font = "20px Arial";

    ctx.fillText(
        "PARKING",
        parkingArea.x - 10,
        parkingArea.y - 40
    );

    // SLOT LINES

    ctx.strokeStyle = "white";

    parkingSlots.forEach(slot=>{

        ctx.strokeRect(
            slot.x - 18,
            slot.y - 10,
            36,
            20
        );
    });
}

function detectCollision(){

    for(let i=0;i<planes.length;i++){

        for(let j=i+1;j<planes.length;j++){

            const a = planes[i];
            const b = planes[j];

            if(a.parked || b.parked) continue;

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const dist =
            Math.sqrt(dx*dx + dy*dy);

            if(dist < 28){

                running = false;

                gameOverEl.style.display = "block";
            }
        }
    }
}

let drawing = false;
let selectedPlane = null;

function getPos(e){

    const rect = canvas.getBoundingClientRect();

    return {

        x:(e.clientX || e.touches[0].clientX) - rect.left,

        y:(e.clientY || e.touches[0].clientY) - rect.top
    };
}

canvas.addEventListener("mousedown",startDraw);
canvas.addEventListener("touchstart",startDraw);

function startDraw(e){

    const pos = getPos(e);

    for(let plane of planes){

        if(plane.landed || plane.parked) continue;

        const dx = pos.x - plane.x;
        const dy = pos.y - plane.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 30){

            drawing = true;

            selectedPlane = plane;

            plane.path = [];

            plane.pathIndex = 0;

            break;
        }
    }
}

canvas.addEventListener("mousemove",drawPath);
canvas.addEventListener("touchmove",drawPath);

function drawPath(e){

    if(!drawing || !selectedPlane) return;

    const pos = getPos(e);

    selectedPlane.path.push({
        x:pos.x,
        y:pos.y
    });
}

canvas.addEventListener("mouseup",endDraw);
canvas.addEventListener("touchend",endDraw);

function endDraw(){

    if(selectedPlane){

        selectedPlane.path.push({
            x: runwayEntry.x,
            y: runwayEntry.y
        });
    }

    drawing = false;

    selectedPlane = null;
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawAirport();

    planes.forEach(plane=>{

        plane.update();

        plane.draw();
    });

    detectCollision();

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>
</body>
</html>
