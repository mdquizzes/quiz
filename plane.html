<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Air Traffic Control</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#7dbb52;
    font-family:Arial;
}

canvas{
    display:block;
    background:#7dbb52;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:22px;
    z-index:10;
    text-shadow:2px 2px 4px black;
}

#gameOver{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:60px;
    text-align:center;
    display:none;
    z-index:20;
}

button{
    margin-top:20px;
    padding:12px 24px;
    font-size:24px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>
<body>

<div id="ui">
    Score: <span id="score">0</span>
</div>

<div id="gameOver">
    GAME OVER
    <br>
    <button onclick="location.reload()">Restart</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const scoreEl = document.getElementById("score");
const gameOverEl = document.getElementById("gameOver");

let score = 0;
let running = true;

const runway = {

    x: canvas.width/2 - 140,
    y: canvas.height/2 - 70,
    width:280,
    height:140
};

const helipad = {

    x: canvas.width - 180,
    y: 120,
    r:40
};

class Aircraft{

    constructor(type){

        this.type = type;

        this.speed = type==="plane" ? 1.2 : 0.9;

        this.path = [];
        this.pathIndex = 0;

        this.assigned = false;

        this.angle = 0;

        const side = Math.floor(Math.random()*4);

        if(side===0){

            this.x = Math.random()*canvas.width;
            this.y = -40;
        }

        else if(side===1){

            this.x = canvas.width+40;
            this.y = Math.random()*canvas.height;
        }

        else if(side===2){

            this.x = Math.random()*canvas.width;
            this.y = canvas.height+40;
        }

        else{

            this.x = -40;
            this.y = Math.random()*canvas.height;
        }

        this.color =
        type==="plane"
        ? "#ffffff"
        : "#222222";
    }

    update(){

        if(this.path.length===0){

            // FLOAT IN SKY

            this.angle += 0.01;

            this.x += Math.cos(this.angle)*0.6;
            this.y += Math.sin(this.angle)*0.6;

            return;
        }

        const target = this.path[this.pathIndex];

        if(!target) return;

        const dx = target.x - this.x;
        const dy = target.y - this.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        this.angle = Math.atan2(dy,dx);

        if(dist < 6){

            this.pathIndex++;

            if(this.pathIndex >= this.path.length){

                score++;

                scoreEl.innerText = score;

                this.completed = true;
            }
        }

        else{

            this.x += Math.cos(this.angle)*this.speed;
            this.y += Math.sin(this.angle)*this.speed;
        }
    }

    draw(){

        // PATH

        if(this.path.length>0){

            ctx.beginPath();

            ctx.moveTo(this.x,this.y);

            for(let p of this.path){

                ctx.lineTo(p.x,p.y);
            }

            ctx.strokeStyle =
            this.type==="plane"
            ? "#ffffff"
            : "#000000";

            ctx.lineWidth = 2;

            ctx.setLineDash([8,8]);

            ctx.stroke();

            ctx.setLineDash([]);
        }

        ctx.save();

        ctx.translate(this.x,this.y);

        ctx.rotate(this.angle);

        if(this.type==="plane"){

            ctx.fillStyle="white";

            // BODY

            ctx.beginPath();

            ctx.moveTo(18,0);
            ctx.lineTo(-12,-5);
            ctx.lineTo(-18,0);
            ctx.lineTo(-12,5);

            ctx.closePath();

            ctx.fill();

            // WINGS

            ctx.beginPath();

            ctx.moveTo(-2,0);
            ctx.lineTo(-12,-14);
            ctx.lineTo(-6,-14);
            ctx.lineTo(5,0);

            ctx.closePath();

            ctx.fill();

            ctx.beginPath();

            ctx.moveTo(-2,0);
            ctx.lineTo(-12,14);
            ctx.lineTo(-6,14);
            ctx.lineTo(5,0);

            ctx.closePath();

            ctx.fill();
        }

        else{

            // HELICOPTER

            ctx.fillStyle="#222";

            ctx.fillRect(-12,-6,24,12);

            ctx.fillRect(-18,-2,8,4);

            // ROTOR

            ctx.strokeStyle="white";

            ctx.beginPath();

            ctx.moveTo(-20,0);
            ctx.lineTo(20,0);

            ctx.stroke();

            ctx.beginPath();

            ctx.moveTo(0,-20);
            ctx.lineTo(0,20);

            ctx.stroke();
        }

        ctx.restore();
    }
}

const aircrafts = [];

function spawnAircraft(){

    if(!running) return;

    const type =
    Math.random() > 0.7
    ? "helicopter"
    : "plane";

    aircrafts.push(new Aircraft(type));
}

setInterval(spawnAircraft,2500);

function drawAirport(){

    // RUNWAY

    ctx.fillStyle="#777";

    ctx.fillRect(
        runway.x,
        runway.y,
        runway.width,
        runway.height
    );

    ctx.strokeStyle="white";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        runway.x + runway.width/2,
        runway.y
    );

    ctx.lineTo(
        runway.x + runway.width/2,
        runway.y + runway.height
    );

    ctx.stroke();

    // HELIPAD

    ctx.beginPath();

    ctx.fillStyle="#bbbbbb";

    ctx.arc(
        helipad.x,
        helipad.y,
        helipad.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#222";

    ctx.font="40px Arial";

    ctx.fillText(
        "H",
        helipad.x-14,
        helipad.y+14
    );
}

function detectCollision(){

    for(let i=0;i<aircrafts.length;i++){

        for(let j=i+1;j<aircrafts.length;j++){

            const a = aircrafts[i];
            const b = aircrafts[j];

            if(a.completed || b.completed)
            continue;

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const dist =
            Math.sqrt(dx*dx + dy*dy);

            if(dist < 26){

                running = false;

                gameOverEl.style.display="block";
            }
        }
    }
}

let drawing = false;
let selected = null;

function getPos(e){

    const rect = canvas.getBoundingClientRect();

    return{

        x:(e.clientX || e.touches[0].clientX)-rect.left,

        y:(e.clientY || e.touches[0].clientY)-rect.top
    };
}

canvas.addEventListener("mousedown",startDraw);
canvas.addEventListener("touchstart",startDraw);

function startDraw(e){

    const pos = getPos(e);

    for(let a of aircrafts){

        const dx = pos.x - a.x;
        const dy = pos.y - a.y;

        const dist = Math.sqrt(dx*dx + dy*dy);

        if(dist < 30){

            drawing = true;

            selected = a;

            a.path = [];

            a.pathIndex = 0;

            break;
        }
    }
}

canvas.addEventListener("mousemove",drawPath);
canvas.addEventListener("touchmove",drawPath);

function drawPath(e){

    if(!drawing || !selected) return;

    const pos = getPos(e);

    selected.path.push({
        x:pos.x,
        y:pos.y
    });
}

canvas.addEventListener("mouseup",endDraw);
canvas.addEventListener("touchend",endDraw);

function endDraw(){

    if(selected){

        if(selected.type==="plane"){

            selected.path.push({

                x: runway.x + runway.width/2,

                y: runway.y + runway.height/2
            });
        }

        else{

            selected.path.push({

                x: helipad.x,

                y: helipad.y
            });
        }
    }

    drawing = false;

    selected = null;
}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawAirport();

    aircrafts.forEach(a=>{

        a.update();

        a.draw();
    });

    detectCollision();

    requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
