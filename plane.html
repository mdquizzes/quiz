<script>

// =========================
// NEW RUNWAY SYSTEM
// =========================

const runway = {

    x: canvas.width/2 - 55,
    y: canvas.height/2 - 170,
    width:110,
    height:340
};

// TOP ENTRY
const runwayEntryTop = {

    x: canvas.width/2,
    y: runway.y - 120
};

// BOTTOM ENTRY
const runwayEntryBottom = {

    x: canvas.width/2,
    y: runway.y + runway.height + 120
};

// =========================
// NEW SHELTER PARKING
// =========================

const shelter = {

    x: runway.x + 180,
    y: runway.y + 40,
    width:180,
    height:220
};

// =========================
// UPDATE CONSTRUCTOR
// =========================

this.entrySide =
Math.random() > 0.5
? "top"
: "bottom";

// =========================
// REPLACE FLOAT MOVEMENT
// =========================

if(this.path.length===0){

    this.angle += 0.01;

    this.x += Math.cos(this.angle)*0.4;

    this.y += Math.sin(this.angle)*0.4;

    // KEEP INSIDE SCREEN

    this.x = Math.max(20,
    Math.min(canvas.width-20,this.x));

    this.y = Math.max(20,
    Math.min(canvas.height-20,this.y));

    return;
}

// =========================
// LINE DISAPPEAR EFFECT
// =========================

if(dist < 10){

    this.path.shift();

    this.pathIndex = 0;

    return;
}

// =========================
// LANDING TARGETS
// =========================

if(this.path.length===0){

    if(this.type==="plane"){

        // STRAIGHT LANDING

        this.path = [

            {

                x: this.entrySide==="top"
                ? runwayEntryTop.x
                : runwayEntryBottom.x,

                y: this.entrySide==="top"
                ? runwayEntryTop.y
                : runwayEntryBottom.y
            },

            {

                x: canvas.width/2,

                y: this.entrySide==="top"
                ? runway.y + runway.height
                : runway.y
            }
        ];
    }

    else{

        this.path = [

            {

                x: helipad.x,

                y: helipad.y
            }
        ];
    }
}

// =========================
// AFTER LANDING
// =========================

if(this.type==="plane" && !this.parked){

    // INSIDE RUNWAY

    if(this.x > runway.x &&
       this.x < runway.x + runway.width &&
       this.y > runway.y &&
       this.y < runway.y + runway.height){

        this.landed = true;

        // TAXI TO SHELTER

        this.path = [

            {

                x: shelter.x + 20,

                y: shelter.y + shelter.height/2
            }
        ];
    }
}

// =========================
// HIDE INSIDE SHELTER
// =========================

if(this.landed){

    if(this.x > shelter.x &&
       this.x < shelter.x + shelter.width &&
       this.y > shelter.y &&
       this.y < shelter.y + shelter.height){

        this.parked = true;

        this.hidden = true;

        score++;

        scoreEl.innerText = score;
    }
}

// =========================
// DO NOT DRAW HIDDEN PLANES
// =========================

if(this.hidden) return;

// =========================
// IMPROVED DRAW AIRPORT
// =========================

function drawAirport(){

    // RUNWAY

    ctx.fillStyle="#666";

    ctx.fillRect(
        runway.x,
        runway.y,
        runway.width,
        runway.height
    );

    // RUNWAY EDGE

    ctx.strokeStyle="white";

    ctx.lineWidth=2;

    ctx.strokeRect(
        runway.x,
        runway.y,
        runway.width,
        runway.height
    );

    // CENTER LINE

    ctx.lineWidth=3;

    for(let i=0;i<12;i++){

        ctx.beginPath();

        ctx.moveTo(
            canvas.width/2,
            runway.y + i*28
        );

        ctx.lineTo(
            canvas.width/2,
            runway.y + i*28 + 16
        );

        ctx.stroke();
    }

    // ENTRY LIGHTS

    ctx.fillStyle="yellow";

    ctx.beginPath();

    ctx.arc(
        runwayEntryTop.x,
        runwayEntryTop.y,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        runwayEntryBottom.x,
        runwayEntryBottom.y,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    // HELIPAD

    ctx.beginPath();

    ctx.fillStyle="#cfcfcf";

    ctx.arc(
        helipad.x,
        helipad.y,
        helipad.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#222";

    ctx.font="40px Arial";

    ctx.fillText(
        "H",
        helipad.x-14,
        helipad.y+14
    );

    // =====================
    // AIRCRAFT SHELTER
    // =====================

    ctx.fillStyle="#505050";

    ctx.fillRect(
        shelter.x,
        shelter.y,
        shelter.width,
        shelter.height
    );

    // ROOF

    ctx.beginPath();

    ctx.moveTo(shelter.x - 20,shelter.y);

    ctx.lineTo(shelter.x + 20,shelter.y - 30);

    ctx.lineTo(
        shelter.x + shelter.width - 20,
        shelter.y - 30
    );

    ctx.lineTo(
        shelter.x + shelter.width + 20,
        shelter.y
    );

    ctx.closePath();

    ctx.fillStyle="#333";

    ctx.fill();

    // ENTRY

    ctx.fillStyle="#222";

    ctx.fillRect(
        shelter.x,
        shelter.y + 60,
        20,
        90
    );

    // LABEL

    ctx.fillStyle="white";

    ctx.font="20px Arial";

    ctx.fillText(
        "AIRCRAFT SHELTER",
        shelter.x + 10,
        shelter.y + shelter.height + 30
    );
}

// =========================
// BETTER COLLISION
// =========================

if(dist < 34){

    running = false;

    gameOverEl.style.display="block";
}

</script>
