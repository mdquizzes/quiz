<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Traffic Control</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial;
    background:#74b34a;
}

canvas{
    display:block;
    background:
    radial-gradient(circle at center,
    #95d268 0%,
    #74b34a 100%);
}

#ui{

    position:absolute;
    top:12px;
    left:12px;
    color:white;
    font-size:24px;
    z-index:10;
    text-shadow:2px 2px 5px black;
}

#gameOver{

    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:72px;
    text-align:center;
    display:none;
    z-index:50;
    text-shadow:4px 4px 10px black;
}

button{

    margin-top:20px;
    padding:12px 28px;
    border:none;
    border-radius:10px;
    font-size:24px;
    cursor:pointer;
}

#warning{

    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:red;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    display:none;
    font-size:22px;
    z-index:40;
}

</style>
</head>
<body>

<div id="ui">
    Score: <span id="score">0000</span>
</div>

<div id="warning">
    ⚠ AIRCRAFT TOO CLOSE ⚠
</div>

<div id="gameOver">

    GAME OVER

    <br>

    <button onclick="location.reload()">
        Restart
    </button>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

const scoreEl =
document.getElementById("score");

const gameOverEl =
document.getElementById("gameOver");

const warningEl =
document.getElementById("warning");

let running = true;
let score = 0;

// =====================================
// RUNWAY
// =====================================

const runway = {

    x: 260,
    y: canvas.height/2 - 45,
    width:420,
    height:90
};

// ENTRY POINT

const runwayEntry = {

    x: runway.x - 120,
    y: runway.y + runway.height/2
};

// =====================================
// SHELTER
// =====================================

const shelter = {

    x: runway.x + runway.width,
    y: runway.y - 25,
    width:180,
    height:140
};

// =====================================
// HELIPAD
// =====================================

const helipad = {

    x: shelter.x + 90,
    y: shelter.y + shelter.height + 85,
    r:38
};

// =====================================
// EXPLOSIONS
// =====================================

let explosions = [];

class Explosion{

    constructor(x,y){

        this.x = x;
        this.y = y;

        this.radius = 10;
        this.alpha = 1;
    }

    update(){

        this.radius += 5;

        this.alpha -= 0.025;
    }

    draw(){

        ctx.save();

        ctx.globalAlpha = this.alpha;

        // FIRE

        ctx.beginPath();

        ctx.fillStyle = "orange";

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.fillStyle = "red";

        ctx.arc(
            this.x,
            this.y,
            this.radius*0.65,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.beginPath();

        ctx.fillStyle = "yellow";

        ctx.arc(
            this.x,
            this.y,
            this.radius*0.3,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    }
}

// =====================================
// AIRCRAFT
// =====================================

class Aircraft{

    constructor(type){

        this.type = type;

        this.speed =
        type==="plane"
        ? 1
        : 0.8;

        this.path = [];

        this.angle = 0;

        this.hidden = false;

        // SAFE SPAWN

        const side =
        Math.floor(Math.random()*4);

        if(side===0){

            this.x =
            Math.random()*
            (canvas.width-100)+50;

            this.y = 40;
        }

        else if(side===1){

            this.x =
            canvas.width - 40;

            this.y =
            Math.random()*
            (canvas.height-100)+50;
        }

        else if(side===2){

            this.x =
            Math.random()*
            (canvas.width-100)+50;

            this.y =
            canvas.height - 40;
        }

        else{

            this.x = 40;

            this.y =
            Math.random()*
            (canvas.height-100)+50;
        }
    }

    update(){

        if(this.hidden) return;

        // ===================
        // FLOATING
        // ===================

        if(this.path.length===0){

            this.angle += 0.01;

            this.x +=
            Math.cos(this.angle)*0.4;

            this.y +=
            Math.sin(this.angle)*0.4;

            // KEEP INSIDE SCREEN

            this.x =
            Math.max(
            30,
            Math.min(
            canvas.width-30,
            this.x));

            this.y =
            Math.max(
            30,
            Math.min(
            canvas.height-30,
            this.y));

            return;
        }

        // ===================
        // FOLLOW PATH
        // ===================

        const target = this.path[0];

        const dx =
        target.x - this.x;

        const dy =
        target.y - this.y;

        const dist =
        Math.sqrt(dx*dx + dy*dy);

        this.angle =
        Math.atan2(dy,dx);

        if(dist < 10){

            this.path.shift();

            // ===================
            // AUTO LAND
            // ===================

            if(this.path.length===0){

                // PLANE

                if(this.type==="plane"){

                    this.path = [

                        {

                            x: runwayEntry.x,
                            y: runwayEntry.y
                        },

                        {

                            x:
                            shelter.x + 20,

                            y:
                            shelter.y +
                            shelter.height/2
                        }
                    ];
                }

                // HELICOPTER

                else{

                    this.path = [

                        {

                            x: helipad.x,
                            y: helipad.y
                        }
                    ];
                }
            }

            return;
        }

        // DRIFT

        const drift =
        Math.sin(
        Date.now()*0.001
        + this.x)*0.12;

        this.x +=
        Math.cos(this.angle)
        *this.speed + drift;

        this.y +=
        Math.sin(this.angle)
        *this.speed + drift;

        // KEEP INSIDE SCREEN

        this.x =
        Math.max(
        25,
        Math.min(
        canvas.width-25,
        this.x));

        this.y =
        Math.max(
        25,
        Math.min(
        canvas.height-25,
        this.y));

        // ===================
        // ENTER SHELTER
        // ===================

        if(this.type==="plane"){

            if(this.x > shelter.x &&
               this.x < shelter.x +
               shelter.width &&
               this.y > shelter.y &&
               this.y < shelter.y +
               shelter.height){

                this.hidden = true;

                score++;

                updateScore();
            }
        }

        // ===================
        // HELICOPTER LAND
        // ===================

        if(this.type==="helicopter"){

            const hdx =
            this.x - helipad.x;

            const hdy =
            this.y - helipad.y;

            const hdist =
            Math.sqrt(hdx*hdx+hdy*hdy);

            if(hdist < 22){

                this.hidden = true;

                score++;

                updateScore();
            }
        }
    }

    draw(){

        if(this.hidden) return;

        // ===================
        // PATH
        // ===================

        if(this.path.length>0){

            ctx.beginPath();

            ctx.moveTo(this.x,this.y);

            this.path.forEach(p=>{

                ctx.lineTo(p.x,p.y);
            });

            ctx.strokeStyle =
            this.type==="plane"
            ? "white"
            : "black";

            ctx.lineWidth = 2;

            ctx.setLineDash([8,8]);

            ctx.stroke();

            ctx.setLineDash([]);
        }

        ctx.save();

        ctx.translate(this.x,this.y);

        ctx.rotate(this.angle);

        // ===================
        // PLANE
        // ===================

        if(this.type==="plane"){

            ctx.fillStyle="white";

            // BODY

            ctx.beginPath();

            ctx.moveTo(20,0);
            ctx.lineTo(-15,-6);
            ctx.lineTo(-22,0);
            ctx.lineTo(-15,6);

            ctx.closePath();

            ctx.fill();

            // WINGS

            ctx.beginPath();

            ctx.moveTo(-3,0);
            ctx.lineTo(-15,-18);
            ctx.lineTo(-8,-18);
            ctx.lineTo(5,0);

            ctx.closePath();

            ctx.fill();

            ctx.beginPath();

            ctx.moveTo(-3,0);
            ctx.lineTo(-15,18);
            ctx.lineTo(-8,18);
            ctx.lineTo(5,0);

            ctx.closePath();

            ctx.fill();
        }

        // ===================
        // HELICOPTER
        // ===================

        else{

            ctx.fillStyle="#222";

            ctx.fillRect(-12,-6,24,12);

            ctx.fillRect(-18,-2,8,4);

            // ROTOR

            ctx.strokeStyle="white";

            ctx.beginPath();

            ctx.moveTo(-20,0);
            ctx.lineTo(20,0);

            ctx.stroke();

            ctx.beginPath();

            ctx.moveTo(0,-20);
            ctx.lineTo(0,20);

            ctx.stroke();
        }

        ctx.restore();
    }
}

// =====================================
// AIRCRAFT LIST
// =====================================

const aircrafts = [];

// =====================================
// SPAWN
// =====================================

function spawnAircraft(){

    if(!running) return;

    const type =
    Math.random() > 0.72
    ? "helicopter"
    : "plane";

    aircrafts.push(
    new Aircraft(type));
}

setInterval(spawnAircraft,2500);

// =====================================
// SCORE
// =====================================

function updateScore(){

    scoreEl.innerText =
    String(score).padStart(4,"0");
}

// =====================================
// AIRPORT
// =====================================

function drawAirport(){

    // RUNWAY

    ctx.fillStyle="#666";

    ctx.fillRect(
        runway.x,
        runway.y,
        runway.width,
        runway.height
    );

    ctx.strokeStyle="white";

    ctx.lineWidth=2;

    ctx.strokeRect(
        runway.x,
        runway.y,
        runway.width,
        runway.height
    );

    // CENTER LINE

    for(let i=0;i<14;i++){

        ctx.beginPath();

        ctx.moveTo(
            runway.x + i*30,
            runway.y +
            runway.height/2
        );

        ctx.lineTo(
            runway.x + i*30 + 16,
            runway.y +
            runway.height/2
        );

        ctx.stroke();
    }

    // ENTRY LIGHT

    ctx.fillStyle="yellow";

    ctx.beginPath();

    ctx.arc(
        runwayEntry.x,
        runwayEntry.y,
        8,
        0,
        Math.PI*2
    );

    ctx.fill();

    // SHELTER

    ctx.fillStyle="#555";

    ctx.fillRect(
        shelter.x,
        shelter.y,
        shelter.width,
        shelter.height
    );

    // ROOF

    ctx.beginPath();

    ctx.moveTo(
        shelter.x,
        shelter.y
    );

    ctx.lineTo(
        shelter.x + 25,
        shelter.y - 30
    );

    ctx.lineTo(
        shelter.x +
        shelter.width - 25,
        shelter.y - 30
    );

    ctx.lineTo(
        shelter.x +
        shelter.width,
        shelter.y
    );

    ctx.closePath();

    ctx.fillStyle="#333";

    ctx.fill();

    // OPENING

    ctx.fillStyle="#222";

    ctx.fillRect(
        shelter.x,
        shelter.y + 40,
        22,
        60
    );

    // LABEL

    ctx.fillStyle="white";

    ctx.font="18px Arial";

    ctx.fillText(
        "AIRCRAFT SHELTER",
        shelter.x + 8,
        shelter.y +
        shelter.height + 28
    );

    // HELIPAD

    ctx.beginPath();

    ctx.fillStyle="#d9d9d9";

    ctx.arc(
        helipad.x,
        helipad.y,
        helipad.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#222";

    ctx.font="42px Arial";

    ctx.fillText(
        "H",
        helipad.x - 14,
        helipad.y + 14
    );
}

// =====================================
// COLLISION
// =====================================

function detectCollision(){

    warningEl.style.display = "none";

    for(let i=0;i<aircrafts.length;i++){

        for(let j=i+1;j<aircrafts.length;j++){

            const a = aircrafts[i];
            const b = aircrafts[j];

            if(a.hidden || b.hidden)
            continue;

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const dist =
            Math.sqrt(dx*dx + dy*dy);

            // WARNING

            if(dist < 90){

                warningEl.style.display =
                "block";
            }

            // COLLISION

            if(dist < 34 && running){

                running = false;

                const ex =
                (a.x+b.x)/2;

                const ey =
                (a.y+b.y)/2;

                // SAFE EXPLOSION

                explosions.push(

                    new Explosion(ex,ey)
                );

                // VIBRATION

                if(navigator.vibrate){

                    navigator.vibrate(
                    [300,100,300]);
                }

                // SCREEN SHAKE

                let shakes = 12;

                const shake =
                setInterval(()=>{

                    const x =
                    Math.random()*12-6;

                    const y =
                    Math.random()*12-6;

                    document.body.style.transform =
                    `translate(${x}px,${y}px)`;

                    shakes--;

                    if(shakes<=0){

                        clearInterval(shake);

                        document.body.style.transform =
                        "translate(0,0)";
                    }

                },40);

                setTimeout(()=>{

                    gameOverEl.style.display =
                    "block";

                },1000);
            }
        }
    }
}

// =====================================
// DRAWING
// =====================================

let drawing = false;
let selected = null;

function getPos(e){

    const rect =
    canvas.getBoundingClientRect();

    return{

        x:
        (e.clientX ||
        e.touches[0].clientX)
        - rect.left,

        y:
        (e.clientY ||
        e.touches[0].clientY)
        - rect.top
    };
}

canvas.addEventListener(
"mousedown",
startDraw);

canvas.addEventListener(
"touchstart",
startDraw);

function startDraw(e){

    const pos = getPos(e);

    for(let a of aircrafts){

        if(a.hidden) continue;

        const dx =
        pos.x - a.x;

        const dy =
        pos.y - a.y;

        const dist =
        Math.sqrt(dx*dx + dy*dy);

        if(dist < 30){

            drawing = true;

            selected = a;

            a.path = [];

            break;
        }
    }
}

canvas.addEventListener(
"mousemove",
drawPath);

canvas.addEventListener(
"touchmove",
drawPath);

function drawPath(e){

    if(!drawing || !selected)
    return;

    const pos = getPos(e);

    selected.path.push({

        x: pos.x,
        y: pos.y
    });
}

canvas.addEventListener(
"mouseup",
endDraw);

canvas.addEventListener(
"touchend",
endDraw);

function endDraw(){

    drawing = false;

    selected = null;
}

// =====================================
// ANIMATE
// =====================================

function animate(){

    ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height);

    drawAirport();

    aircrafts.forEach(a=>{

        a.update();

        a.draw();
    });

    explosions.forEach((e,index)=>{

        e.update();

        e.draw();

        if(e.alpha <= 0){

            explosions.splice(index,1);
        }
    });

    detectCollision();

    requestAnimationFrame(
    animate);
}

animate();

// =====================================
// RESIZE
// =====================================

window.addEventListener(
"resize",
()=>{

    canvas.width = innerWidth;
    canvas.height = innerHeight;
});

</script>
</body>
</html>
