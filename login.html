<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES Login</title>

<style>

body{
font-family:Segoe UI;
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#001d3d;
color:white;
}

.card{
background:rgba(255,255,255,0.05);
padding:40px;
border-radius:14px;
width:350px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h2{
color:gold;
margin-bottom:0;
}

.slogan{
font-size:13px;
opacity:0.8;
margin-bottom:15px;
}

.tabs{
display:flex;
margin-bottom:15px;
}

.tabs button{
flex:1;
background:#222;
color:white;
border:none;
padding:8px;
cursor:pointer;
}

.tabs button.active{
background:gold;
color:black;
font-weight:bold;
}

input{
width:90%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:none;
}

.passbox{
position:relative;
}

.eye{
position:absolute;
right:15px;
top:18px;
cursor:pointer;
color:black;
}

.strength{
font-size:12px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
}

.google{
background:#4285F4;
color:white;
}

.link{
font-size:13px;
margin-top:8px;
cursor:pointer;
color:#ffd60a;
}

.msg{
margin-top:10px;
color:#ffd60a;
}

</style>
</head>

<body>

<div class="card">

<h2>📐 MD QUIZZES</h2>
<div class="slogan">Smart Practice for Smart Students</div>

<div class="tabs">
<button id="loginTab" class="active">Login</button>
<button id="signupTab">Signup</button>
</div>

<!-- LOGIN -->

<div id="loginBox">

<input id="email" type="email" placeholder="Email">

<div class="passbox">
<input id="password" type="password" placeholder="Password">
<span class="eye" onclick="togglePass()">👁</span>
</div>

<button id="loginBtn">Login</button>

<div class="link" id="forgotBtn">
Forgot Password?
</div>

<button class="google" id="googleLogin">
Login with Google
</button>

</div>


<!-- SIGNUP -->

<div id="signupBox" style="display:none">

<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">

<input id="emailSignup" type="email" placeholder="Email">

<div class="passbox">
<input id="passwordSignup" type="password" placeholder="Password">
<span class="eye" onclick="togglePassSignup()">👁</span>
</div>

<div class="strength" id="strength"></div>

<button id="signupBtn">Create Account</button>

</div>

<div class="msg" id="msg"></div>

</div>

<script>

const loginTab=document.getElementById("loginTab")
const signupTab=document.getElementById("signupTab")

const loginBox=document.getElementById("loginBox")
const signupBox=document.getElementById("signupBox")

loginTab.onclick=()=>{
loginTab.classList.add("active")
signupTab.classList.remove("active")
loginBox.style.display="block"
signupBox.style.display="none"
}

signupTab.onclick=()=>{
signupTab.classList.add("active")
loginTab.classList.remove("active")
signupBox.style.display="block"
loginBox.style.display="none"
}

function togglePass(){
const p=document.getElementById("password")
p.type=p.type==="password"?"text":"password"
}

function togglePassSignup(){
const p=document.getElementById("passwordSignup")
p.type=p.type==="password"?"text":"password"
}

/* PASSWORD STRENGTH */

document.getElementById("passwordSignup").addEventListener("input",function(){

const val=this.value
const strength=document.getElementById("strength")

if(val.length<6){

strength.innerText="Weak password"

}else if(val.match(/[A-Z]/) && val.match(/[0-9]/)){

strength.innerText="Strong password"

}else{

strength.innerText="Medium password"

}

})

</script>

<script type="module" src="js/auth.js"></script>

</body>
</html>
