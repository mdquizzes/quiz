<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES Login</title>

<style>

body{
font-family:Segoe UI;
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#001d3d;
color:white;
}

.card{

background:rgba(255,255,255,0.05);
padding:40px;
border-radius:14px;
width:330px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.4);
}

h2{
color:gold;
margin-bottom:10px;
}

input{

width:90%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:none;
}

.passbox{
position:relative;
}

.eye{
position:absolute;
right:15px;
top:18px;
cursor:pointer;
color:black;
}

button{

width:100%;
padding:12px;
margin-top:10px;
background:gold;
border:none;
font-weight:bold;
cursor:pointer;
}

.tabs{
display:flex;
margin-bottom:15px;
}

.tabs button{
flex:1;
background:#222;
color:white;
}

.tabs button.active{
background:gold;
color:black;
}

.msg{
margin-top:10px;
color:#ffd60a;
}

</style>

</head>

<body>

<div class="card">

<h2>📐 MD QUIZZES</h2>

<div class="tabs">
<button id="loginTab" class="active">Login</button>
<button id="signupTab">Signup</button>
</div>


<!-- LOGIN -->

<div id="loginBox">

<input id="email" type="email" placeholder="Email">

<div class="passbox">
<input id="password" type="password" placeholder="Password">
<span class="eye" onclick="togglePass()">👁</span>
</div>

<button id="loginBtn">Login</button>

</div>


<!-- SIGNUP -->

<div id="signupBox" style="display:none">

<input id="firstName" placeholder="First Name">
<input id="lastName" placeholder="Last Name">

<input id="emailSignup" type="email" placeholder="Email">

<div class="passbox">
<input id="passwordSignup" type="password" placeholder="Password">
<span class="eye" onclick="togglePassSignup()">👁</span>
</div>

<button id="signupBtn">Create Account</button>

</div>

<div class="msg" id="msg"></div>

</div>

<script>

const loginTab=document.getElementById("loginTab")
const signupTab=document.getElementById("signupTab")

const loginBox=document.getElementById("loginBox")
const signupBox=document.getElementById("signupBox")

loginTab.onclick=()=>{

loginTab.classList.add("active")
signupTab.classList.remove("active")

loginBox.style.display="block"
signupBox.style.display="none"

}

signupTab.onclick=()=>{

signupTab.classList.add("active")
loginTab.classList.remove("active")

signupBox.style.display="block"
loginBox.style.display="none"

}

function togglePass(){

const p=document.getElementById("password")
p.type=p.type==="password"?"text":"password"

}

function togglePassSignup(){

const p=document.getElementById("passwordSignup")
p.type=p.type==="password"?"text":"password"

}

</script>

<script type="module" src="js/auth.js"></script>

</body>
</html>
