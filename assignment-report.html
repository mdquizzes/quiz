<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Assessment Report V2
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Segoe UI,
Arial,
sans-serif;
}

body{
background:#0f172a;
color:white;
}

header{
background:#082f49;
padding:15px;
font-size:24px;
font-weight:bold;
color:#facc15;
}

.container{
padding:20px;
max-width:1600px;
margin:auto;
}

.card{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

h2{
color:#facc15;
margin-bottom:15px;
}

input,
button{
padding:10px;
border:none;
border-radius:8px;
}

button{
background:#facc15;
font-weight:bold;
cursor:pointer;
}

.statsGrid{
display:grid;
grid-template-columns:
repeat(4,1fr);
gap:15px;
}

.statCard{
background:#1e293b;
padding:15px;
border-radius:10px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
}

th,
td{
padding:10px;
border:1px solid #334155;
text-align:center;
}

th{
background:#1e293b;
}

.searchRow{
display:flex;
gap:10px;
margin-bottom:20px;
}

#studentDetail{
display:none;
}

.qGrid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(70px,1fr));
gap:8px;
margin-top:15px;
}

.qBox{
padding:8px;
border-radius:6px;
text-align:center;
font-weight:bold;
}

.correct{
background:#16a34a;
}

.wrong{
background:#dc2626;
}

.blank{
background:#64748b;
}

</style>

</head>

<body>

<header>
Assessment Report V2
</header>

<div class="container">

<div class="card">

<h2>
Class Statistics
</h2>

<div
class="statsGrid"
id="classStats">

Loading...

</div>

</div>

<div class="card">

<h2>
Leaderboard
</h2>

<div id="leaderboardTable">

Loading...

</div>

</div>

<div class="card">

<div class="searchRow">

<input
id="searchStudent"
placeholder="Search Student">

<button
id="searchBtn">

Search

</button>

</div>

<div
id="studentDetail">

</div>

</div>

<div class="card">

<button
id="downloadReportBtn">

Download Complete Report

</button>

</div>

</div>

<script
type="module"
src="js/assignment-report.js">
</script>

</body>
</html>
