<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prime Number Activity</title>

<style>
body {
    font-family: Arial;
    display: flex;
    margin: 0;
}
.container {
    width: 70%;
    padding: 20px;
}
.sidebar {
    width: 30%;
    background: #f4f4f4;
    padding: 20px;
    border-left: 2px solid #ccc;
}
.number-btn {
    width: 60px;
    height: 60px;
    margin: 5px;
    font-size: 18px;
}
.selected {
    background: lightgreen;
}
#timer {
    font-size: 24px;
    color: red;
}
table {
    width: 100%;
    border-collapse: collapse;
}
td, th {
    border: 1px solid #ccc;
    padding: 5px;
    text-align: center;
}
button {
    padding: 8px 12px;
    margin: 5px;
    cursor: pointer;
}
.top1 { background: gold; }
.top2 { background: silver; }
.top3 { background: #cd7f32; color: white; }
</style>

</head>
<body>

<div class="container">

<h2>Prime Number Activity</h2>

<div id="startScreen">
    <input type="text" id="studentName" placeholder="Enter your name">
    <button onclick="startGame()">Start</button>
</div>

<div id="gameScreen" style="display:none;">
    <p>Time Left: <span id="timer">02:00</span></p>
    <div id="numbers"></div>
    <br>
    <button onclick="finishGame()">Finish</button>
</div>

<div id="resultScreen" style="display:none;">
    <h3 id="resultText"></h3>
    <button onclick="restart()">Next Student</button>
</div>

</div>

<div class="sidebar">
<h3>🏆 Score Board</h3>

<button onclick="clearData()">🗑 Clear All Data</button>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Score</th>
</tr>
</thead>
<tbody id="scoreTable">
</tbody>
</table>

</div>

<script>

let numbers = [];
let selected = new Set();
let timer;
let timeLeft;

// Load scores from browser
let scores = JSON.parse(localStorage.getItem("primeScores")) || [];

// Prime check
function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
    }
    return true;
}

// Generate numbers (50% primes)
function generateNumbers() {
    let primes = [];
    let nonPrimes = [];

    for (let i = 1; i <= 100; i++) {
        if (isPrime(i)) primes.push(i);
        else nonPrimes.push(i);
    }

    numbers = [];

    while (numbers.length < 10) {
        let p = primes[Math.floor(Math.random() * primes.length)];
        if (!numbers.includes(p)) numbers.push(p);
    }

    while (numbers.length < 20) {
        let n = nonPrimes[Math.floor(Math.random() * nonPrimes.length)];
        if (!numbers.includes(n)) numbers.push(n);
    }

    numbers.sort(() => Math.random() - 0.5);
}

// Display numbers
function displayNumbers() {
    let container = document.getElementById("numbers");
    container.innerHTML = "";

    numbers.forEach(num => {
        let btn = document.createElement("button");
        btn.innerText = num;
        btn.className = "number-btn";

        btn.onclick = () => {
            if (selected.has(num)) {
                selected.delete(num);
                btn.classList.remove("selected");
            } else {
                selected.add(num);
                btn.classList.add("selected");
            }
        };

        container.appendChild(btn);
    });
}

// Start game
function startGame() {
    let name = document.getElementById("studentName").value.trim();
    if (!name) {
        alert("Enter name");
        return;
    }

    selected.clear();
    timeLeft = 120;

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("resultScreen").style.display = "none";

    generateNumbers();
    displayNumbers();
    startTimer();
}

// Timer
function startTimer() {
    timer = setInterval(() => {
        timeLeft--;

        let m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        let s = String(timeLeft % 60).padStart(2, '0');

        document.getElementById("timer").innerText = `${m}:${s}`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            finishGame();
        }
    }, 1000);
}

// Finish game
function finishGame() {
    clearInterval(timer);

    let name = document.getElementById("studentName").value;
    let score = 0;

    selected.forEach(num => {
        if (isPrime(num)) score++;
    });

    scores.push({ name, score });

    saveScores();
    updateScoreboard();

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";
    document.getElementById("resultText").innerText =
        `${name}, you found ${score} prime numbers!`;
}

// Save to browser
function saveScores() {
    localStorage.setItem("primeScores", JSON.stringify(scores));
}

// Update scoreboard with ranking
function updateScoreboard() {
    let table = document.getElementById("scoreTable");

    // Sort by score DESC
    scores.sort((a, b) => b.score - a.score);

    table.innerHTML = "";

    scores.forEach((s, index) => {
        let rank = index + 1;

        let className = "";
        if (rank === 1) className = "top1";
        else if (rank === 2) className = "top2";
        else if (rank === 3) className = "top3";

        let row = `
            <tr class="${className}">
                <td>${rank}</td>
                <td>${s.name}</td>
                <td>${s.score}</td>
            </tr>
        `;
        table.innerHTML += row;
    });
}

// Clear all stored data
function clearData() {
    if (confirm("Are you sure you want to delete all scores?")) {
        localStorage.removeItem("primeScores");
        scores = [];
        updateScoreboard();
    }
}

// Restart
function restart() {
    document.getElementById("studentName").value = "";
    document.getElementById("startScreen").style.display = "block";
    document.getElementById("resultScreen").style.display = "none";
}

// Load scoreboard on page load
updateScoreboard();

</script>

</body>
</html>
