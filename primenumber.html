
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prime Activity Advanced</title>

<style>
body { font-family: Arial; display: flex; margin: 0; }
.container { width: 70%; padding: 20px; }
.sidebar { width: 30%; background: #f4f4f4; padding: 20px; }

.number-btn {
    width: 60px; height: 60px; margin: 5px; font-size: 18px;
}
.selected { background: lightgreen; }

#timer { font-size: 24px; color: red; }

table { width: 100%; border-collapse: collapse; }
td, th { border: 1px solid #ccc; padding: 5px; text-align: center; }

.top1 { background: gold; }
.top2 { background: silver; }
.top3 { background: #cd7f32; color: white; }

input { padding: 5px; margin: 5px; }
button { padding: 8px; cursor: pointer; }
</style>

</head>

<body>

<div class="container">

<h2>Prime Number Activity</h2>

<div id="startScreen">
    <input type="text" id="studentName" placeholder="Student Name">
    <br>
    <label>Set Time (mm:ss):</label>
    <input type="text" id="setTime" placeholder="02:00">
    <br>
    <button onclick="startGame()">Start</button>
</div>

<div id="gameScreen" style="display:none;">
    <p>Time Left: <span id="timer">00:00</span></p>
    <div id="numbers"></div>
    <br>
    <button onclick="finishGame()">Finish</button>
</div>

<div id="resultScreen" style="display:none;">
    <h3 id="resultText"></h3>
    <button onclick="restart()">Next Student</button>
</div>

</div>

<div class="sidebar">

<h3>🏆 Score Board</h3>
<button onclick="clearData()">🗑 Clear Data</button>

<table>
<thead>
<tr>
<th>Rank</th>
<th>Name</th>
<th>Score</th>
<th>Time</th>
</tr>
</thead>
<tbody id="scoreTable"></tbody>
</table>

</div>

<script>

let numbers = [];
let selected = new Set();
let timer;
let totalTime = 120;
let timeLeft;

let scores = JSON.parse(localStorage.getItem("primeScores")) || [];

// Prime check
function isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) return false;
    }
    return true;
}

// Generate numbers
function generateNumbers() {
    let primes = [], non = [];
    for (let i = 1; i <= 100; i++) {
        if (isPrime(i)) primes.push(i);
        else non.push(i);
    }

    numbers = [];

    while (numbers.length < 10) {
        let p = primes[Math.floor(Math.random() * primes.length)];
        if (!numbers.includes(p)) numbers.push(p);
    }

    while (numbers.length < 20) {
        let n = non[Math.floor(Math.random() * non.length)];
        if (!numbers.includes(n)) numbers.push(n);
    }

    numbers.sort(() => Math.random() - 0.5);
}

// Display numbers
function displayNumbers() {
    let box = document.getElementById("numbers");
    box.innerHTML = "";

    numbers.forEach(num => {
        let btn = document.createElement("button");
        btn.innerText = num;
        btn.className = "number-btn";

        btn.onclick = () => {
            if (selected.has(num)) {
                selected.delete(num);
                btn.classList.remove("selected");
            } else {
                selected.add(num);
                btn.classList.add("selected");
            }
        };

        box.appendChild(btn);
    });
}

// Start game
function startGame() {
    let name = document.getElementById("studentName").value.trim();
    let timeInput = document.getElementById("setTime").value.trim();

    if (!name || !timeInput) {
        alert("Enter name and time");
        return;
    }

    let parts = timeInput.split(":");
    totalTime = parseInt(parts[0]) * 60 + parseInt(parts[1]);

    timeLeft = totalTime;
    selected.clear();

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    generateNumbers();
    displayNumbers();
    startTimer();
}

// Timer
function startTimer() {
    timer = setInterval(() => {
        timeLeft--;

        let m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        let s = String(timeLeft % 60).padStart(2, '0');

        document.getElementById("timer").innerText = `${m}:${s}`;

        if (timeLeft <= 0) {
            clearInterval(timer);
            finishGame();
        }
    }, 1000);
}

// ✅ UPDATED SCORING
function finishGame() {
    clearInterval(timer);

    let name = document.getElementById("studentName").value;

    let score = 0;

    selected.forEach(n => {
        if (isPrime(n)) {
            score += 4;
        } else {
            score -= 1;
        }
    });

    let timeTaken = totalTime - timeLeft;

    let formattedTime =
        String(Math.floor(timeTaken / 60)).padStart(2, '0') + ":" +
        String(timeTaken % 60).padStart(2, '0');

    scores.push({ name, score, time: timeTaken, displayTime: formattedTime });

    saveScores();
    updateScoreboard();

    document.getElementById("gameScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "block";
    document.getElementById("resultText").innerText =
        `${name}, Score: ${score}, Time: ${formattedTime}`;
}

// Save
function saveScores() {
    localStorage.setItem("primeScores", JSON.stringify(scores));
}

// Scoreboard
function updateScoreboard() {
    let table = document.getElementById("scoreTable");

    scores.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return a.time - b.time;
    });

    table.innerHTML = "";

    scores.forEach((s, i) => {
        let rank = i + 1;

        let cls = "";
        if (rank === 1) cls = "top1";
        else if (rank === 2) cls = "top2";
        else if (rank === 3) cls = "top3";

        table.innerHTML += `
        <tr class="${cls}">
            <td>${rank}</td>
            <td>${s.name}</td>
            <td>${s.score}</td>
            <td>${s.displayTime}</td>
        </tr>`;
    });
}

// Clear data
function clearData() {
    if (confirm("Clear all data?")) {
        localStorage.removeItem("primeScores");
        scores = [];
        updateScoreboard();
    }
}

// Restart
function restart() {
    document.getElementById("studentName").value = "";
    document.getElementById("startScreen").style.display = "block";
    document.getElementById("resultScreen").style.display = "none";
}

// Load scoreboard
updateScoreboard();

</script>

</body>
</html>
