<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES - Advanced Test Engine</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

select,button,input{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.auth-box{
  background:#111;
  padding:10px;
  border-radius:10px;
  margin-bottom:15px;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 0 15px #00bfff;
  font-size:18px;
  text-align:left;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:12px;
  cursor:pointer;
}

.correct{ background:green !important; }
.wrong{ background:red !important; }

.result-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:left;
}

.progress-bar{
  width:100%;
  height:20px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-correct{ height:100%; background:green; float:left; }
.progress-wrong{ height:100%; background:red; float:left; }

.review-btn{
  background:orange;
  padding:10px 15px;
  cursor:pointer;
  font-weight:bold;
}

.leaderboard{
  background:#111;
  padding:15px;
  margin-top:20px;
  border-radius:12px;
  text-align:left;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<div class="auth-box">
<span id="userStatus">Guest User</span>
<br>
<input type="text" id="firstName" placeholder="First Name">
<input type="text" id="lastName" placeholder="Last Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="signupUser()">Sign Up</button>
<button onclick="loginUser()">Login</button>
<button onclick="logoutUser()">Logout</button>
</div>

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/biology_and_human_welfare.js">Biology & Human Welfare</option>
<option value="js/biotechnology.js">Biotechnology</option>
<option value="js/cell_biology.js">Cell Biology</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/human_reproduction.js">Human Reproduction</option>
<option value="js/molecular_basis_of_inheritance.js">Molecular Basis of Inheritance</option>
<option value="js/neet_chemistry.js">NEET Chemistry</option>
<option value="js/neet_physics.js">NEET Physics</option>
<option value="js/plant_physiology.js">Plant Physiology</option>
<option value="js/sexual_reproduction_flower.js">Sexual Reproduction in Flowering Plants</option>
</select>

<br>
<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="quiz"></div>
<div id="result"></div>
<div id="leaderboard"></div>

</div>

<script>
let quizQuestions=[];
let currentQuestion=0;
let score=0;
let correctCount=0;
let incorrectCount=0;
let attempted=0;
let wrongAnswers=[];
let selectedChapter="";

function loadScript(src,callback){
 let old=document.getElementById("chapterScript");
 if(old) old.remove();
 let script=document.createElement("script");
 script.src=src;
 script.id="chapterScript";
 script.onload=callback;
 document.body.appendChild(script);
}

function startQuiz(){
 selectedChapter=document.getElementById("chapterSelect").value;
 if(!selectedChapter){ alert("Select chapter"); return; }

 correctCount=0; incorrectCount=0; attempted=0; wrongAnswers=[]; score=0;

 loadScript(selectedChapter,function(){
   quizQuestions=[...window.chapterQuestions];
   quizQuestions.sort(()=>Math.random()-0.5);
   quizQuestions=quizQuestions.slice(0,10);
   currentQuestion=0;
   loadQuestion();
 });
}

function loadQuestion(){
 const q=quizQuestions[currentQuestion];
 document.getElementById("quiz").innerHTML=`
 <div class="question-box">
 Q${currentQuestion+1}. ${q.question}
 </div>
 <div class="options-grid">
 ${q.answers.map((ans,i)=>
 `<button class="option" onclick="checkAnswer(${i},this)">
 ${ans.text}
 </button>`).join("")}
 </div>`;
}

function checkAnswer(index,btn){
 const q=quizQuestions[currentQuestion];
 const buttons=document.querySelectorAll(".option");
 buttons.forEach(b=>b.disabled=true);
 attempted++;

 if(q.answers[index].correct){
   btn.classList.add("correct");
   score+=4;
   correctCount++;
 }else{
   btn.classList.add("wrong");
   incorrectCount++;
   score-=1;
 }

 setTimeout(()=>{
   currentQuestion++;
   if(currentQuestion<quizQuestions.length){
     loadQuestion();
   }else{
     finishQuiz();
   }
 },1000);
}

function finishQuiz(){
 document.getElementById("quiz").innerHTML="";
 document.getElementById("result").innerHTML=`
 <div class="result-card">
 <h2>Final Score: ${score}</h2>
 <button onclick="saveScore()">Save Score to Leaderboard</button>
 </div>`;
}
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, setDoc, addDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCODdCPvN4L96ye0YuxippaIUHnEUwnT90",
 authDomain: "mdquizzes-c255a.firebaseapp.com",
 projectId: "mdquizzes-c255a",
 storageBucket: "mdquizzes-c255a.firebasestorage.app",
 messagingSenderId: "510171455812",
 appId: "1:510171455812:web:dcead5207dc1272aa9b711"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

window.signupUser=async function(){
 const first=firstName.value;
 const last=lastName.value;
 const emailVal=email.value;
 const pass=password.value;
 const user=await createUserWithEmailAndPassword(auth,emailVal,pass);
 await setDoc(doc(db,"users",user.user.uid),{
   firstName:first,
   lastName:last,
   email:emailVal
 });
 alert("Signup Successful");
}

window.loginUser=async function(){
 await signInWithEmailAndPassword(auth,email.value,password.value);
 alert("Login Successful");
}

window.logoutUser=function(){
 signOut(auth);
}

window.saveScore=async function(){
 const user=auth.currentUser;
 if(!user){ alert("Login required"); return; }

 await addDoc(collection(db,"leaderboard"),{
   uid:user.uid,
   name:user.email,
   chapter:selectedChapter,
   score:score,
   date:Date.now()
 });

 alert("Score Saved!");
 loadLeaderboard();
}

onAuthStateChanged(auth,(user)=>{
 if(user){
   userStatus.innerText="Welcome "+user.email;
 }else{
   userStatus.innerText="Guest User";
 }
});

async function loadLeaderboard(){
 const q=query(collection(db,"leaderboard"),orderBy("score","desc"),limit(10));
 const snapshot=await getDocs(q);
 let html="<div class='leaderboard'><h3>🏆 Leaderboard</h3>";
 snapshot.forEach(doc=>{
   html+=`<p>${doc.data().name} - ${doc.data().score}</p>`;
 });
 html+="</div>";
 document.getElementById("leaderboard").innerHTML=html;
}

loadLeaderboard();
</script>

</body>
</html>
