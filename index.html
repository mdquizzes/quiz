<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD Quizzes - Final Stable</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

select,button{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}

.start-btn{ background:gold; font-weight:bold; }

.question-box{
  background:#002855;
  padding:20px;
  border-radius:10px;
  margin-top:20px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.option{
  padding:10px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:8px;
}

.option.selected{ background:orange; }

.nav{ margin-top:20px; }

.score-display{
  font-size:20px;
  margin-top:15px;
  color:gold;
}

#timer{
  margin-top:10px;
  font-size:18px;
  color:yellow;
}

.review-box{
  background:#111;
  padding:10px;
  margin:10px 0;
  border:1px solid gold;
  text-align:left;
}
</style>
</head>

<body>

<h1>MD QUIZZES</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<br>

Questions:
<select id="questionCount">
<option value="10">10</option>
<option value="20">20</option>
<option value="30">30</option>
<option value="40">40</option>
<option value="50">50</option>
<option value="60">60</option>
<option value="80">80</option>
</select>

Positive:
<select id="positiveMarks">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
</select>

Negative:
<select id="negativeMarks">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
</select>

<br>
<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="timer">Time: 00:00:00</div>
<div class="score-display" id="liveScore">Score: 0</div>

<div id="quiz"></div>
<div class="nav" id="nav"></div>
<div id="result"></div>

</div>

<script>

let originalQuestions=[];
let quizQuestions=[];
let userAnswers=[];
let currentQuestion=0;
let score=0;
let positive=1;
let negative=0;
let timerInterval;
let seconds=0;

function formatTime(sec){
 let h=Math.floor(sec/3600);
 let m=Math.floor((sec%3600)/60);
 let s=sec%60;
 return String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
}

function startTimer(){
 seconds=0;
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
   seconds++;
   document.getElementById("timer").innerText="Time: "+formatTime(seconds);
 },1000);
}

function loadScript(src,callback){
 let oldScript=document.getElementById("chapterScript");
 if(oldScript) oldScript.remove();

 let script=document.createElement("script");
 script.src=src;
 script.id="chapterScript";
 script.onload=callback;
 document.body.appendChild(script);
}

function shuffleArray(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function startQuiz(){

 const chapter=document.getElementById("chapterSelect").value;
 if(!chapter){ alert("Select chapter"); return; }

 positive=parseInt(document.getElementById("positiveMarks").value);
 negative=parseInt(document.getElementById("negativeMarks").value);
 let requestedCount=parseInt(document.getElementById("questionCount").value);

 loadScript(chapter,function(){

   if(typeof questions==="undefined"){
     alert("Questions not loaded correctly.");
     return;
   }

   originalQuestions=[...questions];
   shuffleArray(originalQuestions);

   quizQuestions=originalQuestions.slice(0,
     Math.min(requestedCount, originalQuestions.length)
   );

   userAnswers=new Array(quizQuestions.length).fill(null);
   currentQuestion=0;
   score=0;

   updateLiveScore();
   startTimer();
   loadQuestion();
 });
}

function loadQuestion(){

 const q=quizQuestions[currentQuestion];

 let optionsHTML=q.options.map((opt,i)=>{
   let selected=userAnswers[currentQuestion]===i ? "selected" : "";
   return `<button class="option ${selected}" onclick="selectAnswer(${i})">${opt}</button>`;
 }).join("");

 document.getElementById("quiz").innerHTML=`
  <div class="question-box">
   Q${currentQuestion+1}. ${q.question}
  </div>
  <div class="options-grid">${optionsHTML}</div>
 `;

 document.getElementById("nav").innerHTML=`
  ${currentQuestion>0 ? '<button onclick="prevQuestion()">Previous</button>' : ''}
  ${currentQuestion<quizQuestions.length-1 
    ? '<button onclick="nextQuestion()">Next</button>' 
    : '<button onclick="submitTest()">Submit</button>'}
 `;
}

function selectAnswer(index){
 userAnswers[currentQuestion]=index;
 loadQuestion();
}

function prevQuestion(){
 currentQuestion--;
 loadQuestion();
}

function nextQuestion(){
 currentQuestion++;
 loadQuestion();
}

function updateLiveScore(){

 score=0;

 quizQuestions.forEach((q,i)=>{
   if(userAnswers[i]===q.correct){
     score+=positive;
   }
   else if(userAnswers[i]!==null){
     score-=negative;
   }
 });

 document.getElementById("liveScore").innerText="Score: "+score;
}

function submitTest(){

 updateLiveScore();
 clearInterval(timerInterval);

 document.getElementById("result").innerHTML=`
  <h2>Final Scorecard</h2>
  <p>Total Questions: ${quizQuestions.length}</p>
  <p>Final Score: ${score}</p>
  <p>Total Time: ${formatTime(seconds)}</p>
  <h3>Review Wrong Answers</h3>
 `;

 let reviewHTML="";

 quizQuestions.forEach((q,i)=>{
   if(userAnswers[i]!==q.correct){
     reviewHTML+=`
      <div class="review-box">
       <b>Q${i+1}:</b> ${q.question}<br>
       Your Answer: ${q.options[userAnswers[i]] || "Not Attempted"}<br>
       Correct Answer: ${q.options[q.correct]}
      </div>
     `;
   }
 });

 document.getElementById("result").innerHTML+=
   reviewHTML || "All Answers Correct 🎉";

 document.getElementById("quiz").innerHTML="";
 document.getElementById("nav").innerHTML="";
}

</script>

</body>
</html>
