<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD Quizzes - KBC Mode</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{
  color:gold;
  text-shadow:0 0 15px gold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

select,button{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 0 15px #00bfff;
  font-size:20px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
}

.option:hover{
  background:#00bfff;
  color:black;
}

.correct{ background:green !important; }
.wrong{ background:red !important; }

/* 3 Digit Score Display */
.score-container{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.digit-box{
  width:60px;
  height:70px;
  background:black;
  border:2px solid gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:gold;
  font-weight:bold;
  box-shadow:0 0 15px gold;
}

#timer{
  margin-top:10px;
  font-size:18px;
  color:yellow;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES - KBC MODE</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="timer">Time: 00:00:00</div>

<div class="score-container">
<div class="digit-box" id="d1">0</div>
<div class="digit-box" id="d2">0</div>
<div class="digit-box" id="d3">0</div>
</div>

<div id="quiz"></div>
<div id="result"></div>

</div>

<script>

let quizQuestions=[];
let currentQuestion=0;
let score=0;
let timerInterval;
let seconds=0;

/* ---------- TIMER ---------- */

function formatTime(sec){
 let h=Math.floor(sec/3600);
 let m=Math.floor((sec%3600)/60);
 let s=sec%60;
 return String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
}

function startTimer(){
 seconds=0;
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
   seconds++;
   document.getElementById("timer").innerText="Time: "+formatTime(seconds);
 },1000);
}

/* ---------- SOUND (KBC STYLE) ---------- */

function playCorrectSound(){
 let ctx=new (window.AudioContext||window.webkitAudioContext)();
 let osc=ctx.createOscillator();
 osc.type="sine";
 osc.frequency.value=600;
 osc.connect(ctx.destination);
 osc.start();
 setTimeout(()=>osc.stop(),300);
}

function playWrongSound(){
 let ctx=new (window.AudioContext||window.webkitAudioContext)();
 let osc=ctx.createOscillator();
 osc.type="sawtooth";
 osc.frequency.value=150;
 osc.connect(ctx.destination);
 osc.start();
 setTimeout(()=>osc.stop(),400);
}

/* ---------- SCORE DISPLAY ---------- */

function updateScoreDisplay(){
 let formatted=Math.max(0,score).toString().padStart(3,'0');
 d1.innerText=formatted[0];
 d2.innerText=formatted[1];
 d3.innerText=formatted[2];
}

/* ---------- LOAD SCRIPT SAFELY ---------- */

function loadScript(src,callback){

 let oldScript=document.getElementById("chapterScript");
 if(oldScript) oldScript.remove();

 let script=document.createElement("script");
 script.src=src;
 script.id="chapterScript";
 script.onload=callback;
 document.body.appendChild(script);
}

/* ---------- START QUIZ ---------- */

function startQuiz(){

 const chapter=document.getElementById("chapterSelect").value;
 if(!chapter){ alert("Select chapter"); return; }

 loadScript(chapter,function(){

   if(!window.chapterQuestions){
     alert("Questions not loaded.");
     return;
   }

   quizQuestions=[...window.chapterQuestions];
   currentQuestion=0;
   score=0;
   updateScoreDisplay();
   startTimer();
   loadQuestion();
 });
}

/* ---------- LOAD QUESTION ---------- */

function loadQuestion(){

 const q=quizQuestions[currentQuestion];

 document.getElementById("quiz").innerHTML=`
  <div class="question-box">
   Q${currentQuestion+1}. ${q.question}
  </div>
  <div class="options-grid">
   ${q.options.map((opt,i)=>
     `<button class="option" onclick="checkAnswer(${i},this)">${opt}</button>`
   ).join("")}
  </div>
 `;
}

/* ---------- CHECK ANSWER ---------- */

function checkAnswer(index,btn){

 const correctIndex=quizQuestions[currentQuestion].correct;
 const buttons=document.querySelectorAll(".option");

 buttons.forEach(b=>b.disabled=true);

 if(index===correctIndex){
   btn.classList.add("correct");
   score++;
   playCorrectSound();
 }else{
   btn.classList.add("wrong");
   buttons[correctIndex].classList.add("correct");
   playWrongSound();
 }

 updateScoreDisplay();

 setTimeout(()=>{
   currentQuestion++;
   if(currentQuestion<quizQuestions.length){
     loadQuestion();
   }else{
     clearInterval(timerInterval);
     document.getElementById("quiz").innerHTML="";
     document.getElementById("result").innerHTML=
       `<h2>Quiz Finished</h2>
        <p>Final Score: ${score}</p>
        <p>Total Time: ${formatTime(seconds)}</p>`;
   }
 },1000);
}

</script>

</body>
</html>
