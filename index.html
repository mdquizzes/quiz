<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES - Advanced Engine</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

select,button,input{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.auth-box{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.result-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

.leaderboard{
  background:#111;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<!-- AUTH SECTION -->
<div class="auth-box">
<span id="userStatus">Guest User</span><br>

<input type="text" id="firstName" placeholder="First Name">
<input type="text" id="lastName" placeholder="Last Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<br>

<button onclick="signupUser()">Sign Up</button>
<button onclick="loginUser()">Login</button>
<button onclick="logoutUser()">Logout</button>
</div>

<hr>

<!-- QUIZ CONTROLS -->

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<br>

<label>Custom Scoring:</label><br>

<select id="customPositiveSelect">
<option value="1">Right +1</option>
<option value="2">Right +2</option>
<option value="3">Right +3</option>
<option value="4" selected>Right +4</option>
</select>

<select id="customNegativeSelect">
<option value="0" selected>Wrong 0</option>
<option value="1">Wrong -1</option>
<option value="2">Wrong -2</option>
</select>

<br>

<button class="start-btn" onclick="startQuiz()">Start Test</button>

<!-- QUIZ AREA -->
<div id="quiz"></div>
<div id="result"></div>

<hr>

<!-- LEADERBOARD BUTTONS -->

<button onclick="loadMainLeaderboard()">🌍 Main Leaderboard</button>

<div id="leaderboard"></div>

</div>

<!-- MODULE SCRIPTS -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/leaderboard.js"></script>

<!-- NORMAL SCRIPT -->
<script src="js/quiz-engine.js"></script>

</body>
</html>
