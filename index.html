<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES - Advanced Test Engine</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

select,button{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 0 15px #00bfff;
  font-size:18px;
  text-align:left;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:12px;
  cursor:pointer;
}

.correct{ background:green !important; }
.wrong{ background:red !important; }

#timer{
  margin-top:10px;
  font-size:18px;
  color:yellow;
}

.result-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:left;
}

.progress-bar{
  width:100%;
  height:20px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-correct{
  height:100%;
  background:green;
  float:left;
}

.progress-wrong{
  height:100%;
  background:red;
  float:left;
}

.review-btn{
  background:orange;
  padding:10px 15px;
  border:none;
  margin-top:15px;
  cursor:pointer;
  font-weight:bold;
}

.solution-box{
  background:#222;
  padding:15px;
  margin-top:15px;
  border:1px solid gold;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/biology_and_human_welfare.js">Biology & Human Welfare</option>
<option value="js/biotechnology.js">Biotechnology</option>
<option value="js/cell_biology.js">Cell Biology</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/human_reproduction.js">Human Reproduction</option>
<option value="js/molecular_basis_of_inheritance.js">Molecular Basis of Inheritance</option>
<option value="js/neet_chemistry.js">NEET Chemistry</option>
<option value="js/neet_physics.js">NEET Physics</option>
<option value="js/plant_physiology.js">Plant Physiology</option>
<option value="js/sexual_reproduction_flower.js">Sexual Reproduction in Flowering Plants</option>
</select>

<br>

Questions:
<select id="questionCount">
<option value="10">10</option>
<option value="20">20</option>
<option value="40">40</option>
<option value="60">60</option>
<option value="80">80</option>
</select>

Positive:
<select id="positiveMarks">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4" selected>4</option>
</select>

Negative:
<select id="negativeMarks">
<option value="0">0</option>
<option value="1" selected>1</option>
<option value="2">2</option>
</select>

<br>
<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="timer">Time: 00:00:00</div>

<div id="quiz"></div>
<div id="result"></div>

</div>

<script>

let quizQuestions=[];
let currentQuestion=0;
let score=0;
let positive=4;
let negative=1;
let timerInterval;
let seconds=0;

let correctCount=0;
let incorrectCount=0;
let attempted=0;
let wrongAnswers=[];

function formatTime(sec){
 let h=Math.floor(sec/3600);
 let m=Math.floor((sec%3600)/60);
 let s=sec%60;
 return String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
}

function startTimer(){
 seconds=0;
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
   seconds++;
   document.getElementById("timer").innerText="Time: "+formatTime(seconds);
 },1000);
}

function loadScript(src,callback){
 let old=document.getElementById("chapterScript");
 if(old) old.remove();

 let script=document.createElement("script");
 script.src=src;
 script.id="chapterScript";
 script.onload=callback;
 document.body.appendChild(script);
}

function startQuiz(){

 const chapter=document.getElementById("chapterSelect").value;
 if(!chapter){ alert("Select chapter"); return; }

 positive=parseInt(document.getElementById("positiveMarks").value);
 negative=parseInt(document.getElementById("negativeMarks").value);
 let count=parseInt(document.getElementById("questionCount").value);

 correctCount=0;
 incorrectCount=0;
 attempted=0;
 wrongAnswers=[];
 score=0;
 document.getElementById("result").innerHTML="";

 loadScript(chapter,function(){

   let all=[...window.chapterQuestions];
   all.sort(()=>Math.random()-0.5);
   quizQuestions=all.slice(0,Math.min(count,all.length));

   currentQuestion=0;
   startTimer();
   loadQuestion();
 });
}

function loadQuestion(){

 const q=quizQuestions[currentQuestion];

 document.getElementById("quiz").innerHTML=`
  <div class="question-box">
   Q${currentQuestion+1}. ${q.question}
  </div>
  <div class="options-grid">
   ${q.answers.map((ans,i)=>
     `<button class="option" onclick="checkAnswer(${i},this)">
       ${ans.text}
      </button>`
   ).join("")}
  </div>
 `;
}

function checkAnswer(index,btn){

 const q=quizQuestions[currentQuestion];
 const buttons=document.querySelectorAll(".option");
 buttons.forEach(b=>b.disabled=true);

 attempted++;

 if(q.answers[index].correct){
   btn.classList.add("correct");
   score+=positive;
   correctCount++;
 }else{
   btn.classList.add("wrong");
   q.answers.forEach((a,i)=>{
     if(a.correct) buttons[i].classList.add("correct");
   });
   score-=negative;
   incorrectCount++;

   wrongAnswers.push({
     question:q.question,
     solution:q.solution
   });
 }

 setTimeout(()=>{
   currentQuestion++;
   if(currentQuestion<quizQuestions.length){
     loadQuestion();
   }else{
     finishQuiz();
   }
 },1000);
}

function finishQuiz(){

 clearInterval(timerInterval);

 let total=quizQuestions.length;
 let unattempted=total-attempted;
 let accuracy = attempted>0 ? ((correctCount/attempted)*100).toFixed(2) : 0;
 let percentage = ((score/(total*positive))*100).toFixed(2);
 let attemptPercent = ((attempted/total)*100).toFixed(2);

 let correctWidth=(correctCount/total)*100;
 let wrongWidth=(incorrectCount/total)*100;

 document.getElementById("quiz").innerHTML="";

 document.getElementById("result").innerHTML=`
 <div class="result-card">
  <h2>Scorecard</h2>
  <p><b>Total Score:</b> ${score}</p>
  <p>✅ Correct: ${correctCount}</p>
  <p>❌ Incorrect: ${incorrectCount}</p>
  <p>⚪ Unattempted: ${unattempted}</p>

  <div class="progress-bar">
    <div class="progress-correct" style="width:${correctWidth}%"></div>
    <div class="progress-wrong" style="width:${wrongWidth}%"></div>
  </div>

  <hr>

  <p>📊 Percentage: ${percentage}%</p>
  <p>🎯 Accuracy: ${accuracy}%</p>
  <p>📝 Attempt Percentage: ${attemptPercent}%</p>
  <p>⏱ Time Taken: ${formatTime(seconds)}</p>

  ${wrongAnswers.length>0 ?
  `<button class="review-btn" onclick="showReview()">Review Wrong Answers</button>`
  :
  "<p>🎉 Perfect Performance!</p>"}

 </div>
 `;
}

function showReview(){

 let html="<h3>Wrong Answers Review</h3>";

 wrongAnswers.forEach((item,i)=>{
   html+=`
    <div class="solution-box">
      <b>Q${i+1}:</b> ${item.question}<br><br>
      <b>Solution:</b><br>
      ${item.solution}
    </div>
   `;
 });

 document.getElementById("result").innerHTML+=html;
}

</script>

</body>
</html>
