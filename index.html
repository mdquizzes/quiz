<!DOCTYPE html>
<html>
<head>
  <title>MD Quizzes</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial;
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    select, button {
      padding: 8px;
      margin: 10px 0;
    }
    .question {
      font-size: 18px;
      margin-bottom: 10px;
    }
    button.option {
      display: block;
      margin: 5px 0;
      width: 100%;
    }
    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>MD Quizzes</h1>

<h3>Select Chapter:</h3>
<select id="chapterSelect">
  <option value="">-- Select --</option>
  <option value="js/human_physiology.js">Cell Biology</option>
  <option value="js/cell_biology.js">Cell Biology</option>
</select>

<button onclick="startQuiz()">Start Quiz</button>

<hr>

<div id="quiz"></div>
<div id="result"></div>

<script>
let questions = [];
let currentQuestion = 0;
let score = 0;

function loadScript(src, callback) {
  let script = document.createElement("script");
  script.src = src;
  script.onload = callback;
  document.body.appendChild(script);
}

function startQuiz() {
  const chapter = document.getElementById("chapterSelect").value;
  if (!chapter) {
    alert("Please select a chapter");
    return;
  }

  document.getElementById("quiz").innerHTML = "";
  document.getElementById("result").innerHTML = "";

  loadScript(chapter, function () {
    currentQuestion = 0;
    score = 0;
    loadQuestion();
  });
}

function loadQuestion() {
  const q = questions[currentQuestion];
  const quizDiv = document.getElementById("quiz");

  quizDiv.innerHTML = `
    <div class="question">${q.question}</div>
    ${q.options.map((opt, i) =>
      `<button class="option" onclick="checkAnswer(${i})">${opt}</button>`
    ).join("")}
  `;
}

function checkAnswer(index) {
  if (index === questions[currentQuestion].correct) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerText =
      "Quiz Finished! Score: " + score + "/" + questions.length;
  }
}
</script>
</body>
</html>
