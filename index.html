<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD Quizzes - Advanced Mode</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{
  color:gold;
  text-shadow:0 0 15px gold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

select,button{
  padding:8px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
  box-shadow:0 0 15px #00bfff;
  font-size:20px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:15px;
  cursor:pointer;
}

.correct{ background:green !important; }
.wrong{ background:red !important; }

.nav-buttons{
  margin-top:20px;
}

.nav-buttons button{
  background:gold;
  font-weight:bold;
}

.score-container{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.digit-box{
  width:60px;
  height:70px;
  background:black;
  border:2px solid gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:gold;
  font-weight:bold;
  box-shadow:0 0 10px gold;
}

.review-box{
  background:#111;
  padding:15px;
  margin:10px;
  border:1px solid gold;
  text-align:left;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES - ADVANCED MODE</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div class="score-container">
<div class="digit-box" id="d1">0</div>
<div class="digit-box" id="d2">0</div>
<div class="digit-box" id="d3">0</div>
</div>

<div id="quiz"></div>
<div class="nav-buttons" id="navButtons"></div>
<div id="result"></div>

</div>

<script>

let questions=[];
let userAnswers=[];
let currentQuestion=0;
let score=0;

function loadScript(src,callback){
 let script=document.createElement("script");
 script.src=src;
 script.onload=callback;
 document.body.appendChild(script);
}

function shuffleArray(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function updateScoreDisplay(){
 let formatted=Math.max(0,score).toString().padStart(3,'0');
 d1.innerText=formatted[0];
 d2.innerText=formatted[1];
 d3.innerText=formatted[2];
}

function startQuiz(){

 const chapter=document.getElementById("chapterSelect").value;
 if(!chapter){ alert("Select chapter"); return; }

 loadScript(chapter,function(){

   shuffleArray(questions);

   questions.forEach(q=>{
     let correctAnswer=q.options[q.correct];
     shuffleArray(q.options);
     q.correct=q.options.indexOf(correctAnswer);
   });

   userAnswers=new Array(questions.length).fill(null);
   score=0;
   updateScoreDisplay();
   currentQuestion=0;
   loadQuestion();
 });
}

function loadQuestion(){
 const q=questions[currentQuestion];

 quiz.innerHTML=`
  <div class="question-box">
  Q${currentQuestion+1}. ${q.question}
  </div>
  <div class="options-grid">
   ${q.options.map((opt,i)=>
     `<button class="option" onclick="selectAnswer(${i})">${opt}</button>`
   ).join("")}
  </div>
 `;

 navButtons.innerHTML=`
  ${currentQuestion>0 ? '<button onclick="prevQuestion()">Previous</button>' : ''}
  ${currentQuestion<questions.length-1 ? '<button onclick="nextQuestion()">Next</button>' : '<button onclick="finishTest()">Submit</button>'}
 `;
}

function selectAnswer(index){
 userAnswers[currentQuestion]=index;
}

function prevQuestion(){
 currentQuestion--;
 loadQuestion();
}

function nextQuestion(){
 currentQuestion++;
 loadQuestion();
}

function finishTest(){

 score=0;

 questions.forEach((q,i)=>{
   if(userAnswers[i]===q.correct){
     score++;
   }
 });

 updateScoreDisplay();

 showScorecard();
}

function showScorecard(){

 let wrongHTML="";

 questions.forEach((q,i)=>{
   if(userAnswers[i]!==q.correct){
     wrongHTML+=`
      <div class="review-box">
       <b>Q${i+1}:</b> ${q.question}<br>
       Your Answer: ${q.options[userAnswers[i]] || "Not Attempted"}<br>
       Correct Answer: ${q.options[q.correct]}
      </div>
     `;
   }
 });

 result.innerHTML=`
  <h2>Scorecard</h2>
  <p>Total Questions: ${questions.length}</p>
  <p>Correct: ${score}</p>
  <p>Wrong: ${questions.length-score}</p>
  <h3>Review Wrong Answers</h3>
  ${wrongHTML || "All Answers Correct 🎉"}
 `;
 quiz.innerHTML="";
 navButtons.innerHTML="";
}

</script>
</body>
</html>
