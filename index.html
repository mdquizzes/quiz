<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

.top-menu{
  position:absolute;
  right:20px;
  top:20px;
}

.top-menu button{
  margin-left:8px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

.login-btn{ background:gold; }
.logout-btn{ background:red; color:white; }
.profile-btn{ background:#00c896; color:white; }

select,button{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.leaderboard{
  background:#111;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>  

<br>

<select id="customPositiveSelect">
<option value="4" selected>Right +4</option>
<option value="3">Right +3</option>
<option value="2">Right +2</option>
<option value="1">Right +1</option>
</select>

<select id="customNegativeSelect">
<option value="1" selected>Wrong -1</option>
<option value="0">Wrong 0</option>
<option value="2">Wrong -2</option>
</select>

<br>

<!-- ❌ onclick removed -->
<button class="start-btn" id="startBtn">Start Test</button>

<!-- ✅ IMPORTANT: id changed to quizBox -->
<div id="quizBox"></div>
<div id="result"></div>

<hr>

<p id="totalPoints"></p>

</div>

<!-- Firebase Modules -->
<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/leaderboard.js"></script>

<!-- Quiz Engine (Normal Script, NOT module) -->
<script src="js/quiz-engine.js"></script>

</body>
</html>
