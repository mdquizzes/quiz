<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD QUIZZES</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:radial-gradient(circle,#001f3f,#000814);
color:white;
text-align:center;
}

h1{color:#ffd60a;margin-top:20px;}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.select-box{
margin:8px;
padding:8px 12px;
border-radius:6px;
border:none;
font-size:14px;
}

.start-btn{
background:#ffd60a;
border:none;
padding:10px 18px;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<select id="boardSelect" class="select-box">
<option value="cbse">CBSE</option>
<option value="gseb">GSEB</option>
</select>

<select id="mediumSelect" class="select-box">
<option value="english">English</option>
<option value="gujarati">Gujarati</option>
</select>

<select id="classSelect" class="select-box">
<option value="class10">Class X</option>
<option value="class9">Class IX</option>
<option value="class8">Class VIII</option>
</select>

<br>

<select id="subjectSelect" class="select-box">
<option value="Mathematics">Mathematics</option>
<option value="Science">Science</option>
<option value="English">English</option>
<option value="NEET">NEET</option>
</select>

<br>

<select id="questionCountSelect" class="select-box">
<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
<option value="40">40 Questions</option>
<option value="60">60 Questions</option>
</select>

<select id="customPositiveSelect" class="select-box">
<option value="4">+4</option>
<option value="3">+3</option>
<option value="2">+2</option>
<option value="1">+1</option>
</select>

<select id="customNegativeSelect" class="select-box">
<option value="-1">-1</option>
<option value="-2">-2</option>
<option value="-0.5">-0.5</option>
</select>

<br>

<button class="start-btn" onclick="openQuiz()">🚀 Start Quiz</button>

</div>

<script>

function openQuiz(){

const board =
document.getElementById("boardSelect").value;

const medium =
document.getElementById("mediumSelect").value;

const className =
document.getElementById("classSelect").value;

const subject =
document.getElementById("subjectSelect").value;

const q =
document.getElementById("questionCountSelect").value;

const p =
document.getElementById("customPositiveSelect").value;

const n =
document.getElementById("customNegativeSelect").value;

const url =
"mdquiz.html?"
+
"board="+board+
"&medium="+medium+
"&class="+className+
"&subject="+subject+
"&q="+q+
"&p="+p+
"&n="+n;

window.open(url,"_blank");

}

</script>

</body>
</html>
