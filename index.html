<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD Quizzes - Structured Format</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

select,button{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 0 15px #00bfff;
  font-size:20px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:12px;
  cursor:pointer;
}

.correct{ background:green !important; }
.wrong{ background:red !important; }

.score-container{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.digit-box{
  width:60px;
  height:70px;
  background:black;
  border:2px solid gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  color:gold;
  font-weight:bold;
}

#timer{
  margin-top:10px;
  font-size:18px;
  color:yellow;
}

.solution-box{
  background:#111;
  padding:15px;
  margin-top:15px;
  border:1px solid gold;
  text-align:left;
}

.review-btn{
  background:orange;
  font-weight:bold;
  cursor:pointer;
  padding:10px 18px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<br>

Questions:
<select id="questionCount">
<option value="10">10</option>
<option value="20">20</option>
<option value="40">40</option>
<option value="60">60</option>
<option value="80">80</option>
</select>

Positive:
<select id="positiveMarks">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4" selected>4</option>
</select>

Negative:
<select id="negativeMarks">
<option value="0" selected>0</option>
<option value="1">1</option>
<option value="2">2</option>
</select>

<br>
<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="timer">Time: 00:00:00</div>

<div class="score-container">
<div class="digit-box" id="d1">0</div>
<div class="digit-box" id="d2">0</div>
<div class="digit-box" id="d3">0</div>
</div>

<div id="quiz"></div>
<div id="result"></div>

</div>

<script>

let quizQuestions=[];
let currentQuestion=0;
let score=0;
let positive=4;
let negative=0;
let timerInterval;
let seconds=0;
let wrongAnswers=[];

/* TIMER */

function formatTime(sec){
 let h=Math.floor(sec/3600);
 let m=Math.floor((sec%3600)/60);
 let s=sec%60;
 return String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
}

function startTimer(){
 seconds=0;
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
   seconds++;
   document.getElementById("timer").innerText="Time: "+formatTime(seconds);
 },1000);
}

/* SCORE DISPLAY */

function updateScoreDisplay(){
 let formatted=Math.abs(score).toString().padStart(3,'0');

 if(score<0){
   d1.innerText="-";
   d2.innerText=formatted[formatted.length-2] || "0";
   d3.innerText=formatted[formatted.length-1] || "0";
 }else{
   d1.innerText=formatted[0];
   d2.innerText=formatted[1];
   d3.innerText=formatted[2];
 }
}

/* LOAD SCRIPT */

function loadScript(src,callback){
 let oldScript=document.getElementById("chapterScript");
 if(oldScript) oldScript.remove();

 let script=document.createElement("script");
 script.src=src;
 script.id="chapterScript";
 script.onload=callback;
 document.body.appendChild(script);
}

/* START QUIZ */

function startQuiz(){

 const chapter=document.getElementById("chapterSelect").value;
 if(!chapter){ alert("Select chapter"); return; }

 positive=parseInt(document.getElementById("positiveMarks").value);
 negative=parseInt(document.getElementById("negativeMarks").value);
 let requestedCount=parseInt(document.getElementById("questionCount").value);

 wrongAnswers=[];
 document.getElementById("result").innerHTML="";

 loadScript(chapter,function(){

   let all=[...window.chapterQuestions];
   all.sort(()=>Math.random()-0.5);

   quizQuestions=all.slice(0,Math.min(requestedCount,all.length));

   currentQuestion=0;
   score=0;
   updateScoreDisplay();
   startTimer();
   loadQuestion();
 });
}

/* LOAD QUESTION */

function loadQuestion(){

 const q=quizQuestions[currentQuestion];

 document.getElementById("quiz").innerHTML=`
  <div class="question-box">
   Q${currentQuestion+1}. ${q.question}
  </div>
  <div class="options-grid">
   ${q.answers.map((ans,i)=>
     `<button class="option" onclick="checkAnswer(${i},this)">
       ${ans.text}
      </button>`
   ).join("")}
  </div>
 `;
}

/* CHECK ANSWER */

function checkAnswer(index,btn){

 const q=quizQuestions[currentQuestion];
 const buttons=document.querySelectorAll(".option");

 buttons.forEach(b=>b.disabled=true);

 if(q.answers[index].correct){
   btn.classList.add("correct");
   score+=positive;
 }else{
   btn.classList.add("wrong");
   q.answers.forEach((a,i)=>{
     if(a.correct) buttons[i].classList.add("correct");
   });

   score-=negative;

   wrongAnswers.push({
     question:q.question,
     solution:q.solution
   });
 }

 updateScoreDisplay();

 setTimeout(()=>{
   currentQuestion++;
   if(currentQuestion<quizQuestions.length){
     loadQuestion();
   }else{
     finishQuiz();
   }
 },1200);
}

/* FINISH QUIZ */

function finishQuiz(){

 clearInterval(timerInterval);
 document.getElementById("quiz").innerHTML="";

 document.getElementById("result").innerHTML=`
   <h2>Quiz Finished</h2>
   <p>Final Score: ${score}</p>
   <p>Total Time: ${formatTime(seconds)}</p>
   ${wrongAnswers.length>0 ?
     `<button class="review-btn" onclick="showReview()">
        Review Wrong Answers
      </button>` :
      "<p>🎉 All Answers Correct!</p>"
   }
 `;
}

/* REVIEW SECTION */

function showReview(){

 let reviewHTML="<h3>Wrong Answers Review</h3>";

 wrongAnswers.forEach((item,i)=>{
   reviewHTML+=`
     <div class="solution-box">
       <b>Q${i+1}:</b> ${item.question}<br><br>
       <b>Solution:</b><br>
       ${item.solution}
     </div>
   `;
 });

 document.getElementById("result").innerHTML+=reviewHTML;
}

</script>

</body>
</html>
