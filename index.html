<!DOCTYPE html>
<html>
<head>
  <title>MD Quizzes</title>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at center, #001f3f, #000814);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 40px;
      color: gold;
      text-shadow: 0 0 15px gold;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    select, .start-btn {
      padding: 10px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: none;
    }

    .start-btn {
      background: gold;
      font-weight: bold;
      cursor: pointer;
    }

    .start-btn:hover {
      background: orange;
    }

    .question-box {
      margin-top: 30px;
      padding: 20px;
      background: #002855;
      border-radius: 15px;
      box-shadow: 0 0 20px #00bfff;
      font-size: 20px;
    }

    .option {
      display: block;
      margin: 12px auto;
      padding: 12px;
      width: 80%;
      background: #001d3d;
      border: 2px solid #00bfff;
      color: white;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
      font-size: 16px;
    }

    .option:hover {
      background: #00bfff;
      color: black;
      transform: scale(1.05);
    }

    #result {
      margin-top: 30px;
      font-size: 22px;
      color: gold;
      text-shadow: 0 0 10px gold;
    }
  </style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

  <h3>Select Chapter</h3>

  <select id="chapterSelect">
    <option value="">-- Select --</option>
    <option value="js/human_physiology.js">Human Physiology</option>
    <option value="js/cell_biology.js">Cell Biology</option>
  </select>

  <br>

  <button class="start-btn" onclick="startQuiz()">Start Quiz</button>

  <div id="quiz"></div>
  <div id="result"></div>

</div>

<script>
let questions = [];
let currentQuestion = 0;
let score = 0;

function loadScript(src, callback) {
  let script = document.createElement("script");
  script.src = src;
  script.onload = callback;
  document.body.appendChild(script);
}

function startQuiz() {
  const chapter = document.getElementById("chapterSelect").value;
  if (!chapter) {
    alert("Please select a chapter");
    return;
  }

  document.getElementById("quiz").innerHTML = "";
  document.getElementById("result").innerHTML = "";

  loadScript(chapter, function () {
    currentQuestion = 0;
    score = 0;
    loadQuestion();
  });
}

function loadQuestion() {
  const q = questions[currentQuestion];
  const quizDiv = document.getElementById("quiz");

  quizDiv.innerHTML = `
    <div class="question-box">${q.question}</div>
    ${q.options.map((opt, i) =>
      `<button class="option" onclick="checkAnswer(${i})">${opt}</button>`
    ).join("")}
  `;
}

function checkAnswer(index) {
  if (index === questions[currentQuestion].correct) {
    score++;
  }

  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerText =
      "🎉 Quiz Finished! Your Score: " + score + " / " + questions.length;
  }
}
</script>

</body>
</html>
