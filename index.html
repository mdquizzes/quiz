<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD QUIZZES - Advanced Engine</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{ color:gold; }

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

select,button,input{
  padding:8px 12px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:left;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:12px;
  cursor:pointer;
}

.correct{background:green !important;}
.wrong{background:red !important;}

.result-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  text-align:left;
}

.leaderboard{
  background:#111;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
  text-align:left;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES</h1>

<div class="container">

<div>
<span id="userStatus">Guest User</span><br>
<input type="text" id="firstName" placeholder="First Name">
<input type="text" id="lastName" placeholder="Last Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="signupUser()">Sign Up</button>
<button onclick="loginUser()">Login</button>
<button onclick="logoutUser()">Logout</button>
</div>

<hr>

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<br>

Custom Scoring:
<select id="customPositive">
<option value="1">Right +1</option>
<option value="2">Right +2</option>
<option value="3">Right +3</option>
<option value="4" selected>Right +4</option>
</select>

<select id="customNegative">
<option value="0" selected>Wrong 0</option>
<option value="1">Wrong -1</option>
<option value="2">Wrong -2</option>
</select>

<br>

<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="quiz"></div>
<div id="result"></div>

<button onclick="loadChapterLeaderboard()">🏆 Chapter Leaderboard</button>
<button onclick="loadMainLeaderboard()">🌍 Main Leaderboard</button>

<div id="leaderboard"></div>

</div>

<script>

let quizQuestions=[];
let currentQuestion=0;

let customPositive=4;
let customNegative=0;

let practiceScore=0;
let officialScore=0;

let selectedChapter="";
let correctCount=0;

function loadScript(src,callback){
 let old=document.getElementById("chapterScript");
 if(old) old.remove();
 let script=document.createElement("script");
 script.src=src;
 script.id="chapterScript";
 script.onload=callback;
 document.body.appendChild(script);
}

function startQuiz(){
 selectedChapter=document.getElementById("chapterSelect").value;
 if(!selectedChapter){ alert("Select chapter"); return; }

 customPositive=parseInt(document.getElementById("customPositive").value);
 customNegative=parseInt(document.getElementById("customNegative").value);

 practiceScore=0;
 officialScore=0;
 correctCount=0;

 loadScript(selectedChapter,function(){
   quizQuestions=[...window.chapterQuestions];
   quizQuestions.sort(()=>Math.random()-0.5);
   quizQuestions=quizQuestions.slice(0,10);
   currentQuestion=0;
   loadQuestion();
 });
}

function loadQuestion(){
 const q=quizQuestions[currentQuestion];
 document.getElementById("quiz").innerHTML=`
 <div class="question-box">
 ${q.question}
 </div>
 <div class="options-grid">
 ${q.answers.map((ans,i)=>
 `<button class="option" onclick="checkAnswer(${i},this)">
 ${ans.text}
 </button>`).join("")}
 </div>`;
}

function checkAnswer(index,btn){
 const q=quizQuestions[currentQuestion];
 const buttons=document.querySelectorAll(".option");
 buttons.forEach(b=>b.disabled=true);

 if(q.answers[index].correct){
   btn.classList.add("correct");
   practiceScore+=customPositive;
   officialScore+=4;
   correctCount++;
 }else{
   btn.classList.add("wrong");
   practiceScore-=customNegative;
   officialScore-=1;
 }

 setTimeout(()=>{
   currentQuestion++;
   if(currentQuestion<quizQuestions.length){
     loadQuestion();
   }else{
     finishQuiz();
   }
 },800);
}

function finishQuiz(){
 document.getElementById("quiz").innerHTML="";
 document.getElementById("result").innerHTML=`
 <div class="result-card">
 <h2>Scorecard</h2>
 <p><b>Points Earned (Your Selected Pattern):</b> ${practiceScore}</p>
 <p><b>Official Score (4/-1 Pattern):</b> ${officialScore}</p>
 <button onclick="saveScore()">Save Official Score</button>
 </div>`;
}

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, setDoc, updateDoc, addDoc, getDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCODdCPvN4L96ye0YuxippaIUHnEUwnT90",
 authDomain: "mdquizzes-c255a.firebaseapp.com",
 projectId: "mdquizzes-c255a",
 storageBucket: "mdquizzes-c255a.firebasestorage.app",
 messagingSenderId: "510171455812",
 appId: "1:510171455812:web:dcead5207dc1272aa9b711"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

window.signupUser=async function(){
 const userCred=await createUserWithEmailAndPassword(auth,email.value,password.value);
 await setDoc(doc(db,"users",userCred.user.uid),{
   firstName:firstName.value,
   lastName:lastName.value,
   totalScore:0
 });
 alert("Signup Successful");
}

window.loginUser=async function(){
 await signInWithEmailAndPassword(auth,email.value,password.value);
 alert("Login Successful");
}

window.logoutUser=function(){
 signOut(auth);
}

onAuthStateChanged(auth, async (user)=>{
 if(user){
   const snap=await getDoc(doc(db,"users",user.uid));
   const data=snap.data();
   userStatus.innerText="Welcome "+data.firstName+" "+data.lastName;
 }else{
   userStatus.innerText="Guest User";
 }
});

window.saveScore=async function(){
 const user=auth.currentUser;
 if(!user){ alert("Login required"); return; }

 await addDoc(collection(db,"quizResults"),{
   uid:user.uid,
   chapter:selectedChapter,
   officialScore:officialScore,
   date:Date.now()
 });

 const userRef=doc(db,"users",user.uid);
 const snap=await getDoc(userRef);
 const oldTotal=snap.data().totalScore || 0;

 await updateDoc(userRef,{
   totalScore:oldTotal + officialScore
 });

 alert("Score Saved!");
}

window.loadChapterLeaderboard=async function(){
 const q=query(collection(db,"quizResults"),
 where("chapter","==",selectedChapter),
 orderBy("officialScore","desc"),
 limit(10));
 const snapshot=await getDocs(q);

 let html="<div class='leaderboard'><h3>Chapter Leaderboard</h3>";
 for(const docSnap of snapshot.docs){
   const userSnap=await getDoc(doc(db,"users",docSnap.data().uid));
   const name=userSnap.data().firstName+" "+userSnap.data().lastName;
   html+=`<p>${name} - ${docSnap.data().officialScore}</p>`;
 }
 html+="</div>";
 leaderboard.innerHTML=html;
}

window.loadMainLeaderboard=async function(){
 const q=query(collection(db,"users"),
 orderBy("totalScore","desc"),
 limit(10));
 const snapshot=await getDocs(q);

 let html="<div class='leaderboard'><h3>Main Leaderboard</h3>";
 snapshot.forEach(doc=>{
   const d=doc.data();
   html+=`<p>${d.firstName} ${d.lastName} - ${d.totalScore}</p>`;
 });
 html+="</div>";
 leaderboard.innerHTML=html;
}

</script>

</body>
</html>
