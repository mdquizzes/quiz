<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MD Quizzes - Pro Exam Mode</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background: radial-gradient(circle,#001f3f,#000814);
  color:white;
  text-align:center;
}

h1{
  color:gold;
  text-shadow:0 0 15px gold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

select,button{
  padding:8px;
  margin:6px;
  border-radius:6px;
  border:none;
}

.start-btn{
  background:gold;
  font-weight:bold;
  cursor:pointer;
}

.question-box{
  background:#002855;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
  box-shadow:0 0 15px #00bfff;
  font-size:20px;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.option{
  padding:12px;
  background:#001d3d;
  border:2px solid #00bfff;
  color:white;
  border-radius:15px;
  cursor:pointer;
  transition:0.3s;
}

.option:hover{
  background:#00bfff;
  color:black;
}

.correct{ background:green !important; }
.wrong{ background:red !important; }

#timer{
  font-size:18px;
  margin-top:10px;
  color:yellow;
}

/* Score Display */
.score-container{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px 0;
}

.digit-box{
  width:50px;
  height:60px;
  background:black;
  border:2px solid gold;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  color:gold;
  font-weight:bold;
  box-shadow:0 0 10px gold;
}
</style>
</head>

<body>

<h1>🎯 MD QUIZZES - PRO MODE</h1>

<div class="container">

<select id="chapterSelect">
<option value="">Select Chapter</option>
<option value="js/human_physiology.js">Human Physiology</option>
<option value="js/cell_biology.js">Cell Biology</option>
</select>

<br>

Questions:
<select id="questionCount">
<option value="5">5</option>
<option value="10">10</option>
<option value="15">15</option>
<option value="20">20</option>
</select>

Positive:
<select id="positiveMarks">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
</select>

Negative:
<select id="negativeMarks">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
</select>

<br>
<button class="start-btn" onclick="startQuiz()">Start Test</button>

<div id="timer">Time: 00:00:00</div>

<div class="score-container">
<div class="digit-box" id="d1">0</div>
<div class="digit-box" id="d2">0</div>
<div class="digit-box" id="d3">0</div>
<div class="digit-box" id="d4">0</div>
</div>

<div id="quiz"></div>
<div id="result"></div>

</div>

<script>

let allQuestions=[];
let questions=[];
let currentQuestion=0;
let score=0;
let totalQuestions=0;
let positive=1;
let negative=0;
let timerInterval;
let seconds=0;

function formatTime(sec){
 let h=Math.floor(sec/3600);
 let m=Math.floor((sec%3600)/60);
 let s=sec%60;
 return String(h).padStart(2,'0')+":"+
        String(m).padStart(2,'0')+":"+
        String(s).padStart(2,'0');
}

function startTimer(){
 seconds=0;
 clearInterval(timerInterval);
 timerInterval=setInterval(()=>{
   seconds++;
   document.getElementById("timer").innerText="Time: "+formatTime(seconds);
 },1000);
}

function loadScript(src,callback){
 let script=document.createElement("script");
 script.src=src;
 script.onload=callback;
 document.body.appendChild(script);
}

function shuffleArray(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function startQuiz(){

 const chapter=document.getElementById("chapterSelect").value;
 if(!chapter){ alert("Select chapter"); return; }

 positive=parseInt(document.getElementById("positiveMarks").value);
 negative=parseInt(document.getElementById("negativeMarks").value);
 totalQuestions=parseInt(document.getElementById("questionCount").value);

 score=0;
 updateScoreDisplay();

 loadScript(chapter,function(){

   allQuestions=[...questions];
   shuffleArray(allQuestions);

   questions=allQuestions.slice(0,totalQuestions);

   questions.forEach(q=>{
     let correctAnswer=q.options[q.correct];
     shuffleArray(q.options);
     q.correct=q.options.indexOf(correctAnswer);
   });

   currentQuestion=0;
   startTimer();
   loadQuestion();
 });
}

function loadQuestion(){
 const q=questions[currentQuestion];
 const quizDiv=document.getElementById("quiz");

 quizDiv.innerHTML=`
  <div class="question-box">
   Q${currentQuestion+1}. ${q.question}
  </div>
  <div class="options-grid">
   ${q.options.map((opt,i)=>
    `<button class="option" onclick="checkAnswer(${i},this)">${opt}</button>`
   ).join("")}
  </div>
 `;
}

function updateScoreDisplay(){
 let formatted=Math.max(0,score).toString().padStart(4,'0');
 document.getElementById("d1").innerText=formatted[0];
 document.getElementById("d2").innerText=formatted[1];
 document.getElementById("d3").innerText=formatted[2];
 document.getElementById("d4").innerText=formatted[3];
}

function checkAnswer(index,btn){

 const correctIndex=questions[currentQuestion].correct;
 const buttons=document.querySelectorAll(".option");

 buttons.forEach(b=>b.disabled=true);

 if(index===correctIndex){
   btn.classList.add("correct");
   score+=positive;
 }else{
   btn.classList.add("wrong");
   buttons[correctIndex].classList.add("correct");
   score-=negative;
 }

 updateScoreDisplay();

 setTimeout(()=>{
   currentQuestion++;
   if(currentQuestion<questions.length){
     loadQuestion();
   }else{
     clearInterval(timerInterval);
     document.getElementById("quiz").innerHTML="";
     document.getElementById("result").innerHTML=
       `<h2>Test Finished</h2>
        <p>Final Score: ${score}</p>
        <p>Total Time: ${formatTime(seconds)}</p>`;
   }
 },1000);
}

</script>
</body>
</html>
