<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Big Countdown Timer</title>

<style>
    body {
        margin: 0;
        background: black;
        color: #00ffcc;
        font-family: 'Arial', sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #setup {
        text-align: center;
    }

    input {
        padding: 15px;
        font-size: 24px;
        width: 250px;
        text-align: center;
        border-radius: 10px;
        border: none;
        outline: none;
    }

    #timer {
        display: none;
        font-size: 18vw; /* 🔥 auto fullscreen scaling */
        font-weight: bold;
        text-align: center;
        letter-spacing: 5px;

        /* Glow Effect */
        text-shadow: 
            0 0 10px #00ffcc,
            0 0 20px #00ffcc,
            0 0 40px #00ffcc,
            0 0 80px #00ffcc;
    }

    #label {
        position: absolute;
        top: 20px;
        font-size: 18px;
        color: #aaa;
    }
</style>
</head>

<body>

<div id="setup">
    <h2>Set Timer (HH:MM:SS)</h2>
    <input type="text" id="timeInput" placeholder="00:05:00" />
    <p>Press Enter</p>
</div>

<div id="label">Countdown</div>
<div id="timer">00:00</div>

<script>
let interval;

document.getElementById("timeInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        startTimer(this.value);
    }
});

function startTimer(timeStr) {
    let parts = timeStr.split(":").map(Number);

    if (parts.length !== 3) {
        alert("Use HH:MM:SS format");
        return;
    }

    let totalSeconds = parts[0]*3600 + parts[1]*60 + parts[2];

    if (totalSeconds <= 0) return;

    document.getElementById("setup").style.display = "none";
    document.getElementById("timer").style.display = "block";

    updateDisplay(totalSeconds);

    interval = setInterval(() => {
        totalSeconds--;

        if (totalSeconds <= 0) {
            clearInterval(interval);
            document.getElementById("timer").innerText = "00";

            // Flash effect on finish
            document.body.style.background = "red";
            return;
        }

        updateDisplay(totalSeconds);

    }, 1000);
}

function updateDisplay(seconds) {
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    let display = "";

    if (h > 0) {
        display = 
            String(h).padStart(2, '0') + ":" +
            String(m).padStart(2, '0') + ":" +
            String(s).padStart(2, '0');
    } else if (m > 0) {
        display = 
            String(m).padStart(2, '0') + ":" +
            String(s).padStart(2, '0');
    } else {
        display = String(s).padStart(2, '0');
    }

    document.getElementById("timer").innerText = display;
}
</script>

</body>
</html>
