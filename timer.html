<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Countdown Timer</title>

<style>
    body {
        margin: 0;
        background: black;
        color: #ffff00; /* bright yellow */
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #setup {
        text-align: center;
        color: white;
    }

    input {
        padding: 15px;
        font-size: 24px;
        width: 250px;
        text-align: center;
        border-radius: 10px;
        border: none;
    }

    #timer {
        display: none;
        font-size: 18vw;
        font-weight: bold;
        letter-spacing: 8px;
        text-align: center;

        /* Strong glow for distance visibility */
        text-shadow: 
            0 0 10px #fff,
            0 0 20px #ff0,
            0 0 40px #ff0,
            0 0 80px #ff0,
            0 0 120px #ff0;
    }

    .blink {
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.2; }
        100% { opacity: 1; }
    }
</style>
</head>

<body>

<div id="setup">
    <h2>Set Timer (HH:MM:SS)</h2>
    <input type="text" id="timeInput" placeholder="00:05:00" />
    <p>Press Enter</p>
</div>

<div id="timer">00:00</div>

<script>
let interval;

// Ask notification permission
if ("Notification" in window) {
    Notification.requestPermission();
}

document.getElementById("timeInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        startTimer(this.value);
    }
});

function startTimer(timeStr) {
    let parts = timeStr.split(":").map(Number);

    if (parts.length !== 3) {
        alert("Use HH:MM:SS format");
        return;
    }

    let totalSeconds = parts[0]*3600 + parts[1]*60 + parts[2];

    if (totalSeconds <= 0) return;

    document.getElementById("setup").style.display = "none";
    document.getElementById("timer").style.display = "block";

    updateDisplay(totalSeconds);

    interval = setInterval(() => {
        totalSeconds--;

        if (totalSeconds <= 0) {
            clearInterval(interval);
            timeUp();
            return;
        }

        updateDisplay(totalSeconds);

    }, 1000);
}

function updateDisplay(seconds) {
    let h = Math.floor(seconds / 3600);
    let m = Math.floor((seconds % 3600) / 60);
    let s = seconds % 60;

    let display = "";

    if (h > 0) {
        display = 
            String(h).padStart(2, '0') + ":" +
            String(m).padStart(2, '0') + ":" +
            String(s).padStart(2, '0');
    } else if (m > 0) {
        display = 
            String(m).padStart(2, '0') + ":" +
            String(s).padStart(2, '0');
    } else {
        display = String(s).padStart(2, '0');
    }

    document.getElementById("timer").innerText = display;
}

function timeUp() {
    document.body.style.background = "red";
    let timer = document.getElementById("timer");
    timer.innerText = "TIME UP!";
    timer.classList.add("blink");

    // 🔔 Browser Notification
    if (Notification.permission === "granted") {
        new Notification("⏰ Time is up!");
    }

    // 🔊 Beep sound
    let audio = new Audio("https://www.soundjay.com/buttons/beep-07.wav");
    audio.play();
}
</script>

</body>
</html>
